": "MC1-1207", "q": "在A、B、C、D四类放大器中，可以用作10kHz至60MHz宽带射频信号单管线性功率放大器的类别有：（不考虑电源效率）", "options": ["A", "B", "C", "D"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1208", "q": "在A、B、C、D四类放大器中，可以用作对讲机的FM射频功率放大器的全部类别有：（不考虑电源效率）", "options": ["A、B、C、D", "A、B、C", "A、B、D", "A"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1209", "q": "在A、B、C、D四类放大器中，可以用作CW射频功率放大器的全部类别有：（不考虑电源效率；假定以K=5来确定CW信号的必要带宽）", "options": ["A、B", "A、B、C", "A、B、D", "A、B、C、D"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1210", "q": "在A、B、C、D四类放大器中，适宜用作小信号放大器的是：", "options": ["A", "B", "C", "D"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1211", "q": "在A、B、C、D四类放大器中，属于大信号放大器的全部类别有：", "options": ["B、C、D", "A、B、C、D", "A、C、D", "C、D"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1212", "q": "很多业余无线电设备中的音频功率放大电路采用两个串联的输出功率管，分别负责音频信号正、负半周的放大。这种电路的典型名称和作用是：", "options": ["推挽放大电路，实现极小静态偏置电流的高电源效率的线性功率放大", "双管串联电路，得到双倍的输出电流和输出功率", "双管串联电路，得到较高的输出阻抗以改善其与负载之间的阻抗匹配", "双管串联电路，得到较高的输入阻抗以改善其与前级之间的阻抗匹配"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1214", "q": "有时，业余无线电爱好者使用两支并联的功率管制作射频线性放大器的末级或末前级电路。这是为了：", "options": ["双管并联，获得双倍的输出电流和输出功率", "构成推挽电路，减小输出波形的失真", "双管并联，得到双倍的器件耐压，减小损坏几率", "双管并联，使各功率管的失真互相抵消，降低杂散发射"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1215", "q": "放大器的负反馈是指这样的电路：", "options": ["将放大器输出信号的一部分回输到放大器的输入端，起到抵消输入信号的作用", "将放大器输出信号的一部分回输到放大器的输入端，起到加强输入信号的作用", "将放大器输入信号的一部分直通到放大器的输出端，起到抵消输出信号的作用", "将放大器输入信号的一部分直通到放大器的输出端，起到加强输出信号的作用"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1218", "q": "具有恒定内阻的信号源与负载达成阻抗“匹配”时，信号源内阻所消耗的功率：", "options": ["与负载所得到的输出功率相等", "是负载所得的输出功率的一半", "对于优质信号源，这样的损耗实际为零", "这个命题仅适用于直流电路，不适用于交流输出的信号源"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1219", "q": "电路的“非线性失真”是指该电路的输出信号与输入信号相比发生了下列改变：", "options": ["产生了新的频率分量", "各频率分量的比例发生了改变", "信号的幅度发生了改变", "不同频率分量的相位延迟发生了改变"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1221", "q": "频率为f的正弦或余弦信号与频率为f的复杂周期信号在频谱上有什么不同？", "options": ["前者为频率为f的单一频率分量；后者为频率为f整数倍的多个频率分量", "前者为频率为f的单一频率分量；后者为频率为f分数倍的多个频率分量", "前者为频率为f奇数倍的多个频率分量；后者为频率为f偶数倍的多个频率分量", "前者为连续频率分量；后者为离散频率分量"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1222", "q": "单个无限窄脉冲的频谱特征是：", "options": ["均匀分布的连续频率分量", "梳状分布的离散频率分量", "单一的减幅振荡波形", "幅度非零的直流分量"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1223", "q": "只包含一个频率分量的信号是：", "options": ["该频率的简谐信号", "该频率的对称方波", "该频率的减幅振荡脉冲", "该频率的无限窄脉冲串"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1224", "q": "在整个频谱空间中具有均匀分布的连续频率分量的信号是：", "options": ["单个无限窄脉冲", "任意频率的正弦或余弦信号", "任意频率的对称方波", "任意频率的减幅振荡脉冲"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1225", "q": "某业余电台在发射单边带语音信号时，设备近旁连接至某电路的一副耳机传出了模糊不清的语音。这个电路具备哪种功能？", "options": ["检波", "差拍", "变频", "振荡"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1226", "q": "某业余电台发射等辐电报时，设备近旁连接至某电路的一副耳机传出了“嘟嘟”的音频电码声。这个电路具备哪种功能？", "options": ["差拍", "检波", "变频", "振荡"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1227", "q": "爱好者小强实验某个电路。接通电源时，近旁的收信机收到了类似鸟鸣的声音。断开电源，鸟鸣消失。小强的电路具备哪种功能？", "options": ["振荡", "差拍", "检波", "变频"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1228", "q": "频率为f1、f2的两个信号流经同一个非线性元件会彼此互调，其中的三阶互调产物可能成为收信机中的假信号或发信机输出的一种杂散。三阶互调产物的频率可以计算为：", "options": ["2f1±f2、2f2±f1", "2f1、3f1、2f2、3f2", "f1±f2、2f1±2f2、3f1±3f2", "4f1±f2、5f1±2f2、6f1±3f2……"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1230", "q": "业余无线电爱好者常用倍频器获取输入信号整倍频率的输出信号。倍频器的工作原理为：", "options": ["利用有源器件的非线性使输入信号产生谐波，再用谐振电路选出所需倍频分量", "利用线性放大器产生输入信号的系列谐波，再用谐振电路选出所需的某次倍频", "将LC谐振电路调谐到输入信号的某个谐波频率上，所得输出既为倍频信号", "利用标称频率等于倍频的石英晶体谐振器组成振荡器，所得输出就是倍频信号"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1235", "q": "在下列调制方式中，已调信号的载波相位恒定不变的是：", "options": ["幅度调制AM", "频率调制FM", "相移键控PSK", "频移键控FSK"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1236", "q": "在下列调制方式中，已调信号的载波分量恒定不变的是：", "options": ["幅度调制AM", "频率调制FM", "相移键控PSK", "频移键控FSK"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1237", "q": "在下列调制方式中，已调信号中仅包含一组与调制信号的信息相对应的边带的是：", "options": ["抑制载波单边带幅度调制SSB", "幅度调制AM", "等幅电报CW", "抑制载波双边带幅度调制DSB"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1238", "q": "二极管环形调制器可以用来制作乘积检波器。这种检波器的作用是：", "options": ["用来给CW或SSB信号检波", "用来给FM信号检波", "用来给调相信号检波", "用来将话音从背景噪声中提取出来"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1239", "q": "二极管环形调制器可以用来制作超外差式接收机的混频器。这种混频器的作用是：", "options": ["将接收到的射频信号转换为中频信号", "将几个电台的信号混合在一起", "阻止中频通带以外的不必要信号", "从一些辅助设备获取电台输入，如TNC"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1240", "q": "二极管环形调制器可以用来制作外差式发射机的混频器。这种混频器的作用是：", "options": ["将已调中频信号转换为射频信号", "将音频基带和数字基带信号混合在一起", "阻止通带以外不必要的信号", "向一些辅助设备输出电台信号，如TNC"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1241", "q": "二极管环形调制器可以用来产生双边带抑制载波调幅信号。其工作原理是：", "options": ["利用这种调制器的乘法性质，将载波与音频基带相乘，获得DSB输出", "利用这种调制器的加法性质，将载波与音频基带相叠加，获得DSB输出", "利用这种调制器的均方根性质，去除音频基带的极性，获得DSB输出", "利用这种调制器的高通滤波作用，去除音频，获得射频载波和DSB输出"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1242", "q": "二极管环形调制器可以用来产生载波不受抑制的普通AM信号。其工作原理是：", "options": ["只需为输入基带适当叠加直流分量，使基带极性不发生反转，即可获得AM输出", "只需在输入基带上适当叠加导频分量，使载波极性不停反转，即可获得AM输出", "只需增加载波的输入功率，迫使调制器的输出出现载波泄漏，即可获得AM输出", "只需调转调制器的输入和输出端口，即可获得AM输出"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1243", "q": "构成振荡器的必备元素是：", "options": ["放大倍数大于1的放大器、正反馈电路", "放大倍数大于1的放大器、负反馈电路", "LC或晶体谐振电路、正反馈电路", "任意放大器、LC或晶体谐振电路"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1244", "q": "在SSB接收机的天线端口插入一段导线，导线的另一端靠近一个晶体管LC振荡电路去尝试接收。振荡器通电后，所收信号的音调会从低到高或从高到低持续变化。主要原因是：", "options": ["元器件通电发热使电路整体的LC参数不断变化，导致频率漂移", "晶体管正处在老化过程中。这种电路越用越稳定", "接收机将收到的声音回馈至电路板，为振荡器额外增添了能量", "射频能量不断对外辐射，致使电路的输出功率不断下降"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1245", "q": "计量术语“ppm”经常出现在发射设备参数规格书或是业余无线电文献中。其涵义为：", "options": ["“百万分之几”，描述电台设备的频率容限", "“每分钟脉冲数”，描述随机过程的观察结果", "“每分钟点数”，描述太阳黑子的发生频度", "“预防性计划维护”，描述电台设备的维护策略"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1247", "q": "有时，我们会在业余自制的收发信机或其电路图中看到缩写为VXO的功能或电路组件。它代表：", "options": ["可变频率石英晶体振荡器", "可变频率振荡器", "石英晶体振荡器", "压控振荡器"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1248", "q": "有时，我们会在业余无线电文献或某设备的电路图中看到缩写为VCO的电路。它代表：", "options": ["压控振荡器", "可变频率石英晶体振荡器", "可变频率振荡器", "石英晶体振荡器"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1249", "q": "有时，我们会在业余无线电文献或某设备的电路图中看到缩写为XTAL的元件。它代表：", "options": ["石英晶体谐振器", "可变频率振荡器", "石英晶体振荡器", "压控振荡器"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1250", "q": "为提升无线电设备的频率稳定度，人们研制了多种高Q值压电谐振元件。考虑这类元件多可做成振荡器，则下列常见振荡器按频率稳定度由低到高可以排列为：", "options": ["RC振荡器，LC振荡器，陶瓷振子振荡器，石英声表面波振荡器，石英晶体振荡器", "LC振荡器，RC振荡器，陶瓷振子振荡器，石英声表面波振荡器，石英晶体振荡器", "RC振荡器，LC振荡器，石英声表面波振荡器，石英晶体振荡器，陶瓷振子振荡器", "RC振荡器，陶瓷振子振荡器，LC振荡器，石英晶体振荡器，石英声表面波振荡器"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1253", "q": "电路的“相位失真”是指该电路的输出信号与输入信号相比发生了下列改变：", "options": ["不同频率分量的相位延迟发生了改变", "产生了新的频率分量", "各频率分量的比例发生了变化", "信号的幅度发生了改变"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1254", "q": "电路的“频率失真”是指该电路的输出信号波形与输入信号相比发生了如下变化：", "options": ["各频率分量的比例发生了变化", "信号的幅度发生了改变", "产生了新的频率分量", "不同频率分量的相位延迟发生了改变"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1255", "q": "组装业余收发信机时，爱好者常用谐振回路来筛选特定频率的信号。组成谐振回路的主要元件包括：", "options": ["电容和电感的组合", "电阻和电容的组合", "电感和电阻的组合", "半导体三极管和电阻的组合"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1256", "q": "制作倍频器会用到高性能带通滤波器或是某种选择性优良的LC谐振回路。下列LC回路中，选择性最佳的是：", "options": ["松耦合的高Q单调谐或同频双调谐回路", "紧耦合高Q同频双调谐回路", "松耦合低Q同频双调谐回路", "松耦合高Q参差调谐回路"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1257", "q": "低通滤波器的“截止频率”是指：", "options": ["滤波器的频率响应从相对于通带的0dB下降3dB时的频率", "高于该频率的信号将被滤波器完全切除", "低于该频率的信号将被滤波器完全切除", "高于该频率的信号会在滤波器中发生非线性失真"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1258", "q": "带通滤波器的“3dB带宽”是指：", "options": ["在通带中心频率的两侧，通带响应下降3dB时两个频率之间的间隔", "输出信号相对于输入信号衰减3dB以上（含3dB）时的频带宽度", "输出信号相对于输入信号衰减3dB以下（含3dB）时的频带宽度", "滤波器维持3dB增益时的频带宽度"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1259", "q": "滤波器有一个称为“通带波动”的参数，是指：", "options": ["滤波器在通带范围内的衰减特性变化幅度", "滤波器频率特性在整个频谱范围内的变化趋势", "CW信号通过滤波器时键控边沿附近的信号幅度发生抖动的现象", "滤波器因元器件不稳定等随机因素而使输出信号增益波动的现象"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1261", "q": "假设业余中继台的收、发信机共用一副天线，上行和下行频率分别为F1和F2。在架设该台时，为了防止发信机的射频输出阻塞收信机的正常接收，可用措施为：", "options": ["在发信机与天线间串联中心频率为F1的带阻滤波器，在收信机与天线间串接中心频率为F2的带阻滤波器", "在发信机与天线间串联中心频率为F1的带通滤波器，在收信机与天线间串接中心频率为F2的带通滤波器", "在发信机与天线间串联中心频率为F2的带阻滤波器，在收信机与天线间串接中心频率为F2的带阻滤波器", "在发信机与天线间串联中心频率为F1的带阻滤波器，在收信机与天线间串接中心频率为F1的带阻滤波器"], "ans": [0], "classes": ["C"]}, {"id": "MC1-1262", "q": "要防止HF业余电台发 , {"id": "MC2-0468", "q": "利用个人电脑（PC）和用于话音的普通收发信机进行SSTV通联的操作方法为：", "options": ["在短波波段：FM（图像信息的音频基带调制）和SSB（频率搬移）", "在超短波波段：FM（图像信息的音频基带调制）和FM（复合调制）", "在短波波段：FSK（图像信息的音频基带调制）和SSB（频率搬移）", "在超短波波段：FSK（图像信息的音频基带调制）和FM（复合调制）"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0474", "q": "有时，业余电台使用VSB来传输模拟ATV信号。这种方式虽然属于AM，却只发送一个完整边带以及另一边带靠近载波的一小部分。在传输模拟视频时，VSB的优点是：", "options": ["较AM方式的发射带宽更窄", "确保视频信号中的低频分量的保真度", "确保黑电平与白电平的负极性发送", "较单边带方式更省发射功率"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0507", "q": "关于数字通信模式JT65，以下描述正确的是：", "options": ["即便QRP操作，爱好者也能够使用JT65联络距离很远的电台", "发送一条JT65消息大约需要50秒。通信速度不是很快", "JT65适合千瓦级别的业余电台使用，否则难以联络远方电台", "JT65每分钟可以发送大约50条消息。通信效率非常高"], "ans": [0, 1], "classes": ["B", "C"], "img": "MC2-0507"}, {"id": "MC2-0508", "q": "FT8信号常见于HF和VHF业余频段。这种方式的优点是：", "options": ["即使发射功率很小，成功联络远距离业余电台的概率也很大", "FT8可以用来探索大气波导、流星余迹和对流层散射通信", "虽然FT8的发射带宽只有3kHz，其中仍包含大量冗余信息", "FT8的符号速率约是50bps并使用5单位博多码传输消息"], "ans": [0, 1], "classes": ["B", "C"], "img": "MC2-0508"}, {"id": "MC2-0510", "q": "FT4是与FT8类似的一种通信方式。其特点是：", "options": ["FT4的消息发送速度大约是FT8的2倍，但是误码率稍高", "FT4的联络效率与RTTY基本相当，但是所用带宽更窄", "FT4不适合用来探索流星余迹等突发性电波传播现象", "FT4与FT8一样，也使用5单位博多码传输消息"], "ans": [0, 1], "classes": ["B", "C"], "img": "MC2-0510"}, {"id": "MC2-0549", "q": "北京某20岁女大学生参加ALL ASIAN DX CONTEST SSB单人组比赛。她发给别人的信号报告可以是：", "options": ["5900", "5920", "5944", "5924"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0566", "q": "一个可以工作的无线电接收系统至少包含哪些部件？", "options": ["接收天线", "解调器", "电位器", "电源"], "ans": [0, 1], "classes": ["A"]}, {"id": "MC2-0582", "q": "亚音和数字亚音静噪技术都是在调频发射机所发射的语音信号上附加一个人耳不易察觉的低频信号并用来选通接收机的静噪。它们所对应的收发信机设置菜单项有：", "options": ["CTCSS", "DCS", "DTMF", "SQL"], "ans": [0, 1], "classes": ["A"]}, {"id": "MC2-0605", "q": "关于接收机的“过载”现象，以下描述正确的是：", "options": ["输入信号过于强大以至机内电路饱和阻塞，严重时会损坏接收机前端电路的元器件", "启用接收机的ATT功能可消除或缓解过载", "接收机消耗的电流过大，致使电源出现过载现象。情况严重时供电装置会烧毁", "减小接收机的喇叭音量，可缓解过载现象"], "ans": [0, 1], "classes": ["A", "B", "C"], "img": "MC2-0605"}, {"id": "MC2-0628", "q": "业余电台的异频收发操作方式（SPLIT）主要适用于什么场景？", "options": ["大量电台持续地同时回答本台的呼叫，造成严重的信号堆叠（pile-up）。此时可要求各台在高于本台主载波大约2-5kHz的频率上异频抢答，以免各台都无法听清本台的信号", "双方处于不同的国际无线电分区，工作频段或方式存在一定差异，但是需要相互通联", "两个业余电台不想让其他业余电台听到完整的对话内容", "某个业余电台使用了独立的收信和发信设备，且确实无法使之同频工作"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0638", "q": "短截线滤波器有时也叫分支线滤波器（coax stub），是利用馈线制作的带通或带阻滤波器，时有见于业余无线电比赛设施中。对于这种滤波器，以下描述正确的有：", "options": ["40米波段的1/4波长（电长度）末端短路同轴电缆：通过40米和15米信号，短路20米和10米波段的谐波", "40米波段的1/4波长（电长度）末端开路同轴电缆：通过20米和10米信号，短路40米和15米波段的谐波", "40米波段的1/2波长（电长度）末端短路同轴电缆：通过40米和15米信号，短路20米和10米波段的谐波", "40米波段的1/2波长（电长度）末端开路同轴电缆：通过20米和10米信号，短路40米和10米波段的谐波"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0640", "q": "某些收发信机内置了辅助接收机，主要用于：", "options": ["使用独立的接收天线以任意频率独立调谐，实现异频操作", "使用独立的接收天线与主接收机同频工作，实现分集接收", "将I/Q基带信号输出至耳机接口，以实现独立的RTTY解码", "将中频信号输出至IF接口，以连接独立的波段频谱显示器"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0641", "q": "分集接收用多个接收机同时捕获同一信号，以获取更完整的信息并使信号更易辩识。但是，为收发信机的辅助接收机架设用于分集接收的独立接收天线时需注意：", "options": ["这种天线应距主天线远一些；例如，至少1个工作波长", "这种天线的极化最好与主天线正交；例如，分别使用水平和垂直天线", "为捕获更多信息，我们要为这种天线安装前置放大器", "如果天线是宽带的，我们必须为其安装外置式波段预选器"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0651", "q": "关于天线的增益，以下说法正确的是：", "options": ["待测天线最大辐射方向上的辐射功率密度与基准天线对应值的比值", "与参考天线相比，被测天线在某个方向上使信号增强的程度", "天线辐射的电波功率与输入到天线的射频功率之比", "天线发热耗散的功率与输入到天线的射频功率之比"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0659", "q": "关于振子长度为1/4波长的垂直接地天线的最大辐射方向，以下描述正确的是：", "options": ["在水平方向上是全向的", "在垂直方向上有指向性，且辐射仰角稍大于0°", "其E面方向图为“8”字形", "其H面方向图为“8”字形"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0660", "q": "关于大多数手持电台随附的“橡胶天线”，以下说法正确的是：", "options": ["就电台的一般持握方式而言，电波的垂直极化分量要强一些", "相对于全尺寸天线，“橡胶天线”的发射与接收增益都低一些", "如果橡胶护套内的天线是螺旋加感的，则电波是旋转极化的", "如果橡胶护套某处开裂，则振子会迅速解体，天线随即报废"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0672", "q": "小强用长度不短于1/4波长的50欧馈线连接收发信机和天线。发信时，他发现SWR表的指示为3:1。该值意味着：", "options": ["馈线中任意位置上的最大峰值电压与最小峰值电压之比为3:1", "馈线中任意位置上的最大峰值电流与最小峰值电流之比为3:1", "馈线中的驻波致使平均射频电压高于常值，这降低了导体损耗", "馈线中的驻波致使平均射频电流高于常值，这降低了介质损耗"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0680", "q": "在为业余电台选购用作天线馈线的同轴电缆时应关注什么电气参数？", "options": ["特性阻抗", "指定频率下每百米的传输损耗", "芯线的截面积和最大额定电流", "电介质的耐压和最高允许温升"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0681", "q": "我们都知道要为业余电台选配损耗较低的馈线。但是，馈线的损耗会导致什么问题？", "options": ["发信功率降低", "收信信噪比下降", "驻波比的测量值永远高于1:1", "发出的信号失真"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0682", "q": "受潮是同轴电缆失效损坏的主要原因。湿气渗透会导致：", "options": ["介质损耗变大", "屏蔽层或芯线氧化、锈蚀，甚至断路", "速度因子逐渐大于1", "驻波比越来越小于1"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0689", "q": "关于垂直天线，以下说法正确的是：", "options": ["该天线发射垂直极化波，电场与地面垂直", "垂直天线是全向天线，其H面方向图是全向的", "该天线发射垂直极化波，磁场与地面垂直", "垂直天线是全向天线，其E面方向图是全向的"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0690", "q": "关于水平极化偶极天线，以下描述正确的是：", "options": ["通过该天线发射的电磁波，电场平行于地面", "该天线水平面上的（E面）方向图呈“8”字展开", "通过该天线发射的电磁波，电场垂直于地面", "该天线垂直面上的（H面）方向图呈“8”字展开"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0712", "q": "使用VSB方式进行ATV通信时，即使信号相对较强，有时所收图像的边缘也有重影。这是因为：", "options": ["多径传播。来自不同路径的信号到达接收天线的时延不同，造成重影", "发射天线的VSWR过高。如果信号在馈线中多次往返于发射机和天线，会造成重影", "天线的极化配置出错。极化不同的信号同时到达天线，导致重影", "遭遇了重放干扰。或许是某中继台也转发了这个信号，其到达接收天线，导致重影"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0762", "q": "关于同轴电缆特性阻抗，以下说法正确的是：", "options": ["外导体的内径与内导体的外径之比越大，特性阻抗越高", "绝缘介质的介电常数越小，特性阻抗越高", "外屏蔽层越致密，特性阻抗越高", "电缆的外径越粗，特性阻抗越高"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0767", "q": "由场源（比如天线）产生的电场会形成位移电流，在其周边激起变化的磁场。该磁场又会在稍远处再次激起变化的电场。这个过程周而复始，形成传向远方的电磁波。关于电磁波的传播，以下描述正确的是：", "options": ["在一定场强下，频率越高，位移电流越强，场源辐射的能量也越多", "只有场源为某种开放系统，变化的电磁场才能向远方传播开来", "在一定能量下，频率越高，位移电流越强，场源辐射的场强也越强", "只有场源为某种封闭系统，变化的电磁场才能在同一时空中传播开来"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0774", "q": "自由空间中的无线电波随传播距离的增加逐渐发散减弱，形成路径损耗。该损耗可以描述为L=32.4 + 20log(d) + 20log(f)（其中，损耗L的单位为dB，距离d的单位是 km而频率f的单位为MHz）。关于L，以下描述正确的是：（“X＾M”表示“X的M次方”）", "options": ["当频率一定时，距离增加到N倍，L增大到N＾2倍", "当距离一定时，频率增加到N倍，L增大到N＾2倍", "当频率一定时，距离增加到N倍，L增大到log(N)倍", "当距离一定时，频率增加到N倍，L增大到log(N)倍"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0785", "q": "关于电磁波的波阻抗Z，以下描述正确的是：", "options": ["在电磁波的传播过程中，电场E和磁场H在空间的比值称为波阻抗Z", "随电磁波传向远方，Z逐渐趋于常数。此时E和H可以相互推算而出", "无线电波从馈线进入发射天线的馈电点时遇到的阻碍即为波阻抗Z", "无线电波从馈线进入发射天线的馈电点时遇到的反射即为波阻抗Z"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0795", "q": "无线电信号经地面和电离层交相反射之后会有什么改变？", "options": ["信号的极化特性会伴随时间随机改变", "信号的不同频率成分会伴随时间随机衰落", "信号的上下边带会伴随时间随机反转", "信号中随时都会夹杂强力广播电台的播音"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0800", "q": "喜爱HF通联的爱好者大都了解术语“最高可用频率（MUF）”。其涵义为：", "options": ["在地球上的两点间通过天波建立HF联络时可以使用的最高频率", "通常，MUF在夜间降低，在白天显著升高", "当MUF偶尔达到数百兆赫兹时，VHF/UHF可能出现超视距传播", "使用较低仰角的天线进行DX通联时，需将MUF估计得低一些"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0804", "q": "电离层对短波传播的影响主要体现为：", "options": ["F2、F1和E层反射电波", "D层不反射电波，但是吸收电波", "D2和D1层不反射电波，但是吸收电波", "C2、C1和F层白天反射电波，夜晚吸收电波"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0836", "q": "关于收发信机的AGC功能，以下说法正确的有：", "options": ["AGC实现收信机自动增益控制，对中频信号进行检测并反馈控制，防止电路过载", "进行基于FSK或PSK的数据通信时，关闭AGC功能有可能提高弱信号的解码效果", "进行太阳噪声测试的时候，需要关闭AGC功能", "AGC实现收信机自动音量控制，对音频电平进行检测并反馈控制，防止扬声器损坏"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0896", "q": "有时，160/80米波段业余无线电测向机所用的带屏蔽环形天线会被类似于中波收音机的磁棒天线所替代。这是因为：", "options": ["如将磁棒上的线圈中置，则天线的接收特性与环形天线相似。并且，设备还会更小巧", "接近发射机时，非屏蔽磁棒天线的电容感应会影响方向性，选手需熟练应对这种情况", "接近发射机时，变强的信号使磁棒饱和，这相当于实现了自动增益控制（AGC）功能", "接近发射机时，变强的信号使磁棒饱和，这相当于添加了衰减器，便于选手测定方位"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0897", "q": "有时，两米波段ARDF接收机会选配仅有驱动和反射两个单元的八木天线。这是因为：", "options": ["二单元天线仍有一定的单向性并更为轻便。对熟练的测向选手来说，其仍不失实用性", "在接近发信电台的近场区，选手通常利用天线的零点辅助定位。此时单元数并不关键", "在接近发信电台的近场区，选手可以为天线临时添加一个引向器以获得尖锐的方向性", "在接近发信电台的近场区，三单元八木天线的方向性反而变差，影响正确测定方位角"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0898", "q": "有时，业余无线电爱好者会使用HB9CV天线来自制两米波段ARDF接收机。关于HB9CV天线，以下说法正确的是：", "options": ["该天线是一种双驱动单元八木天线，引向器与反射器通过移相跳线以225°分相馈电", "HB9CV天线带宽较宽，水平和垂直方向上的单向特性理想，并且便于选手移动携带", "但是，这种天线需要通过电容耦合来抵消移相跳线的感抗，这会导致SWR居高不下", "HB9CV天线是轻便高效的业余无线电测向天线，可惜无法用于通联，其具有方向性"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0900", "q": "在HF业余频段的数据通信段中，我们有时会在SSB方式下听到一种音调不变但似乎又在不断颤动的信号。使用这种信号的通信方式可能是：", "options": ["BPSK31", "QPSK31", "FT4", "SSTV或FAX"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-0916", "q": "导体是易于传导电流的物质或材料。以下关于导体的正确描述是：", "options": ["导体中存在大量的可自由移动的电子或离子，施加电压可产生电流", "多数金属都是导电性能优良的导体，比如银、铜和铝", "有些金属在高温下呈现零电阻特性，成为超导体", "某些金属具有压电效应，可用来制作电声元件"], "ans": [0, 1], "classes": ["A", "B"]}, {"id": "MC2-0925", "q": "如果将导体置于静电场中，导体将呈现如下特点：", "options": ["静电平衡后，导体是等势体，内部场强为零，外表面出现电荷", "外表面曲率很小时，导体表面的电荷会高度聚集。这可能形成尖端放电", "静电平衡后，导体是等势体，内部电荷与外表面电荷极性相反", "外表面曲率很大时，导体表面的电荷会高度聚集。这可能形成尖端放电"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0926", "q": "直流电（DC）是以电荷的运动方向始终不变来定义的。关于直流电，以下描述正确的是：", "options": ["直流电源的输出端有正负极之分", "电池提供的是直流电", "直流电压通常为13.8伏。这样的低压即使短路也没什么危害", "脉动直流电不含交流成分，因为电荷的运动方向始终不变"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-0938", "q": "直流电路欧姆定律是说：", "options": ["流过电阻的电流I与电阻两端的电压U成正比，与阻值R成反比", "电阻两端的电压U与流过电阻的电流I成正比，与阻值R成正比", "流过电阻的电流I与电阻两端的电压U成正比，与阻值R成正比", "电阻两端的电压U与流过电阻的电流I成正比，与阻值R成反比"], "ans": [0, 1], "classes": ["A", "B", "C"], "img": "MC2-0938"}, {"id": "MC2-0974", "q": "有些收发信机会在13.8V直流电源插座附近安装一个标有数字的复位按钮。其作用是什么？", "options": ["当设备过流时切断电源", "当电源极性接反时切断电源", "如果工作温度超过数字所注的温度值则切断电源", "如果工作电压超过数字所注的伏特数则切断电源"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-1056", "q": "我们通常讨论的谐振电路的Q值均指该电路与规定负载相连之后的“有载Q值”。但是，我们也时而讨论术语“空载Q值”。其涵义为：", "options": ["空载Q值是回路自身储能与自身损耗之比，所以该值高代表回路的制作质量好", "空载Q值主要取决于回路中电感的Q值，因为电容的损耗通常较电感为低", "空载Q值越高则谐振电路的工作带宽越窄，所以没必要追求该值的最大化", "空载Q值与有载Q值的比值过大说明回路的储能过多。这样的电路易打火损坏"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1083", "q": "制作工作电压较高的电路应当关注元器件的耐压。这可以提高电路的安全性。要确保所用电阻的耐压，可供借鉴的经验有：", "options": ["咨询厂商，选用额定耐压较高的产品；或，尝试选用封装尺寸较大一些的", "如果所选产品不能满足设计要求，可将多支电阻串联使用", "尽量选用比较高级的产品，例如金属膜电阻就比碳膜的好", "当所选产品不满足设计要求时，可将多支电阻并联起来用"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1084", "q": "电位器是一种触点端与电阻体滑动接触的三端电阻元件。其在电路中可以用作：", "options": ["可调分压器", "可变电阻", "可调变压器", "可变电纳"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1099", "q": "哪种元件由线圈制成？", "options": ["电感器", "电抗器", "电容器", "电阻器"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1100", "q": "电感的种类繁多。在射频电路中常见的有：", "options": ["空芯电感", "磁芯电感", "分布电感", "寄生电感"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1104", "q": "小明用电压为4.2伏的低电压电池和几个无源元件做电路实验。在连接电路时，他感觉双手被意外出现的高电压击了一下。如果元件如下，则可能产生高电压的有：", "options": ["电源变压器的绕组", "继电器的衔铁线圈", "大容量电解电容器", "碳化硅高压二极管"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1124", "q": "一个电容器，在50Hz频率下测得容抗为100欧姆。推断其在5MHz下的容抗应为0.001欧姆，但实测值却显著偏大。这是因为：", "options": ["随着频率升高，电容器引线的感抗变得不可忽略", "随着频率升高，电容器的介质损耗逐渐增加", "所用仪器的频率特性欠佳", "计算容抗的公式在高频率下不再适用"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1144", "q": "下列哪种元器件可用来实现以较小的电流控制较大电流的功能？", "options": ["晶体管", "继电器", "电阻", "电池"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1147", "q": "理想运算放大器的基本概念是：", "options": ["在不加负反馈的情况下，也就是开环工作时，其放大倍数为无穷大", "这种放大器具有正、负两种极性的输入端，并且输入阻抗为无穷大", "所谓理想，其实就是是指内部噪声等于零的共发射极晶体管放大器", "所谓理想，其实就是是指输出电压幅度不设上限的场效应管放大器"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1196", "q": "下列放大器中，适宜用作CW射频功率放大器的是：", "options": ["接近乙类偏置的甲乙类放大器", "接近甲类偏置的甲乙类放大器", "丙类放大器", "丁类放大器"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1198", "q": "下列放大器电路中，适宜用作SSB射频功率放大器的是：", "options": ["接近乙类偏置的甲乙类放大器", "接近甲类偏置的甲乙类放大器", "丙类放大器", "丁类放大器"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1200", "q": "A、B、C、D四类放大器中的某些类型可用来线性放大音频信号。以下描述正确的是：", "options": ["对于A类放大器，使用一支晶体管即可完整放大信号的正、负半周", "对于B类放大器，使用二支晶体管推挽工作就可以分别放大信号的正、负半周", "对于C类放大器，可用一支晶体管放大信号的部分周期，之后再找回丢失的信息", "对于D类放大器，可用二支晶体管组成图腾柱，线性放大信号的正、负半周"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1201", "q": "A、B、C、D四类放大器都可以用来放大射频信号。关于此结论，以下描述正确的是：", "options": ["A类和B类放大器可以线性放大输入信号，所以适合放大所有类型的射频信号", "C类和D类放大器损失信号的幅度信息，所以仅适合放大振幅不变的射频信号", "A类和B类放大器只能放大线性信号，不能放大通过非线性电路产生的信号", "C类和D类放大器只能放大非线性信号，不能放大通过线性电路生成的信号"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1202", "q": "业余无线电爱好者经常将AB类放大器用作射频功率放大器。其特点是：", "options": ["这种放大器稍有静态偏置电流，器件的导通角度也略大于半个信号周期", "AB类放大器是对B类的改进。实际应用时失真低于B类，效率优于A类", "尽管这种放大器存在一定的静态偏置电流，但是器件的通角仍然维持180°", "这种放大器不能用于FM，其导致信号出现多对边带，载波还会时而消失"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1203", "q": "尽管单管工作的B类或AB类放大器存在波形失真，会产生谐波，甚至存在一定程度的高阶互调，却可以用作发射机的末级放大器。我们对该问题的理解是：", "options": ["放大器产生的谐波须经选频网络滤除，以确保谐波抑制满足法规要求", "放大器的高阶互调导致工作频率周边的杂散。若有，需用负反馈解决", "射频放大器的谐波可用发射天线滤除，无需特别关注", "射频放大器的高阶互调，如不严重也可以打个马虎眼"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1206", "q": "为什么B类或AB类音频放大器需要推挽工作，而相同类别的线性射频放大器却可以单管工作？", "options": ["常见射频信号的相对带宽显著小于100%，波形中的缺失部分可用选频网络还原", "如果待放大音频信号是窄带的，比如1kHz±100Hz，带选频的单管放大同样可行", "射频信号不在意失真与否，功率够劲就好。音频信号如有失真，那是不可接受的", "这显然是误解了放大器的类型。单管射频放大器必是甲类偏置的，否则肯定失真"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1213", "q": "工作在HF频段的电子管线性放大器多采用共栅极电路形式。这种电路的优点是：", "options": ["输入阻抗低，易于与上级电路相匹配。输入匹配网络因此得到简化或宽带化", "栅极接地阻断了屏极与阴极间的电容耦合。放大器工作更为稳定，不易自激", "共栅极放大形式使电路的电压放大倍数最大化", "共栅极放大形式使电路的非线性失真最小化"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1217", "q": "从能量转换的观点看，电路与负载之间的“匹配”具有如下含义：", "options": ["电路和负载的电抗相互抵消", "负载的电阻大小与电路所需的最优负载值一致", "使得电路工作在恒流状态下", "使得电路工作在恒定电压下"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1229", "q": "术语“差拍”是指一种现象：", "options": ["两个不同频率的信号通过非线性电路之后得到频率为两者之差的一个新信号", "差拍、混频和二阶互调均指这一现象。称谓分开是因为应用场景不同", "凡是接收机收到的连续音频叫声都是“差拍”", "一个单频信号经过非线性电路得到一系列谐波信号，相邻信号的频率间隔等于单频信号的频率。这样的一簇谐波总称“差拍”"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1233", "q": "在下列调制方式中，施加特定频率和特定幅度的调制信号可使载波分量消失的是：", "options": ["频率调制FM", "相位调制PM", "抑制载波单边带幅度调制SSB", "开关键控OOK"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1234", "q": "在下列调制方式中，施加特定频率和特定幅度的调制信号可使某一对边带消失的是：", "options": ["频率调制FM", "相位调制PM", "幅度调制AM", "抑制载波双边带幅度调制DSB"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1246", "q": "有时，我们会在业余收发信机的面板上或功能菜单中看到缩写为VFO的功能。它代表：", "options": ["可变频率振荡器", "收发信机的主载波频率可以通过旋钮自由调谐", "石英晶体振荡器", "可变频率石英晶体振荡器"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1251", "q": "关于高配置无线电通信设备的说明书中提到的TCXO或OCXO，以下描述正确的是：", "options": ["TCXO指温度补偿式晶体振荡器；OCXO指恒温控制式晶体振荡器", "OCXO的频率稳定度优于TCXO", "TCXO指中频数字信号处理部件；OCXO指音频数字信号处理部件", "TCXO和OCXO所处理的都是以复数表示的同相/正交样本序列"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1252", "q": "虽然电路中的非线性失真主要来自有源器件，但是无源滤波器中的电感或变压器在其磁芯趋于饱和时也会产生同样的失真。此外，包含多个频率分量的信号通过滤波器后还会发生线性失真。这种失真可能包括：", "options": ["频率失真", "相位失真", "偶次谐波", "奇次谐波"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1260", "q": "在描述收信机的波段预选滤波电路和发信机的输出滤波电路时，有些技术文档（比如：服务手册）会提及LC滤波器的“阶数”或“极点数”。确定LC滤波器阶数的简单方法是：", "options": ["先合并化简串、并联的电容和电感元件，再将串、并联的LC谐振电路视为单一组件，这样得到的电容、电感或LC谐振组件的总数即为阶数。例如，某3阶低通滤波器包含两个电容和一个电感；某3阶带通滤波器包含两个并联谐振电路和一个串联谐振电路。", "滤波电路中分叉节的数量即为阶数", "滤波电路中分叉节的数量减1即为阶数", "滤波电路中电感元件的总数减去电容元件的总数即得阶数"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1267", "q": "在给业余收发信机供电的电源装置中，开关电源可以比变压器降压的线性电源更为轻巧。原因是：", "options": ["开关电源中的隔离变压器工作频率远高于工频，磁芯截面积因此减小，绕组匝数变少", "开关电源中的半导体器件工作于开关状态，工作效率高，散热装置因此变得轻巧", "开关电源的工作原理比线性电源简单得多，设备中的元件数量因此大幅减少", "开关电源所用的PWM技术工作安静无噪声，无需EMC措施，设备体积因此减小"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1287", "q": "进行数模转换时，为了将模拟信号正确还原出来，数模转换器（DAC）的采样率应当至少等于输入样本率。但是如果在数模转换时通过插值获得了一个更高的采样率，则：", "options": ["数模转换的频率响应将变得更为平坦", "数模转换之后残存的杂散更容易滤除", "采样时丢失的波形细节会得以再现", "因采样不完美而残存的混叠会复原为频率正确的有用信号"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1294", "q": "SDR系统中的数字滤波器具有多种类型。常见的有：", "options": ["有限冲激响应（FIR）滤波器", "无限冲激响应（IIR）滤波器", "萨伦-基滤波器", "状态变量滤波器"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1297", "q": "使用SDR收发信机时，我们常在系统设置中看到与频谱显示有关的窗函数选项，例如汉明、升余弦或布莱克曼等。这些主要用来：", "options": ["降低FFT分析的谱泄漏，呈现信号功率谱的原本特征", "提高FFT分析的幅度或频率精度，从而提升观测精度", "防止FFT运算的结果超出屏幕上频谱显示窗口的宽度", "提升CW或RTTY等幅度或频率键控信号的观测精度"], "ans": [0, 1], "classes": ["C"]}, {"id": "MC2-1302", "q": "测量一个电解电容器是否完好应当使用：", "options": ["指针式万用表的电阻档", "数字万用表的电容测试档（如果仪表具备该功能）", "任意一种万用表的电流档", "蓄电池充电器并配合进行短路放电实验"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-1337", "q": "若信号依次通过增益为x dB、y dB和z dB的三个电路，则总增益为：（“x＾m”表示“x的m次方”）", "options": ["(x + y + z) dB", "10＾((x + y + z) / 10) 倍", "(x × y × z) dB", "10＾((x × y × z) / 10) 倍"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1338", "q": "若信号通过增益为x dB的电路之后被功率分配器等分为两路，则每路增益为：（“x＾m”表示“x的m次方”）", "options": ["(x - 3) dB", "10＾((x - 3) / 10) 倍", "(x / 2) dB", "10＾((x / 2) / 10) 倍"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1339", "q": "接收机的信号强度表（S表）标有1至9的度盘分度，分度间隔为6dB。某电台以15W的功率发射时，S表读数为S9。现在，该电台减小功率并再次发射，S表的读数降至S4。该台的当前发射功率约为：", "options": ["15mW", "-18.2dBW", "0.5W", "-3dBW"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1340", "q": "接收机的信号强度表（S表）标有1至9的度盘分度，分度间隔为6dB。某电台以100W的功率发射时，S表读数为S8。现在，该电台减小功率并再次发射时S表的读数降至S5。此时该台的发射功率约为：", "options": ["1.58W", "2dBW", "5.56W", "7.45dBW"], "ans": [0, 1], "classes": ["B", "C"]}, {"id": "MC2-1347", "q": "频率容限是指：", "options": ["发射所占频段的中心频率偏离指配频率的最大容许偏差", "发射的特征频率偏离参考频率的最大容许偏差", "发射所占频段的中心频率偏离最高频率的最大容许偏差", "发射的特征频率偏离必要频率的最大容许偏差"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-1348", "q": "频率容限是发射设备的重要指标，通常用下述单位来表示：", "options": ["百万分之几", "赫兹", "百分之几", "兆赫"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC2-1353", "q": "按照国家标准GB8702-2014《电磁环境控制限值》，从电磁环境保护管理角度，向没有屏蔽空间发射电磁场可以免于管理的有：", "options": ["频率范围为0.1-3MHz，等效辐射功率小于300瓦的无线电通信设施（设备）", "频率范围为3MHz-300GHz，等效辐射功率小于100瓦的无线电通信设施（设备）", "发射频率在30MHz以下的所有业余电台", "发射频率在30MHz以上的所有业余电台"], "ans": [0, 1], "classes": ["A", "B", "C"]}, {"id": "MC3-0018", "q": "关于干扰的定义，下列说法正确的是：", "options": ["由于一种或多种发射、辐射、感应或其组合所产生的无用能量对无线电通信系统的接收产生的影响", "表现为性能下降、误解或信息丢失", "若不存在这种无用能量，则此后果可以避免", "不会对无线电通信系统的接收产生的影响"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-0020", "q": "关于次要业务台站，下列说法正确的是：", "options": ["不得对业经指配或将来可能指配频率的主要业务电台产生有害干扰", "不得对来自业经指配或将来可能指配频率的主要业务电台的有害干扰提出保护要求", "可要求保护不受来自将来可能指配频率的同一业务或其他次要业务电台的有害干扰", "使用业余无线电台时，只要不对其他业余无线电台产生干扰即可"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-0027", "q": "个人设置、使用业余无线电台应当向无线电管理机构提交的材料为：", "options": ["一份申请表", "身份证明复印件；申请人为未成年人的，还应当提交其监护人身份证明复印件，以及申请人与监护人关系的说明材料", "无线电发射设备相关说明材料", "本人写的申请书，操作证书的原件、复印件"], "ans": [0, 1, 2], "classes": ["A", "B"]}, {"id": "MC3-0028", "q": "单位设置、使用业余无线电台应当向无线电管理机构提交的材料为：", "options": ["一份申请表", "无线电发射设备相关说明材料", "单位营业执照等复印件，以及业余无线电台技术负责人为本单位工作人员的说明材料", "业余无线电台技术负责人写的申请书，操作证书的原件、复印件"], "ans": [0, 1, "MC3-0585", "q": "如果对方报告你的调频电台发射的信号听起来失真严重，可辨度差，原因可能包括：", "options": ["电台的电源电压不足，可以检查供电电压或更换电池模块再试", "电台所处的位置多径衰落严重，可以挪动几步或变更频率再试", "电台的发射频率不准。如确认这种情况，需修好设备之后再试", "电台天线承载射频功率的能力不足，需更换高级天线之后再试"], "ans": [0, 1, 2], "classes": ["A"]}, {"id": "MC3-0633", "q": "业余通信接收机的中频滤波器带宽有100Hz、400Hz、2.7kHz和6kHz几档选择。如果要为接收CW、SSB、AM和FT8方式的信号选择合适的档位，应该依次为：", "options": ["CW选用100Hz或400Hz", "SSB选用2.7kHz", "AM选用6kHz", "FT8选用400Hz"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0643", "q": "收发信机与线性功率放大器相互连接会用到那些接口？", "options": ["射频接口", "PTT控制接口", "ALC接口", "AGC接口"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-0670", "q": "业余无线电爱好者讨论天线系统时常会提及术语 “驻波比（SWR）”。其含义为：", "options": ["连接到传输线终端的负载阻抗与传输线自身的特性阻抗相匹配的程度", "负载与传输线完美匹配时，传输线之中没有驻波，因此驻波比为1:1", "如果负载与传输线不匹配，传向负载的部分能量会沿传输线返回始端", "如果传输线中出现驻波，则调整传输线始端的信源阻抗可使驻波归零"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-0752", "q": "如果架设天线的空间受限，则磁场耦合可调谐环形天线或许是一种选择。关于这种天线，以下说法正确的是：", "options": ["通过调整激励单元与谐振单元的尺寸，我们可以获得接近1:1的输入SWR", "谐振单元中的可变电容器应选用耐压较高的，这便于承载更大一些的输入功率", "谐振单元的尺寸越大，天线的发射效率越高。但是，可调谐的最高频率也越低", "这种天线对电场不敏感，损失一半的电磁能量，理论增益非常低"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0753", "q": "开展野外通联活动或演练紧急情况下的通信程序时，爱好者们可能会发现，联络100至200千米范围内的HF电台要比联络300至500千米外的更为棘手。好在有很多技术可用来解决这个问题，比较简单的有：", "options": ["尝试使用较低的频段。例如白天40米，夜晚80米", "使用架设高度较低的水平偶极天线或端馈斜拉天线", "在偶极天线的下方装反射器，将主瓣调整至正上方", "使用1米以内外径的高效率磁场耦合谐振环形天线"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0761", "q": "传输线通常用来连接电台与天线。比较常见的传输线有：", "options": ["同轴电缆", "平行馈线", "波导", "波纹软管"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0772", "q": "关于无线电波的频率、周期和波长，以下描述正确的是：", "options": ["无线电波的频率f代表τ时间内电磁场重复改变的次数n。所以，f=n/τ", "周期T代表电磁场重复改变的时间间隔，其与频率f为倒数关系。即，T=1/f", "无线电波的波长λ与光速c成正比，但是与频率f成反比。因此，λ=c/f", "由于λ仅与光速有关，所以架设天线时考虑振子的缩短系数其实没什么必要"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0799", "q": "影响电离层的短波传播特性的主要因素有：", "options": ["太阳黑子活动、太阳耀斑和地磁活动", "季节和昼夜变化", "工作频率和通信距离", "高空云量和气温变化"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0887", "q": "现代收发信机大多基于DSP技术设计并制造。因主要功能由软件实现，便获得软件无线电（SDR）设备的称谓。相比模拟收发信机，SDR设备的优势是：", "options": ["噪声更低，几乎仅包含数字系统的量化噪声", "精度更高，具有更低的信号失真和更好的滤波性能", "很少因元器件老化而出现参数漂移等软故障", "处理信号的时间延迟较模拟设备更短"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0888", "q": "SDR收发信机大多提供波段频谱显示器，其基本用途是：", "options": ["观察波段内的信号活动，以快速切换频率与之通联", "观察信号的强度、发射质量和频率组成，以向对方提供更精确的信号描述", "观察信号的衰落情况，以快速了解当前工作波段的传播情况", "观察信号的音色并向对方提供多频段话音频谱均衡器的调整建议"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-0917", "q": "关于导体，以下说法正确的是：", "options": ["霓虹灯中电离发光的气体是导体", "酸、碱、盐的水溶液是导体", "石墨是导体", "云母是导体"], "ans": [0, 1, 2], "classes": ["A", "B"]}, {"id": "MC3-0919", "q": "以下哪些可以用作绝缘材料？", "options": ["工程塑料", "酚醛树脂", "二氧化硅", "二氧化锡"], "ans": [0, 1, 2], "classes": ["A", "B"]}, {"id": "MC3-0920", "q": "“击穿”是指施加于绝缘介质上的电压高于一定值时，部分介质突然变成导体，导致介质的电阻陡然下降的一种现象。以下哪些是对击穿现象的描述？", "options": ["电路中的电容在工作电压显著超过标称耐压后变成导体，造成电路短路", "天线调谐器工作时，可变电容的极板间出现电弧，导致发射机告警保护", "验电笔中的氖灯发光", "台灯里的卤钨灯发光"], "ans": [0, 1, 2], "classes": ["A", "B"]}, {"id": "MC3-0923", "q": "下列哪些器件由半导体材料制成？", "options": ["双极型三极管", "氮化镓三极管", "LDMOS三极管", "电真空三极管"], "ans": [0, 1, 2], "classes": ["A", "B"]}, {"id": "MC3-0924", "q": "静电放电是一种常见电磁现象，时刻伴随日常生活。但是，较强的静电放电却足以损坏电子设备甚至危及人身，需要预防。以下所述与静电有关的是：", "options": ["刮风时，斜拉天线上出现的直流高压", "雷雨时，云层中积蓄的巨大能量", "收信时，接收机收到的各种QRN", "发话时，电台馈送到天线的射频能量"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-0968", "q": "为业余无线电设备供电的外置电源具有多种类型。常见的有：", "options": ["开关电源", "线性电源", "蓄电池", "标准电池"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-0969", "q": "下列哪一种电池可以充电？", "options": ["锂离子电池", "钠离子电池", "铅酸电池", "碱性干电池"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-1074", "q": "按制造材料细分，常见的电阻有：", "options": ["碳膜电阻", "金属膜电阻", "线绕电阻", "阻尼电阻"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1086", "q": "电容器由彼此绝缘的两个电极构成。若按制造材料细分，常见电容器包括：", "options": ["陶瓷电容", "电解电容", "有机薄膜电容", "线间电容"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1088", "q": "在组装业余收发信机所用的元器件中，标有额定耐压的通常是：", "options": ["电解电容", "钽电容", "熔丝", "电感线圈"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1105", "q": "开关是利用通、断两种状态对电路实施控制的一种电子零件。下列可用作开关的有：", "options": ["按钮开关", "继电器", "晶体管", "电位器"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1108", "q": "在组装业余收发信机所用的元器件中，标有额定电流的通常是：", "options": ["熔断器", "开关", "继电器", "压电晶体"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1109", "q": "业余无线电作品中的熔断器常为玻璃或陶瓷封装的保险丝管，是用来增强电路安全性的。关于这类熔断器的使用，可供借鉴的经验有：", "options": ["选用保险丝管应当关注额定工作电压、额定工作电流和熔断速度", "将大电流保险丝管装于管座内，以防熔断时爆裂，损伤周边元件", "尽量将供电线路保险丝的管座固定于机箱背板，以简化维修工作", "为熔断器安装射频滤波器，以防熔断时打火，干扰周边业余电台"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1110", "q": "继电器是一种具有电气隔离能力的开关，常用来以小功率低压电控制大功率电路或高压电路。在业余无线电作品中，继电器也用来控制射频电路的通断或切换信号路径。关于继电器的应用，可供借鉴的经验有：", "options": ["选用继电器时应关注触点的额定耐压和额定工作电流", "用继电器控制收发转换，应在发射机待机后再行切换", "选用切换信号的继电器，应关注其导通小信号的能力", "自制HF或VHF设备时，应尽量选用微波射频继电器"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1117", "q": "理想变压器初、次级绕组的匝数比决定变压器的电压变比。假设一个理想变压器的初级和次级绕组分别为1100匝和110匝，将初级接入电压为220V的交流电源并在次级并联一个22欧的电阻，则以下结论正确的是：（电压和电流均为有效值）", "options": ["次级电压为22伏", "次级电流为1安", "初级阻抗为2.2千欧", "变压器功耗为22瓦"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1118", "q": "理想变压器初、次级绕组的匝数比决定变压器的电压变比。假设一个理想变压器的初级和次级绕组分别为120匝和1800匝，将初级接入电压为220V的交流电源并在次级并联一个4.5千欧的电阻，则以下结论正确的是：（电压和电流均为有效值）", "options": ["次级电压为3300伏", "初级电流为11安", "初级阻抗为20欧", "变压器功耗为2.42千伏安"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1119", "q": "在射频电路中，变压器的用途之一是完成阻抗变换。某个绕制于铁氧体磁环上的高频变压器，初、次级绕组的匝数分别为3匝和6匝。在该变压器的设计工作频率和负载阻抗范围内，以下结论正确的是：", "options": ["该变压器可用作1:4或4:1阻抗变换器。用作后者时需将初次级互换", "该变压器可用作1:2或2:1电压变换器。用作后者时需将初次级互换", "该变压器可用作带阻抗变换功能的倒相器。用法是调换初级或者次级的线序", "该变压器可用来匹配天线，可将天线阻抗中的电抗成分按比例变为电阻成分"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1121", "q": "传输线变压器是结合传输线理论设计制作的一种射频变压器，已广泛应用于业余无线电作品。例如，用双绞线在磁环上穿绕数匝即可制成1:4阻抗变换器。这种变压器的优点是：", "options": ["可在很宽频带内实现阻抗匹配", "可制成平衡-不平衡转换器", "可制成功率合成与分配网络", "可实现整数倍率的倍频与分频"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1180", "q": "关于场效应晶体管放大器的放大作用，以下说法正确的是：", "options": ["共源极形式：栅极电压的微小变化可以引起漏极电压和电流的较大变化", "共栅极形式：源极电流的微小变化可以引起漏极电压的较大变化", "共漏极形式：栅极电压的微小变化可以引起源极电流的较大变化", "无论哪种电路形式，放大器均在输入信号足够大时自动转变为功率放大器"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1181", "q": "关于双极型晶体管放大器的放大作用，以下说法正确的是：", "options": ["共发射极形式：基极电流的微小变化可以引起集电极电压和电流的较大变化", "共基极形式：发射极电流的微小变化可以引起集电极电压的较大变化", "共集电极形式：基极电流的微小变化可以引起发射极电流的较大变化", "无论哪种电路形式，放大器均在输入信号足够大时自动转变为功率放大器"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1187", "q": "关于电子三极管放大器的放大作用，以下说法正确的是：", "options": ["共阴极形式：栅极电压的微小变化可以引起屏极电压和电流的较大变化", "共栅极形式：阴极电流的微小变化可以引起屏极电压的较大变化", "共屏极形式：栅极电压的微小变化可以引起阴极电流的较大变化", "无论哪种电路形式，放大器均在输入信号足够大时自动转变为功率放大器"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1197", "q": "下列放大器中，适宜用作FM射频功率放大器的是：", "options": ["接近乙类的甲乙类放大器", "接近甲类的甲乙类放大器", "丙类放大器", "甲类放大器"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1199", "q": "业余无线电爱好者常把放大器分为A、B、C、D等类别。在电路理论中，这些序号对应甲、乙、丙、丁四类放大器。放大器的分类与电路中有源器件在输入信号一个完整周期内的导通角度和导通程度有关，具体为：", "options": ["对于A类放大器，器件在整个信号周期内导通，既不截止，也不饱和", "对于B类放大器，器件恰好在半个信号周期内导通，但是永不饱和", "对于C类放大器，器件的导通角度小于半个信号周期，并且器件在信号峰值时饱和工作", "对于D类放大器，器件的导通角度至多半个信号周期，并且器件始终线性工作"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1216", "q": "业余无线电设备的放大器设计大量采用负反馈技术。负反馈放大器的特点是：", "options": ["失真小，工作稳定，但增益也有所减小", "输入、输出阻抗易于控制，与源和负载更易匹配", "工作带宽得以扩展，更利于实现宽带放大", "偶次谐波等元素增加，更加适合音频放大"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1220", "q": "有源器件可将输入的单频信号变换为波形偏离正弦或余弦形状的复杂周期信号，从而生成谐波等全新频率成分。这是一种非线性变换。下面哪些场景包含这种变换？", "options": ["二极管检波电路输出信号的大小正比于输入射频信号的幅度", "二极管环形调制器利用输入音频信号线性改变本振信号的振幅", "二极管整流电路将输入交流电转换为与之相应的脉动直流电", "流过发光二极管（LED）的正向电流与限流电阻的阻值成反比"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1231", "q": "正弦交流信号通过下列哪些电路时会产生高次谐波？", "options": ["二极管整流器", "二极管检波器", "二极管环形调制器", "调谐在信号整倍频率上的选频网络"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1269", "q": "有时，使用锁相环频率合成器的本机振荡器（LO）会为混频之后的信号增添相位噪声。可能的原因是：", "options": ["从鉴相检测LO的频率漂移到滤波产生环路的校正电压需要一定时间。该时延造成本振信号中的宽带相位噪声不能得到充分抑制", "锁相环路中的压控振荡器（VCO）多为宽带可调谐LC振荡器。相比石英晶体振荡器等窄带振荡器，其输出相位噪声会在本质上更大一些", "有些频率合成器采用多次混频方案，多个VCO的相位噪声的叠加使输出信噪比下降", "频率合成器中的数字分频电路在信号电平跳变时会产生谐波，并因此产生相位噪声"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1272", "q": "有源器件的噪声主要包括：", "options": ["散粒噪声", "闪烁噪声", "热噪声", "开关噪声"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1284", "q": "制作SDR作品，特别是在制作直接射频采样的数字收发信机时，我们会使用一种叫做FPGA的现场可编程数字逻辑器件。FPGA在SDR系统中可以用来：", "options": ["实现宽带数字混频、数字滤波、信道化样本抽取或采样率变换", "在器件内创建CPU，或利用器件的内置CPU完整实现SDR系统", "提供并行运算功能，辅助提升外部计算机系统的信号处理能力", "充当固态硬盘，帮助外部计算机系统保存电台日志和比赛录音"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1289", "q": "编写SDR软件时，爱好者们经常使用一种中心频率为0Hz的I/Q序列，利用正、负两个频率区域来完整表达信号的基带信息。这种形式的数字信号也叫“复信号”，其优点是：", "options": ["将序列的样本率降至最低，节省信号处理的资源开销", "简化信号的幅度和相位运算，降低软件的复杂性", "便于实现复杂数字调制和常见模拟调制", "获取射频输入或还原射频输出仅需一个ADC或DAC"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1295", "q": "制作SDR发信机时，生成SSB信号的算法可以是：", "options": ["滤波法", "移相法", "维弗法", "限幅法"], "ans": [0, 1, 2], "classes": ["C"]}, {"id": "MC3-1316", "q": "在使用网络分析仪或天线分析仪测量电缆和天线的时候，需要使用校准件，包括：", "options": ["50欧姆假负载接头", "开路接头", "短路接头", "0dBm参考振荡器"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1341", "q": "功率为0dBm的射频信号通过增益为23dB的电路后，输出功率为：", "options": ["23dBm", "200mW", "-7dBW", "3.16V"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1342", "q": "功率为0dBμ的射频信号通过增益为36dB的电路后，输出功率为：", "options": ["6dBm", "4mW", "-24dBW", "447mV"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1343", "q": "功率为0dBW的射频信号通过增益为-36dB的电路后，输出功率为：", "options": ["-6dBm", "0.25mW", "24dBμ", "112mV"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1344", "q": "功率为-133dBm的射频信号通过增益为60dB的电路后，输出功率为：", "options": ["-73dBm", "-43dBμ", "-103dBW", "50μV"], "ans": [0, 1, 2], "classes": ["B", "C"]}, {"id": "MC3-1349", "q": "杂散域发射功率是发射设备的重要指标，通常用下述单位来表示：", "options": ["绝对功率dBm", "低于载波发射功率的分贝值dBc", "低于PEP发射功率的相对值dB", "绝对功率（瓦）"], "ans": [0, 1, 2], "classes": ["A", "B", "C"]}, {"id": "MC3-1350", "q": "杂散发射是指：", "options": ["必要带宽之外的一个或多个频率的发射，其发射电平可降低而不致影响相应信息的传输", "杂散发射包括谐波发射、寄生发射", "杂散发射包括互调产物、变频产物", "杂散发射包括谐波发射、带外发射"], "ans": [0, 1, 2], "classes": ["A", "B /* 业余无线电操作证书模拟考试系统 —— 前端应用
 * 数据由构建脚本注入: DB_QUESTIONS / DB_RULES / DB_IMAGES
 * 持久化: localStorage (错题本/进度/历史/设置/未交卷会话)
 */
"use strict";

/* ================= 基础数据 ================= */
const QMAP = Object.fromEntries(DB_QUESTIONS.map(q => [q.id, q]));
const IDS = DB_QUESTIONS.map(q => q.id);
const CLASS_META = {
  A: { name: "A 类操作证书", desc: "30–3000MHz，功率≤25W。新手首考类别。", icon: "🛰" },
  B: { name: "B 类操作证书", desc: "各业余频段，30MHz以下≤15W、以上≤25W。", icon: "📡" },
  C: { name: "C 类操作证书", desc: "各业余频段，30MHz以下功率可达1000W。", icon: "tower" },
};
const LS_PREFIX = "hamExam.v1.";

/* ================= 持久化 ================= */
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(LS_PREFIX + key); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, val) { try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(val)); } catch {} },
};

let progress  = store.get("progress", {});   // {qid:{seen,right,wrong,ts}}
let wrongBook = store.get("wrongBook", {});  // {qid:{count,streak,lastChosen,ts}}
let history   = store.get("history", []);    // [{ts,mode,cls,correct,total,seconds,pass}]
let settings  = Object.assign(
  { shuffleOptions: true, instantFeedback: true, autoRemoveWrong: true, defaultClass: "A" },
  store.get("settings", {})
);
const saveAll = () => { store.set("progress", progress); store.set("wrongBook", wrongBook); store.set("history", history); store.set("settings", settings); };

/* ================= 会话 ================= */
let session = null; // {mode, cls, list, idx, startedAt, limitSec, remaining, timer, submitted, title}
let ui = { view: "home" };

/* ================= 工具 ================= */
const $ = sel => document.querySelector(sel);
const main = () => $("#main");
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const classOf = q => q.classes.join("/");
/* 正确答案原点索引集合（兼容旧数据 answer=0 与新版 ans 数组/多选） */
const ansOf = q => (q.ans || (q.answer == null ? [0] : [].concat(q.answer))).map(Number);
/* 单题是否答对：选中的原始索引集合与正确答案集合完全相等 */
const isRight = (item, q) => {
  const sel = (item.chosen || []).map(p => item.perm[p]).sort((a, b) => a - b);
  const ans = ansOf(q).slice().sort((a, b) => a - b);
  return sel.length === ans.length && ans.every((v, i) => v === sel[i]);
};
const correctText = q => ansOf(q).map(i => q.options[i]).join("；");
function toast(msg, ms = 1800) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._h); toast._h = setTimeout(() => t.classList.add("hidden"), ms);
}
function modal(html, onMount) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal">${html}</div>`;
  root.classList.remove("hidden");
  root.onclick = e => { if (e.target === root) closeModal(); };
  if (onMount) onMount(root.firstElementChild);
}
function closeModal() { const r = $("#modalRoot"); r.classList.add("hidden"); r.innerHTML = ""; }

/* 题库中各类别题号集合 */
function idsFor(cls) {
  if (cls === "ALL") return IDS;
  return IDS.filter(id => QMAP[id].classes.includes(cls));
}

/* ================= 统计刷新 ================= */
function refreshBadge() {
  const n = Object.keys(wrongBook).length;
  const b = $("#wrongBadge");
  b.textContent = n > 99 ? "99+" : n;
  b.classList.toggle("hidden", n === 0);
}
function classStat(cls) {
  const ids = idsFor(cls);
  let seen = 0, right = 0;
  for (const id of ids) { const p = progress[id]; if (p && p.seen) { seen++; right += p.right; } }
  const attempts = ids.reduce((s, id) => s + (progress[id]?.right || 0) + (progress[id]?.wrong || 0), 0);
  return { total: ids.length, seen, right, acc: attempts ? Math.round(right / attempts * 100) : null };
}

/* ================= 视图切换 ================= */
function setNav(view) {
  document.querySelectorAll(".nav-btn[data-view]").forEach(b =>
    b.classList.toggle("active", b.dataset.view === view));
}
function go(view) {
  ui.view = view;
  stopTimer();
  if (view === "home") renderHome();
  else if (view === "wrong") renderWrong();
  else if (view === "stats") renderStats();
  setNav(view);
}

/* ================= 首页 ================= */
function renderHome() {
  const cards = ["A", "B", "C", "ALL"].map(c => {
    const meta = CLASS_META[c] || { name: "全部题库", desc: "A/B/C 三类合集，共 1237 题（含重叠）", icon: "📚" };
    const st = classStat(c);
    const pct = st.total ? Math.round(st.seen / st.total * 100) : 0;
    const rule = DB_RULES[c];
    const ruleTxt = rule ? `考试 ${rule.count} 题 · ${rule.minutes} 分钟 · 答对 ${rule.pass} 题合格` : "仅练习用";
    return `<button class="class-card ${settings.defaultClass === c ? "selected" : ""}" data-cls="${c}">
      <h3><span class="class-tag" style="${c === "ALL" ? "background:#64748b" : ""}">${c === "ALL" ? "全" : c}</span>${meta.name}</h3>
      <p>${meta.desc}</p>
      <div class="cls-stat">${ruleTxt} · 题库 ${st.total} 题 · 已练 ${st.seen} (${pct}%)${st.acc != null ? ` · 正确率 ${st.acc}%` : ""}</div>
      <div class="cls-bar"><i style="width:${pct}%"></i></div>
    </button>`;
  }).join("");

  const wrongN = Object.keys(wrongBook).length;
  const modes = [
    { id: "mock", icon: "📝", name: "全真模拟考试", desc: "按真实考试规则随机抽题、限时作答、选项乱序，交卷后判分并计入错题本。", needCls: true },
    { id: "seq", icon: "📖", name: "顺序练习", desc: "按题库编号顺序逐题复习，即时判定对错并显示正确答案。", needCls: true },
    { id: "rand", icon: "🎲", name: "随机练习", desc: "随机顺序抽取指定数量的题目复习，即时判定对错。", needCls: true },
    { id: "wrong", icon: "❌", name: "错题重考", desc: `只考错题本中的题目（当前 ${wrongN} 题），彻底消灭薄弱点。`, needCls: false, disabled: wrongN === 0 },
  ].map(m => `
    <button class="mode-card ${m.disabled ? "disabled" : ""}" data-mode="${m.id}">
      <span class="mode-icon">${m.icon}</span>
      <span><h4>${m.name}</h4><p>${m.desc}</p></span>
    </button>`).join("");

  main().innerHTML = `
    <div class="section-title">① 选择题库类别</div>
    <div class="class-cards">${cards}</div>
    <div class="section-title">② 选择模式</div>
    <div class="mode-grid">${modes}</div>
    <div class="hint-box">💡 答错会自动进入错题本；练习中连续答对 2 次可自动移出。考试题目从对应类别题库随机抽取，选项顺序随机打乱，与真实机考一致。</div>`;

  main().querySelectorAll(".class-card").forEach(el =>
    el.onclick = () => { settings.defaultClass = el.dataset.cls; store.set("settings", settings); renderHome(); });
  main().querySelectorAll(".mode-card").forEach(el => {
    el.onclick = () => {
      if (el.classList.contains("disabled")) { toast("错题本为空，先去练习吧"); return; }
      startSession(el.dataset.mode);
    };
  });
}

/* ================= 会话启动 ================= */
function pickIds(mode, cls) {
  const pool = idsFor(cls);
  if (mode === "mock") {
    const n = DB_RULES[cls].count;
    return shuffle(pool.filter(id => QMAP[id])).slice(0, n);
  }
  if (mode === "wrong") return shuffle(Object.keys(wrongBook).filter(id => QMAP[id]));
  if (mode === "seq") return pool.slice().sort();
  return pool; // rand: 数量由调用方截取
}

function startSession(mode, optCount) {
  const cls = settings.defaultClass;
  let ids = pickIds(mode, cls);
  if (mode === "rand") {
    if (optCount == null) {
      return modal(`<h3>随机练习 · ${cls === "ALL" ? "全部题库" : cls + " 类题库"}</h3>
        <p style="font-size:14px;color:var(--text2)">选择抽题数量：</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          ${[10, 25, 50, 100, 200, ids.length].map(n =>
            `<button class="chip" data-n="${n}">${n === ids.length ? "全部 " + n : n + " 题"}</button>`).join("")}
        </div>
        <div style="margin-top:18px;text-align:right"><button class="btn" id="mCancel">取消</button></div>`, m => {
        m.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { closeModal(); startSession(mode, +b.dataset.n); });
        m.querySelector("#mCancel").onclick = closeModal;
      });
    }
    ids = shuffle(ids).slice(0, optCount);
  }
  if (!ids.length) { toast("没有可用题目"); return; }

  const rule = DB_RULES[mode === "mock" ? cls : null];
  session = {
    mode, cls, ids,
    list: ids.map(id => ({ qid: id, perm: settings.shuffleOptions ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], chosen: null, marked: false })),
    idx: 0,
    startedAt: Date.now(),
    limitSec: mode === "mock" ? DB_RULES[cls].minutes * 60 : null,
    remaining: mode === "mock" ? DB_RULES[cls].minutes * 60 : 0,
    submitted: false,
    title: { mock: `${cls} 类全真模拟考试`, seq: `顺序练习 · ${cls === "ALL" ? "全部" : cls + " 类"}`, rand: `随机练习 · ${cls === "ALL" ? "全部" : cls + " 类"}`, wrong: "错题重考" }[mode],
  };
  if (mode === "mock") store.set("session", { ids, cls, startedAt: session.startedAt });
  ui.view = "quiz"; setNav("");
  renderQuiz();
  startTimer();
}

/* ================= 计时 ================= */
let timerHandle = null;
function stopTimer() { clearInterval(timerHandle); timerHandle = null; }
function startTimer() {
  stopTimer();
  timerHandle = setInterval(() => {
    if (!session) return stopTimer();
    if (session.mode === "mock") {
      session.remaining--;
      if (session.remaining <= 60) toast("⚠ 距离考试结束还有 1 分钟", 2500);
      if (session.remaining <= 0) { toast("⏰ 考试时间到，自动交卷"); submitExam(true); return; }
      const t = $("#timerVal");
      if (t) { t.textContent = fmtTime(session.remaining); t.classList.toggle("warn", session.remaining <= 120); }
    } else {
      session.remaining = Math.floor((Date.now() - session.startedAt) / 1000);
      const t = $("#timerVal"); if (t) t.textContent = fmtTime(session.remaining);
    }
  }, 1000);
}

/* ================= 答题页 ================= */
function renderQuiz(keepScroll) {
  const s = session;
  if (!s || !s.list?.length) { go("home"); return; }
  if (s.idx < 0) s.idx = 0;
  if (s.idx >= s.list.length) s.idx = s.list.length - 1;
  const item = s.list[s.idx];
  const q = QMAP[item.qid];
  const answered = s.list.filter(i => i.chosen != null).length;
  const pct = Math.round((s.idx + 1) / s.list.length * 100);
  const isMock = s.mode === "mock";

  const optHtml = item.perm.map((orig, pos) => {
    let cls = "opt";
    const sel = item.chosen || [];
    if (item.chosen && sel.indexOf(pos) > -1) cls += " chosen";
    const showResult = s.submitted || (!isMock && item.locked);
    if (showResult) {
      if (ansOf(q).indexOf(orig) > -1) cls += " correct";
      else if (sel.indexOf(pos) > -1) cls += " wrong";
    }
    return `<button class="${cls}" data-pos="${pos}" ${showResult ? "disabled" : ""}>
      <span class="key">${"ABCD"[pos]}</span><span>${esc(q.options[orig])}</span></button>`;
  }).join("");

  let feedback = "";
  if (!isMock && item.locked) {
    const ok = isRight(item, q);
    feedback = `<div class="feedback ${ok ? "ok" : "no"}">${ok ? "✓ 回答正确" : `✗ 回答错误，正确答案：${esc(correctText(q))}`}</div>`;
  }

  const imgHtml = q.img ? `<div class="q-img-wrap"><img src="${DB_IMAGES[q.img]}" alt="${q.img}" data-zoom="${q.img}"></div>` : "";
  const clsTag = isMock ? s.cls : s.cls === "ALL" ? "全部" : s.cls;

  main().innerHTML = `
    <div class="quiz-top">
      <div class="quiz-info">
        <span class="qmeta"><b>${esc(s.title)}</b> · 第 <b>${s.idx + 1}</b> / ${s.list.length} 题 · ${q.id}${q.img ? " · 🖼" : ""}</span>
        <span class="timer ${isMock && session.remaining <= 120 ? "warn" : ""}">${isMock ? "⏱ 剩余 " : "⏱ "}<span id="timerVal">${fmtTime(isMock ? session.remaining : session.remaining)}</span></span>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
    </div>
    <div class="q-card">
      <div class="q-id">${clsTag} 类 · 题号 ${q.id} · 适用类别 ${classOf(q)}${ansOf(q).length > 1 ? ` · <span style="color:var(--amber)">多选题（需选出全部 ${ansOf(q).length} 项）</span>` : ""}</div>
      <div class="q-text">${esc(q.q)}</div>
      ${imgHtml}
      <div class="q-options">${optHtml}</div>
      ${feedback}
      <div class="quiz-actions">
        <button class="btn" id="btnPrev" ${s.idx === 0 ? "disabled" : ""}>← 上一题</button>
        <button class="btn" id="btnMark">${item.marked ? "★ 已标记" : "☆ 标记"}</button>
        <span class="spacer"></span>
        ${s.idx < s.list.length - 1
          ? `<button class="btn primary" id="btnNext">下一题 →</button>`
          : (isMock ? `<button class="btn primary" id="btnSubmit">交卷</button>` : `<button class="btn primary" id="btnFinish">完成练习</button>`)}
        ${isMock && !s.submitted ? `<button class="btn danger" id="btnSubmitEarly">提前交卷</button>` : ""}
      </div>
    </div>
    <div class="answer-sheet">
      <div style="font-size:14px;font-weight:600">答题卡 <span style="font-weight:400;color:var(--text2);font-size:12.5px">已答 ${answered}/${s.list.length} · 点击序号跳转</span></div>
      <div class="sheet-grid">${s.list.map((it, i) => {
        let c = "sheet-cell";
        if (s.submitted) {
          const right = isRight(it, QMAP[it.qid]);
          c += it.chosen == null ? "" : right ? " result-right" : " result-wrong";
        } else if (it.chosen != null) c += " answered";
        if (i === s.idx) c += " current";
        return `<button class="${c}" data-jump="${i}">${i + 1}${it.marked ? '<i class="mark-dot"></i>' : ""}</button>`;
      }).join("")}</div>
      <div class="sheet-legend">
        <span class="lg-answered">已作答</span><span class="lg-mark">★ 标记待复查</span>
        ${s.submitted ? '<span style="color:var(--green)">✓ 正确</span><span style="color:var(--red)">✗ 错误</span>' : ""}
      </div>
    </div>`;

  // 事件绑定
  main().querySelectorAll(".opt").forEach(b => b.onclick = () => chooseOption(+b.dataset.pos));
  main().querySelectorAll("[data-jump]").forEach(b => b.onclick = () => { s.idx = +b.dataset.jump; renderQuiz(); });
  main().querySelector("[data-zoom]")?.addEventListener("click", e =>
    modal(`<h3>附图 · ${esc(q.img)}</h3><img class="zoomed" src="${DB_IMAGES[e.currentTarget ? q.img : q.img]}"><div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>`));
  $("#btnPrev").onclick = () => { if (s.idx > 0) { s.idx--; renderQuiz(); } };
  $("#btnMark").onclick = () => { item.marked = !item.marked; renderQuiz(); };
  $("#btnNext") && ($("#btnNext").onclick = () => { s.idx++; renderQuiz(); });
  $("#btnFinish") && ($("#btnFinish").onclick = () => finishPractice());
  $("#btnSubmit") && ($("#btnSubmit").onclick = () => confirmSubmit());
  $("#btnSubmitEarly") && ($("#btnSubmitEarly").onclick = () => confirmSubmit());

  if (!keepScroll) window.scrollTo({ top: 0 });
}

function chooseOption(pos) {
  const item = session.list[session.idx];
  if (session.submitted || item.locked) return;
  const q = QMAP[item.qid];
  const single = ansOf(q).length === 1;
  const cur = item.chosen ? item.chosen.slice() : [];
  let next;
  if (session.mode !== "mock") {
    // 练习：单选点即锁；多选切换选择，选满预期个数后锁定判分
    if (single) next = [pos];
    else next = cur.indexOf(pos) > -1 ? cur.filter(p => p !== pos) : [...cur, pos];
    item.chosen = next.length ? next : null;
    if (next.length >= ansOf(q).length) {
      item.locked = true;
      recordAnswer(item, Date.now()); saveAll(); refreshBadge();
    }
  } else {
    // 考试：允许变更多选/单选直到交卷
    if (single) next = [pos];
    else next = cur.indexOf(pos) > -1 ? cur.filter(p => p !== pos) : [...cur, pos];
    item.chosen = next.length ? next : null;
    store.set("session", { ids: session.ids, cls: session.cls, startedAt: session.startedAt, answers: session.list.map(i => i.chosen) });
  }
  renderQuiz(true);
}

function confirmSubmit() {
  const unanswered = session.list.filter(i => i.chosen == null).length;
  modal(`<h3>确认交卷？</h3>
    <p style="font-size:14px;color:var(--text2)">${unanswered ? `还有 <b style="color:var(--red)">${unanswered}</b> 题未作答，未作答按错误计。` : "所有题目均已作答。"}</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="cCancel">继续作答</button>
      <button class="btn primary" id="cOk">确认交卷</button>
    </div>`, m => {
    m.querySelector("#cCancel").onclick = closeModal;
    m.querySelector("#cOk").onclick = () => { closeModal(); submitExam(false); };
  });
}

/* ================= 判分 / 记录 ================= */
/* 单题结果写入进度与错题本 */
function recordAnswer(item, now) {
  const q = QMAP[item.qid];
  const right = isRight(item, q);
  const p = progress[item.qid] || (progress[item.qid] = { seen: 0, right: 0, wrong: 0 });
  p.seen++; right ? p.right++ : p.wrong++; p.ts = now;

  if (right) {
    if (wrongBook[item.qid]) {
      wrongBook[item.qid].streak++;
      if (settings.autoRemoveWrong && wrongBook[item.qid].streak >= 2) {
        delete wrongBook[item.qid];
        toast(`「${item.qid}」已连对 2 次，移出错题本`);
      }
    }
  } else {
    const w = wrongBook[item.qid] || (wrongBook[item.qid] = { count: 0, streak: 0 });
    const chosenTxt = (item.chosen || []).map(p => q.options[item.perm[p]]).join("，");
    w.count++; w.streak = 0; w.lastChosen = chosenTxt; w.ts = now;
  }
}

function applyAnswerRecords() {
  const now = Date.now();
  for (const item of session.list) {
    if (item.chosen == null) continue;
    if (session.mode !== "mock") continue; // 练习模式已在作答时实时记录
    recordAnswer(item, now);
  }
  if (session.mode === "mock") {
    const correct = session.list.filter(i => i.chosen != null && isRight(i, QMAP[i.qid])).length;
    history.unshift({
      ts: now, mode: session.mode, cls: session.cls, correct, total: session.list.length,
      seconds: Math.floor((Date.now() - session.startedAt) / 1000),
      pass: correct >= DB_RULES[session.cls].pass,
    });
    history = history.slice(0, 60);
    store.set("session", null);
  }
  saveAll(); refreshBadge();
}

function submitExam(auto) {
  stopTimer();
  if (session.submitted) return;
  session.submitted = true;
  applyAnswerRecords();
  renderResult(auto);
}

function finishPractice() {
  stopTimer();
  const answered = session.list.filter(i => i.chosen != null).length;
  const unanswered = session.list.length - answered;
  modal(`<h3>结束本次练习？</h3>
    <p style="font-size:14px;color:var(--text2)">${unanswered ? `还有 ${unanswered} 题未作答（不计入成绩），已答题目结果已实时记录。` : "已答题目结果均已实时记录。"}</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="fBack">继续练习</button>
      <button class="btn primary" id="fOk">结束并回首页</button>
    </div>`, m => {
    m.querySelector("#fBack").onclick = closeModal;
    m.querySelector("#fOk").onclick = () => { closeModal(); session = null; go("home"); };
  });
}

/* ================= 结果页 ================= */
function renderResult(auto) {
  const s = session;
  const rule = DB_RULES[s.cls];
  const list = s.list;
  const answered = list.filter(i => i.chosen != null).length;
  const correct = list.filter(i => i.chosen != null && isRight(i, QMAP[i.qid])).length;
  const pass = correct >= rule.pass;
  const wrongItems = list.filter(i => !(i.chosen != null && isRight(i, QMAP[i.qid])));
  const dur = Math.floor((Date.now() - s.startedAt) / 1000);
  const score = Math.round(correct / list.length * 100);

  const body = wrongItems.length ? wrongItems.map(item => {
    const q = QMAP[item.qid];
    const chosenTxt = item.chosen == null ? "未作答" : esc((item.chosen).map(p => q.options[item.perm[p]]).join("，"));
    return `<div class="wrong-item" data-review="${item.qid}">
      <span class="wid">${q.id}</span>
      <span class="wq">${esc(q.q)}</span>
      <span class="wcls" style="color:var(--red);background:var(--red-weak)">你的答案: ${chosenTxt}</span>
    </div>`;
  }).join("") : `<div class="empty-tip">🎉 全部答对，没有错题！</div>`;

  main().innerHTML = `
    <div class="result-hero ${pass ? "" : "fail"}">
      <div class="verdict ${pass ? "pass" : "fail"}">${auto ? "⏰ 时间到 · 自动交卷<br>" : ""}${pass ? "✓ 合格" : "✗ 不合格"}</div>
      <div class="score-big">${score}<span style="font-size:24px;color:var(--text2)">分</span></div>
      <div class="result-sub">答对 ${correct} / ${list.length} 题（合格线 ${rule.pass} 题）${s.mode === "mock" ? ` · 用时 ${fmtTime(dur)} / ${rule.minutes} 分钟` : ` · 用时 ${fmtTime(dur)}`}</div>
      <div class="result-stats">
        <div><b>${answered}</b><span>已作答</span></div>
        <div><b style="color:var(--green)">${correct}</b><span>答对</span></div>
        <div><b style="color:var(--red)">${list.length - answered}</b><span>未作答</span></div>
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="go('home')">返回首页</button>
        <button class="btn" onclick="go('wrong')">查看错题本</button>
        <button class="btn primary" onclick="startSession('mock')">再考一次</button>
      </div>
    </div>
    <div class="section-title">错题回顾（${wrongItems.length} 题 · 点击查看完整题目）</div>
    <div class="panel"><div class="wrong-list">${body}</div></div>`;

  main().querySelectorAll("[data-review]").forEach(el =>
    el.onclick = () => showQuestionModal(el.dataset.review));
}

/* 单题回看弹窗 */
function showQuestionModal(qid) {
  const q = QMAP[qid];
  const w = wrongBook[qid];
  const p = progress[qid];
  modal(`<h3>${q.id} <span style="font-size:12px;color:var(--text2);font-weight:400">适用类别 ${classOf(q)}</span></h3>

    <div class="q-options" style="margin-top:14px">

    </div>
    <div style="margin-top:12px;font-size:13px;color:var(--text2)">
      <span class="pill" style="background:var(--green-weak);color:var(--green)">正确答案: ${esc(correctText(q))}</span>
      ${w ? `<span class="pill" style="background:var(--red-weak);color:var(--red);margin-left:6px">上次错选: ${esc(w.lastChosen || "未作答")} · 错 ${w.count} 次</span>` : ""}
      ${p ? `<span style="margin-left:6px">个人累计: 练 ${p.seen} 次 · 对 ${p.right} / 错 ${p.wrong}</span>` : ""}
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">

      <button class="btn" onclick="closeModal()">关闭</button>

      if (ui.view === "wrong") renderWrong();

/* ================= 错题本 ================= */
let wrongFilter = { cls: "ALL", kw: "" };
function renderWrong() {
  const ids = Object.keys(wrongBook).filter(id => QMAP[id]).sort();
  const fIds = ids.filter(id => {
    const q = QMAP[id];
    if (wrongFilter.cls !== "ALL" && !q.classes.includes(wrongFilter.cls)) return false;
    if (wrongFilter.kw && !(q.q.includes(wrongFilter.kw) || id.includes(wrongFilter.kw.toUpperCase()))) return false;
    return true;
  });
  const byCls = c => ids.filter(id => QMAP[id].classes.includes(c)).length;

  main().innerHTML = `
    <div class="section-title">错题本（${ids.length} 题）</div>
    <div class="panel">
      <div class="filter-row">
        ${["ALL", "A", "B", "C"].map(c => `<button class="chip ${wrongFilter.cls === c ? "active" : ""}" data-fcls="${c}">${c === "ALL" ? "全部" : c + " 类"} (${c === "ALL" ? ids.length : byCls(c)})</button>`).join("")}
        <input type="text" id="wrongKw" placeholder="搜索题干或题号…" value="${esc(wrongFilter.kw)}">
      </div>
      ${fIds.length ? `
      <div class="wrong-list">${fIds.map(id => {
        const q = QMAP[id], w = wrongBook[id];
        return `<div class="wrong-item" data-q="${id}">
          <span class="wid">${id}</span>
          <span class="wq">${esc(q.q)}</span>
          <span class="wcls">${q.classes.join("/")}</span>
        </div>`;
      }).join("")}</div>
      <div class="quiz-actions" style="margin-top:16px">
        <button class="btn primary" id="wrongExam">🎯 错题重考（${fIds.length} 题）</button>
        <button class="btn danger" id="wrongClear">清空错题本</button>
        <span class="spacer"></span>
        <button class="btn" id="wrongExport">导出 JSON</button>
        <button class="btn" id="wrongImport">导入 JSON</button>
      </div>` : `<div class="empty-tip">${ids.length ? "没有符合筛选条件的错题" : "错题本为空，去做题吧！<br>练习或考试中答错的题目会自动出现在这里。"}</div>`}
    </div>`;

  main().querySelectorAll("[data-fcls]").forEach(b => b.onclick = () => { wrongFilter.cls = b.dataset.fcls; renderWrong(); });
  main().querySelectorAll("[data-q]").forEach(el => el.onclick = () => showQuestionModal(el.dataset.q));
  const kw = $("#wrongKw");
  kw && (kw.oninput = () => { wrongFilter.kw = kw.value.trim(); clearTimeout(renderWrong._h); renderWrong._h = setTimeout(() => { const keep = wrongFilter.kw; renderWrong(); $("#wrongKw").focus(); $("#wrongKw").value = keep; wrongFilter.kw = keep; const el = $("#wrongKw"); el.setSelectionRange(el.value.length, el.value.length); }, 300); });
  $("#wrongExam") && ($("#wrongExam").onclick = () => {
    const pool = fIds;
    session = {
      mode: "wrong", cls: settings.defaultClass, ids: pool,
      list: pool.map(id => ({ qid: id, perm: settings.shuffleOptions ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], chosen: null, marked: false })),
      idx: 0, startedAt: Date.now(), limitSec: null, remaining: 0, submitted: false, title: "错题重考",
    };
    ui.view = "quiz"; setNav(""); renderQuiz(); startTimer();
  });
  $("#wrongClear") && ($("#wrongClear").onclick = () => {
    modal(`<h3>清空错题本？</h3><p style="font-size:14px;color:var(--text2)">将删除全部 ${ids.length} 道错题记录，不可恢复。</p>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="n">取消</button><button class="btn danger" id="y">确认清空</button></div>`, m => {
      m.querySelector("#n").onclick = closeModal;
      m.querySelector("#y").onclick = () => { wrongBook = {}; saveAll(); refreshBadge(); closeModal(); renderWrong(); toast("错题本已清空"); };
    });
  });
  $("#wrongExport") && ($("#wrongExport").onclick = () => {
    const blob = new Blob([JSON.stringify(wrongBook, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ham-exam-错题本.json"; a.click();
    URL.revokeObjectURL(a.href);
  });
  $("#wrongImport") && ($("#wrongImport").onclick = () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      f.text().then(t => {
        try {
          const data = JSON.parse(t);
          let n = 0;
          for (const [id, v] of Object.entries(data)) if (QMAP[id] && typeof v === "object") { wrongBook[id] = { count: v.count || 1, streak: 0, lastChosen: v.lastChosen, ts: Date.now() }; n++; }
          saveAll(); refreshBadge(); renderWrong(); toast(`导入 ${n} 道错题`);
        } catch { toast("文件格式错误"); }
      });
    };
    inp.click();
  });
}

/* ================= 统计页 ================= */
function renderStats() {
  const totalQ = IDS.length;
  const seenIds = IDS.filter(id => progress[id]?.seen);
  const attempts = seenIds.reduce((s, id) => s + progress[id].right + progress[id].wrong, 0);
  const rights = seenIds.reduce((s, id) => s + progress[id].right, 0);
  const acc = attempts ? Math.round(rights / attempts * 100) : 0;
  const mockTests = history.filter(h => h.mode === "mock");

  main().innerHTML = `
    <div class="section-title">学习总览</div>
    <div class="stat-grid">
      <div class="stat-box"><b>${seenIds.length}<span style="font-size:14px;color:var(--text2)"> / ${totalQ}</span></b><span>已练习题数（覆盖率 ${Math.round(seenIds.length / totalQ * 100)}%）</span></div>
      <div class="stat-box"><b>${attempts}</b><span>累计答题次数</span></div>
      <div class="stat-box"><b style="color:${acc >= 80 ? "var(--green)" : "var(--amber)"}">${acc}%</b><span>总正确率</span></div>
      <div class="stat-box"><b style="color:var(--red)">${Object.keys(wrongBook).length}</b><span>错题本待攻克</span></div>
      <div class="stat-box"><b>${mockTests.length}</b><span>模拟考试次数</span></div>
    </div>

    <div class="section-title">各类别掌握情况</div>
    <div class="stat-grid">
      ${["A", "B", "C"].map(c => {
        const st = classStat(c);
        return `<div class="stat-box">
          <b>${c} 类</b>
          <span>覆盖率 ${st.total ? Math.round(st.seen / st.total * 100) : 0}%（${st.seen}/${st.total}）</span>
          <div class="cls-bar" style="margin-top:8px"><i style="width:${st.total ? st.seen / st.total * 100 : 0}%"></i></div>
          <span style="display:block;margin-top:6px">正确率 ${st.acc == null ? "—" : st.acc + "%"}</span>
        </div>`;
      }).join("")}
    </div>

    <div class="section-title">模拟考试成绩单</div>
    <div class="panel">
      ${history.length ? `<table class="history-table">
        <tr><th>时间</th><th>类别</th><th>成绩</th><th>用时</th><th>结果</th></tr>
        ${history.map(h => `<tr>
          <td>${new Date(h.ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })}</td>
          <td>${h.cls} 类${h.mode !== "mock" ? " · " + ({ seq: "顺序", rand: "随机", wrong: "错题" }[h.mode] || "") : ""}</td>
          <td>${h.correct} / ${h.total}</td>
          <td>${fmtTime(h.seconds)}</td>
          <td><span class="pill ${h.pass ? "pass" : "fail"}">${h.pass ? "合格" : "不合格"}</span></td>
        </tr>`).join("")}
      </table>` : `<div class="empty-tip">暂无考试记录，去首页参加一次全真模拟考试吧</div>`}
    </div>

    <div class="section-title">数据管理</div>
    <div class="panel">
      <div class="quiz-actions" style="margin-top:0">
        <button class="btn" id="expAll">导出全部学习数据</button>
        <button class="btn" id="impAll">导入学习数据</button>
        <button class="btn danger" id="resetAll">重置全部数据</button>
      </div>
      <p style="font-size:12.5px;color:var(--text2);margin-top:10px">所有数据保存在本机浏览器 localStorage 中，清除浏览器数据会丢失记录，建议定期导出备份。</p>
    </div>`;

  $("#expAll").onclick = () => {
    const blob = new Blob([JSON.stringify({ progress, wrongBook, history, settings, _exportedAt: Date.now() }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ham-exam-学习数据.json"; a.click();
    URL.revokeObjectURL(a.href);
  };
  $("#impAll").onclick = () => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      f.text().then(t => {
        try {
          const d = JSON.parse(t);
          if (d.progress) progress = d.progress;
          if (d.wrongBook) wrongBook = d.wrongBook;
          if (d.history) history = d.history;
          if (d.settings) settings = Object.assign(settings, d.settings);
          saveAll(); refreshBadge(); renderStats(); toast("导入成功");
        } catch { toast("文件格式错误"); }
      });
    };
    inp.click();
  };
  $("#resetAll").onclick = () => {
    modal(`<h3>重置全部数据？</h3><p style="font-size:14px;color:var(--text2)">将清除错题本、练习进度、考试记录与设置，不可恢复。</p>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end"><button class="btn" id="n">取消</button><button class="btn danger" id="y">确认重置</button></div>`, m => {
      m.querySelector("#n").onclick = closeModal;
      m.querySelector("#y").onclick = () => {
        progress = {}; wrongBook = {}; history = [];
        settings = { shuffleOptions: true, instantFeedback: true, autoRemoveWrong: true, defaultClass: "A" };
        saveAll(); refreshBadge(); closeModal(); go("home"); toast("已重置");
      };
    });
  };
}

/* ================= 设置 ================= */
function openSettings() {
  const rows = [
    { key: "shuffleOptions", label: "打乱选项顺序", desc: "开启后与真实机考一致，正确答案内容不变" },
    { key: "instantFeedback", label: "练习即时判分", desc: "练习模式中选择后立即显示对错与正确答案" },
    { key: "autoRemoveWrong", label: "错题连对 2 次自动移出", desc: "在错题本中的题目连续答对 2 次后自动移出" },
  ].map(r => `<div class="setting-row">
      <div><div class="s-label">${r.label}</div><div class="s-desc">${r.desc}</div></div>
      <label class="switch"><input type="checkbox" data-set="${r.key}" ${settings[r.key] ? "checked" : ""}><i></i></label>
    </div>`).join("");

  modal(`<h3>设置</h3>${rows}
    <div class="setting-row"><div><div class="s-label">关于</div>
    <div class="s-desc">题库：中国无线电协会公布的业余无线电台操作技术能力验证题库，共 ${IDS.length} 题（含多选 ${IDS.filter(id => ansOf(QMAP[id]).length > 1).length} 题），附图 ${Object.keys(DB_IMAGES).length} 张。所有数据仅保存在本机。</div></div></div>
    <div style="margin-top:16px;text-align:right"><button class="btn primary" onclick="closeModal()">完成</button></div>`, m => {
    m.querySelectorAll("[data-set]").forEach(cb => cb.onchange = () => {
      settings[cb.dataset.set] = cb.checked; store.set("settings", settings); toast("已保存");
    });
  });
}

/* ================= 未完成会话恢复 ================= */
function tryRestoreSession() {
  const saved = store.get("session", null);
  if (!saved || !saved.ids?.length) return;
  modal(`<h3>检测到一场未完成的模拟考试</h3>
    <p style="font-size:14px;color:var(--text2)">${saved.cls} 类 · ${saved.ids.length} 题 · ${saved.answers ? `已答 ${saved.answers.filter(a => a != null).length} 题` : "未开始作答"}。<br>计时已重置，是否继续作答？</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="rDiscard">放弃</button>
      <button class="btn primary" id="rResume">继续考试</button>
    </div>`, m => {
    m.querySelector("#rDiscard").onclick = () => { store.set("session", null); closeModal(); };
    m.querySelector("#rResume").onclick = () => {
      closeModal();
      session = {
        mode: "mock", cls: saved.cls, ids: saved.ids,
        list: saved.ids.map((id, i) => ({ qid: id, perm: settings.shuffleOptions ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3], chosen: saved.answers?.[i] ?? null, marked: false })),
        idx: 0, startedAt: Date.now(), limitSec: DB_RULES[saved.cls].minutes * 60,
        remaining: DB_RULES[saved.cls].minutes * 60, submitted: false, title: `${saved.cls} 类全真模拟考试`,
      };
      ui.view = "quiz"; setNav(""); renderQuiz(); startTimer();
    };
  });
}

/* ================= 启动 ================= */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".nav-btn[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#settingsBtn").onclick = openSettings;
  refreshBadge();
  go("home");
  setTimeout(tryRestoreSession, 300);
});

</script>
</body>
</html>
