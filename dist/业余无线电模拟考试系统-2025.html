<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业余无线电操作证书 · 模拟考试系统</title>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface2: #eef1f6;
  --border: #d9dee7;
  --text: #1c2330;
  --text2: #5b6675;
  --primary: #2563eb;
  --primary-weak: #dbeafe;
  --green: #16a34a;
  --green-weak: #dcfce7;
  --red: #dc2626;
  --red-weak: #fee2e2;
  --amber: #d97706;
  --amber-weak: #fef3c7;
  --shadow: 0 1px 3px rgba(20, 30, 50, .08), 0 4px 16px rgba(20, 30, 50, .06);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
}
.hidden { display: none !important; }

#app { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }

/* ---------- 顶栏 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 10px; padding: 14px 4px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { font-size: 30px; }
.brand-text h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
.brand-sub { font-size: 12px; color: var(--text2); }
#nav { display: flex; gap: 6px; align-items: center; }
.nav-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  position: relative; transition: .15s;
}
.nav-btn:hover { border-color: var(--primary); color: var(--primary); }
.nav-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.badge {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--red); color: #fff; font-size: 11px; line-height: 18px;
  text-align: center; vertical-align: 1px; margin-left: 2px;
}

/* ---------- 首页 ---------- */
.section-title { font-size: 15px; font-weight: 600; color: var(--text2); margin: 18px 2px 10px; }
.class-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.class-card {
  background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: .15s; text-align: left; font-family: inherit;
}
.class-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.class-card.selected { border-color: var(--primary); background: #f7faff; }
.class-card h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
.class-tag {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px; background: var(--primary); color: #fff;
  font-weight: 700; font-size: 16px;
}
.class-card p { font-size: 13px; color: var(--text2); margin-top: 6px; }
.class-card .cls-stat { margin-top: 8px; font-size: 12px; color: var(--text2); }
.cls-bar { height: 6px; border-radius: 3px; background: var(--surface2); margin-top: 6px; overflow: hidden; }
.cls-bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .3s; }

.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: .15s; text-align: left; font-family: inherit;
  display: flex; gap: 12px; align-items: flex-start;
}
.mode-card:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-2px); }
.mode-icon {
  font-size: 22px; width: 44px; height: 44px; flex: none; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; background: var(--primary-weak);
}
.mode-card h4 { font-size: 15px; }
.mode-card p { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
.mode-card.disabled { opacity: .45; cursor: not-allowed; }
.mode-card.disabled:hover { transform: none; border-color: var(--border); box-shadow: none; }

.hint-box {
  margin-top: 16px; padding: 10px 14px; border-radius: 10px;
  background: var(--amber-weak); color: #7c4a03; font-size: 13px;
}

/* ---------- 答题页 ---------- */
.quiz-top {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: 8px 0 10px;
}
.quiz-info {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
  gap: 8px; font-size: 13px; color: var(--text2);
}
.quiz-info .qmeta b { color: var(--text); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; color: var(--text); }
.timer.warn { color: var(--red); }
.progress { height: 6px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .25s; }

.q-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px; margin-top: 10px;
}
.q-id { font-size: 12px; color: var(--text2); letter-spacing: .5px; }
.q-text { font-size: 17px; font-weight: 600; margin-top: 6px; white-space: pre-wrap; }
.q-img-wrap { margin-top: 14px; text-align: center; }
.q-img-wrap img {
  max-width: 100%; max-height: 420px; border: 1px solid var(--border);
  border-radius: 8px; background: #fff; padding: 6px; cursor: zoom-in;
}
.q-options { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; width: 100%;
  border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 12px 14px; font-size: 15px; cursor: pointer; text-align: left;
  font-family: inherit; color: var(--text); transition: .12s; line-height: 1.5;
}
.opt:hover { border-color: var(--primary); }
.opt .key {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--text2);
}
.opt.chosen { border-color: var(--primary); background: #f5f9ff; }
.opt.chosen .key { border-color: var(--primary); background: var(--primary); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-weak); }
.opt.correct .key { border-color: var(--green); background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-weak); }
.opt.wrong .key { border-color: var(--red); background: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.feedback { margin-top: 14px; font-size: 14px; font-weight: 600; }
.feedback.ok { color: var(--green); }
.feedback.no { color: var(--red); }

.quiz-actions {
  display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center;
}
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 9px 20px; border-radius: 10px; font-size: 14px; cursor: pointer;
  font-family: inherit; transition: .15s;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red-weak); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--border); color: var(--text); }
.spacer { flex: 1; }

/* ---------- 答题卡 ---------- */
.answer-sheet {
  margin-top: 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; margin-top: 10px; }
.sheet-cell {
  aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface2); font-size: 13px; cursor: pointer; font-family: inherit;
  color: var(--text2); position: relative;
}
.sheet-cell.answered { background: var(--primary-weak); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.sheet-cell.current { outline: 2px solid var(--amber); outline-offset: 1px; }
.sheet-cell .mark-dot {
  position: absolute; top: 3px; right: 3px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--amber);
}
.sheet-cell.result-right { background: var(--green-weak); border-color: var(--green); color: var(--green); }
.sheet-cell.result-wrong { background: var(--red-weak); border-color: var(--red); color: var(--red); }
.sheet-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
.sheet-legend span::before {
  content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 5px; vertical-align: -1px; border: 1px solid var(--border); background: var(--surface2);
}
.sheet-legend .lg-answered::before { background: var(--primary-weak); border-color: var(--primary); }
.sheet-legend .lg-mark::before { background: var(--amber); border-color: var(--amber); border-radius: 50%; }

/* ---------- 结果页 ---------- */
.result-hero {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 30px 20px; text-align: center; margin-top: 14px;
  border-top: 4px solid var(--green);
}
.result-hero.fail { border-top-color: var(--red); }
.result-hero .verdict { font-size: 24px; font-weight: 800; }
.result-hero .verdict.pass { color: var(--green); }
.result-hero .verdict.fail { color: var(--red); }
.score-big { font-size: 52px; font-weight: 800; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.result-sub { color: var(--text2); font-size: 14px; }
.result-stats { display: flex; justify-content: center; gap: 26px; margin-top: 16px; flex-wrap: wrap; }
.result-stats div { text-align: center; }
.result-stats b { display: block; font-size: 20px; }
.result-stats span { font-size: 12px; color: var(--text2); }

/* ---------- 错题本 / 统计 ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 14px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-row input[type=text] {
  flex: 1; min-width: 160px; border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
}
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 5px 13px; font-size: 13px; cursor: pointer; color: var(--text2); font-family: inherit;
}
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.wrong-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.wrong-item {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  cursor: pointer; transition: .12s; display: flex; gap: 10px; align-items: baseline;
}
.wrong-item:hover { border-color: var(--primary); background: #f8faff; }
.wrong-item .wid { font-size: 12px; color: var(--text2); flex: none; }
.wrong-item .wq { font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrong-item .wcls { flex: none; font-size: 11px; color: var(--primary); background: var(--primary-weak); border-radius: 6px; padding: 1px 7px; }
.empty-tip { text-align: center; color: var(--text2); padding: 40px 0; font-size: 14px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.stat-box b { font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.stat-box span { font-size: 12.5px; color: var(--text2); }
.history-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.history-table th, .history-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--surface2); }
.history-table th { color: var(--text2); font-weight: 600; font-size: 12.5px; }
.pill { font-size: 12px; border-radius: 6px; padding: 1px 8px; }
.pill.pass { background: var(--green-weak); color: var(--green); }
.pill.fail { background: var(--red-weak); color: var(--red); }

/* ---------- 弹层 ---------- */
#modalRoot {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--surface); border-radius: 14px; max-width: 640px; width: 100%;
  max-height: 86vh; overflow: auto; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.modal h3 { font-size: 17px; margin-bottom: 14px; }
.modal img.zoomed { max-width: 100%; max-height: 70vh; background: #fff; padding: 8px; border-radius: 8px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--surface2); gap: 14px; }
.setting-row:last-child { border-bottom: none; }
.setting-row .s-label { font-size: 14.5px; }
.setting-row .s-desc { font-size: 12.5px; color: var(--text2); }
.switch { position: relative; width: 42px; height: 24px; flex: none; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i {
  position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: .2s;
}
.switch i::after {
  content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; top: 3px; left: 3px; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + i { background: var(--primary); }
.switch input:checked + i::after { left: 21px; }
select.num-select {
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
}

/* ---------- Toast ---------- */
#toast {
  position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
  background: rgba(28, 35, 48, .92); color: #fff; padding: 10px 22px;
  border-radius: 999px; font-size: 14px; z-index: 200; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}

#pageFooter {
  text-align: center; font-size: 12px; color: var(--text2);
  padding: 18px 16px 26px; line-height: 1.8;
}

@media (max-width: 640px) {
  .q-card { padding: 16px; }
  .q-text { font-size: 16px; }
  #topbar { justify-content: center; }
  .brand-text h1 { font-size: 17px; }
}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-logo">📻</span>
      <div class="brand-text">
        <h1>业余无线电模拟考试</h1>
        <p class="brand-sub">题库 2025 · 1375 题</p>
      </div>
    </div>
    <nav id="nav">
      <button class="nav-btn" data-view="home">首页</button>
      <button class="nav-btn" data-view="wrong">错题本 <span id="wrongBadge" class="badge hidden"></span></button>
      <button class="nav-btn" data-view="stats">统计</button>
      <button class="nav-btn" id="settingsBtn" title="设置">⚙</button>
    </nav>
  </header>

  <main id="main"></main>

  <div id="modalRoot" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>

<footer id="pageFooter">
  依据中国无线电协会公布的《业余无线电操作技术能力验证题库》(2025) 制作 ·
  A类 30题/40分钟/答对24题合格 · B类 50题/60分钟/答对40题合格 · C类 90题/100分钟/答对60题合格
</footer>

JA2IGY"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0258", "q": "业余无线电爱好者有时会在通联中使用广为流传的另类字母解释法来拼读呼号、名字和文字。这些常见于DX通联。Sugar Five Three Mexico Norway Ontario为：", "options": ["S53MNO", "F5EQU", "WH8ZDP", "JA2IGY"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0259", "q": "如果一部业余电台在呼叫CQ，他的意思是：", "options": ["非特指地呼叫任何一部国内和国外业余电台", "呼叫国内业余电台", "呼叫国外业余电台", "倾向于呼叫DX电台，国内电台最好别回应"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0260", "q": "一部业余电台如何发起CQ呼叫？", "options": ["呼叫CQ并报出己方呼号。清晰起见，可重复一两次CQ并对呼号进行字母拼读", "呼叫“有朋友在频率上吗？”，然后报出自己的呼号。清晰起见，可对呼号进行字母拼读", "说“CQ”三次，再说“请过来”一次。清晰起见，可对CQ进行字母拼读", "说“CQ”三次，再说“standing by”一次。清晰起见，可对CQ进行字母拼读"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0261", "q": "如何回答一个CQ呼叫？", "options": ["报出对方的呼号并报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读", "报出自己的呼号并报出对方的呼号。清晰起见，可重复关键内容或进行字母拼读", "说“CQ”三次再报出对方的呼号三次。清晰起见，可重复关键内容或进行字母拼读", "先给出信号报告再报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0262", "q": "业余电台操作员小强呼叫另一业余电台并希望与操作员小明通话的方法是：", "options": ["报出对方的呼号并报出自己的呼号。建立通信后即可提出与小明通话", "报出自己的呼号并报出对方的呼号。建立联络后即可提出与小明通话", "说“CQ小明”三次再报出自己的呼号。清晰起见，可对呼号进行字母拼读", "说“CQ小明”三次再报出“我是小强”。清晰起见，可对CQ进行字母拼读"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0263", "q": "业余电台建立通信后，双方应首先交换的必要信息是：", "options": ["信号报告", "操作员名字", "操作地点", "设备、设施情况"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0264", "q": "为什么业余电台建立通信后总是立即交换信号报告？", "options": ["双方需要此报告来了解传播情况，安排最适合的操作", "这是最基本的报务要求，不必去问，只管去执行就好", "双方需要此报告来校准发射功率", "决定是否放弃联络，因为低于S5的信号与奖状无缘"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0265", "q": "在现代业余无线电通信中，信号报告均采用“RST格式”。缩语RST中的字母R代表：", "options": ["信号的可辩度", "信号的强度", "信号的纯净度", "Q简语QRK"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0266", "q": "小明和小强进行CW和FM联络，双方的收信机均指示信号强度为“5”。通报时，双方评价听抄顺畅，没有变调等信号缺陷；通话时，双方认为声音易于辩识，没有明显影响听抄的失真。此时，双方应当为CW和FM通联给出信号报告：", "options": ["559和55", "55和559", "不必关心信号强度表的指示，给出599和59才是最好的", "不必关心信号强度表的指示，给出59和599才是最好的"], "ans": [0], "classes": ["A", "B"]}, {"id": "MC1-0267", "q": "业余电台在发起呼叫前应先守听。但是，我们有时会因听不到通信中的某一方而误认为频率空闲。此时呼叫“CQ”有可能干扰他人联络。为尽量避免这种情况，我们可以：", "options": ["询问“有人使用频率吗？”，确认没有应答再发起呼叫", "询问“有吗？有吗？请过来。”，确认没有应答再发起呼叫", "先启动呼叫再进行通信，等听到确实有电台在工作再让出频率不迟", "先启动呼叫再进行通信，只要没有其他电台要求QSY就持续使用"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0268", "q": "BH1ZZZ希望加入两个电台相互之间的联络。正确的方法是：", "options": ["在一方刚刚停止讲话时迅速发出“插入”或“break”。如得到回应，再说明“BH1ZZZ请求插入”。待对方正式邀请后，开始正式对话", "在一方正在讲话时短暂插入一次“break”，向正在收听的一方发出插入请求", "短暂发射一次“插入”或“break”。如对方无反应，可以加大功率反复尝试", "如果双方都是自己熟悉的业余电台操作员，直接讲进去便是，不必拘泥礼节"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0269", "q": "如果在联络中听到有个遇险的电台要求插入，你该怎么做？", "options": ["立即与该台确认险情并了解其需要什么帮助", "立即联系或找人协助联系当地熟悉紧急情况下通信联络的爱好者或爱好者团队", "立即变更工作频率", "立即停止发射活动"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0270", "q": "在请求插入两个电台间的对话之时，一个值得借鉴的经验是：", "options": ["思考自己的加入是否会影响原通信双方的交谈乐趣", "确认自己的信号质量可以得到原通信双方的共同赞赏", "确定自己的操作等级与原通信双方的大体相当", "确信自己有比原通信双方更具吸引力的谈话内容"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0271", "q": "若发现有业余电台的发射操作技巧不够规范，但还不至于造成严重的干扰和影响，正确的做法是：", "options": ["通过电话、邮件等方式提出善意的改进建议", "立即在频率上当面加以指出和纠正", "立即报告无线电管理机构进行干涉", "立即报告当地业余无线电协会，由其总部电台到频率上进行纠察"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0272", "q": "业余电台通信受到违法电台或者不明电台的严重干扰。正确的做法是：", "options": ["不予理睬，收集有关信息并向无线电管理机构举报", "在频率上向其宣传无线电管理法，要求其停止干扰", "立即报告无线电管理机构进行干涉", "用大功率信号对其进行压制"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0273", "q": "如果与几十千米以外的某业余电台有很多重要的技术问题和个人情况要交流，应该选用下列通信方式：", "options": ["电话或者互联网", "利用当地的业余中继台", "利用HF频段业余电台", "利用天线足够高的VHF/UHF频段业余电台"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0274", "q": "法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：", "options": ["通信时间、通信频率、通信模式、对方呼号、双方信号报告", "通信对方姓名、对方所在国家或城市、通信模式、双方信号报告", "通信时间、通信频率、双方收发信设备和天线、对方台址", "通信时间、通信模式、对方信号报告、对方台址、对方天气"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0275", "q": "法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：", "options": ["DATE、TIME、FREQ、MODE、CALL（对方）、RST（双方）", "DATE、FREQ、QTH（对方）、RIG（对方）、RST（双方）、WX（对方）", "DATE、TIME、MODE、CALL（对方）、QTH（对方）、RST（双方）", "CALL（通信对方）、TIME、FREQ、RIG（对方）、RST（双方）、PWR（双方）"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0278", "q": "关于QSL卡片的用法，以下说法正确的是：", "options": ["如果所交换的QSL卡片并非用作通联或收听证明，则应在通信方式一栏填写“现场交流”或“Eyeball QSO”等字样。不应赠送空白卡片", "业余无线电爱好者的空白QSL卡片可以用作照片或名片，适合赠送，交换或散发", "火腿都是互相的。虽然对方没有联络自己，但是也可以发去确认联络的QSL卡片", "如果在联络中没有听清对方呼号，或在日志中漏填或打错了对方呼号，则在寄发QSL卡片时可在对方呼号一栏填写对方操作员的名字"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0279", "q": "收到国外寄来的QSL卡片时，如果信封中夹带有一张或多张IRC，则应：", "options": ["尽快检查电台日志，确认联络的真实性，向对方地址直接寄出自己的QSL卡片", "不必确认联络的真实性，只要尽快向对方地址直接寄出自己的卡片即可", "尽快检查电台日志，确认联络的真实性，向国内QSL卡片管理局寄出自己的卡片", "不必理会。操作类别越低越不必理会。低级别业余电台的QSL卡片通常不具价值"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0280", "q": "填写和邮寄QSL卡片的正确做法是：", "options": ["迫切需要对方回寄卡片时，应直接向对方地址邮寄卡片并附加SASE", "填写错误时应划去或使用涂改液覆盖错误内容并加以改正", "自己的邮寄地址与电台的发射地点不同时，应在QTH栏目内填明详细邮寄地址", "通过卡片管理局寄出卡片并希望对方回卡时，应在卡片上注明PSE QSL DIRECT"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0281", "q": "交换QSL卡片时，我们时有遇见一类特殊的无线电爱好者，他们仅向我们寄发收听卡片。而我们在确认卡片所载内容之后会立即回卡以示敬意。这类爱好者是：", "options": ["短波收听者（SWL）", "广播爱好者", "DIY爱好者", "业余无线电监测员"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0282", "q": "通过中继台进行通联时，我们应事先设好电台的接收和发射频差，以便顺利应对上行或下行频率上的各种操作，避免边联络边设置，忙中出错。144和430MHz频段业余中继台的上下行频差分别为：", "options": ["0.6MHz，5MHz", "12.5kHz，25kHz", "4MHz，10MHz", "2MHz，5MHz"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0283", "q": "如果通过中继台呼叫一部业余电台，你应当：", "options": ["呼叫对方的呼号并报出自己的呼号", "呼叫“break, break”，然后说出对方呼号二至三次", "呼叫“CQ”三次，然后说出自己的呼号三次", "等待，直到你要呼叫的电台通过中继台呼叫CQ"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0284", "q": "业余中继台的使用原则是：", "options": ["除必要的简短联络外，业余中继台的上行和下行频率应保持空闲，以备随时响应突发灾害等紧急情况下的呼叫", "应使中继台尽量处于接近饱和的忙碌状态，提高使用效率", "鼓励业余无线电民间组织（协会）通过中继台向当地会员发布通知", "鼓励青少年学生通过中继台交流解题方法和学习心得"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0285", "q": "深空（deep space）是指离地球的距离约等于或大于下列值的空间：", "options": ["200万千米", "20万千米", "10万米", "15000米"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0286", "q": "业余地球卫星的轨道倾角（inclination）是指包含：", "options": ["轨道平面与地球赤道平面的夹角，由地球赤道平面在轨道升交点按逆时针方向计决定", "轨道平面与地球赤道平面的夹角，由地球赤道平面在轨道升交点按顺时针方向计决定", "轨道平面与地球赤道平面的夹角，由地球赤道平面在轨道降交点按逆时针方向计决定", "轨道平面与地球赤道平面的夹角，由地球赤道平面在轨道降交点按顺时针方向计决定"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0287", "q": "业余卫星的周期（period）是指：", "options": ["连续两次经过其轨道上的某特定点的间隔时间", "连续两次经过地球上某观测点的间隔时间", "连续两次经过地球赤道的间隔时间", "连续两次经过地球北极的间隔时间"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0288", "q": "地球同步（geosynchronous）卫星是指：", "options": ["运行周期等于地球自转周期的地球卫星", "所经过地点的地方时基本相同的卫星", "其轨道平面通过地球北极和南极地区的卫星", "瞬时轨道平面与太阳始终保持固定取向的卫星"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0289", "q": "太阳同步（轨道）（Sun-synchronous orbit）卫星是指：", "options": ["瞬时轨道平面与太阳始终保持固定取向的卫星", "对地球保持大致相对静止的卫星", "圆形及顺行轨道位于地球赤道平面上，并对地球保持相对静止的卫星", "运行周期等于地球自转周期的地球卫星"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0290", "q": "地球(geostationary)静止卫星是指：", "options": ["对地球保持大致相对静止的卫星", "所经过地点的地方时基本相同的卫星", "其轨道平面通过地球北极和南极地区的卫星", "所有的地球同步卫星"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0291", "q": "卫星升轨道（ascending pass）的方向是指轨道的下列区段：", "options": ["由南向北", "由北向南", "由东北向西南", "由东南向西北"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0292", "q": "卫星降轨道（descending pass）的方向是指轨道的下列区段：", "options": ["由北向南", "由南向北", "由东北向西南", "由东南向西北"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0293", "q": "卫星的周期是指：", "options": ["卫星沿轨道绕地球一周所需的时间", "卫星绕质心自旋一周所需的时间", "卫星两次正好从地面某一点的正上方通过的间隔时间", "卫星随地球绕太阳一周所需的时间"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0294", "q": "卫星的线性转发器是指：", "options": ["卫星上将接收到的一定带宽内的所有上行信号在频谱上平移（或平移加反转）后加以转发的中继设备", "接收到的上行信号经线性放大后解调处理，再重新调制并转发的卫星中继设备", "接收到的上行信号解调处理后经线性放大，再重新调制并转发的卫星中继设备", "接收到的上行信号解调处理和重新调制后，经线性放大再转发的卫星中继设备"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0295", "q": "卫星线性转发器的特点是：", "options": ["转发工作频带内的所有信号而不改变信号原有的调制特征，可为各种常用业余无线电通信方式进行中继", "转发器采用线性放大电路，转发的信号失真小", "先对接收信号解调，经整形、线性放大后重新调制转发，提高下行信号高信噪比", "转发信号的幅度与上行信号幅度成线性正比，只能为CW、SSB和AM等带有振幅调制特征的通信方式进行中继"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0296", "q": "有时接收到的卫星下行信号强度会出现周期性的快衰落，这是因为：", "options": ["卫星翻滚造成收发信天线极化的失配", "电波受电离层的影响", "电波受高空气流的影响", "卫星电源不够稳定"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0297", "q": "在安装卫星轨道预测软件后，在预测卫星位置之前必须进行的准备工作是：", "options": ["下载待预测卫星的开普勒轨道根数（轨道要素）", "输入当地的磁偏角和磁倾角", "下载最近的太阳黑子平均数", "下载最近的F107射电辐射通量"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0298", "q": "业余低轨卫星的转发器覆盖范围有限。利用这类卫星进行全球性业余无线电通信的解决方法是：", "options": ["由卫星对上行数据进行存贮和转发", "由地面站进行地面中继", "地面业余电台换用更大功率的发射机", "增加地面业余电台的天线高度"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0299", "q": "业余电台在进行业余卫星通信时使用超过常规要求的发射功率，造成的结果以及对这种做法的态度是：", "options": ["过强的上行信号会使卫星转发器压低对其他信道的转发功率，严重影响别人通信；必须反对", "上行功率越大，转发的效果越好，通信范围越大；可提倡", "上行功率超过一定值对通信效果改善不大，但并无明显坏处；无所谓", "上行功率太大造成浪费和电磁污染；不提倡"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0300", "q": "业余电台在进行业余卫星通信时如何确定当前发射功率是恰当的？", "options": ["确定下行链路的信号强度与信标大体一致", "利用遥测电文观察本台信号强度", "试听下行链路的声音是否过载失真", "询问其他电台，是否需要本台QRP"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0301", "q": "业余电台和业余卫星之间通信，VHF/UHF频段影响信号强度的主要因素是：", "options": ["无线电波在自由空间的衰减", "电离层对无线电波的吸收", "电离层对无线电波的反射", "大地对无线电波的吸收"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0302", "q": "业余卫星通信中所说的A、B、K、JA、JD、S、T等工作方式，表示的是：", "options": ["业余无线电转发器的上下行通信所用的业余频段以及所支持的调制方式", "发射业余卫星的国家的呼号前缀", "业余无线电转发器的发射功率等级", "业余卫星的某些轨道参数"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0303", "q": "业余卫星通信和业余无线电测向都会出现“多普勒效应”的概念。多普勒效应是指：", "options": ["收发信机之间相对距离的变化使接收信号频率产生偏移的现象", "传播条件随时间的扰动使接收信号幅度产生波动的现象", "传播条件随空间位置的扰动使接收信号幅度产生波动的现象", "电波的极化在传播途中变化使接收信号幅度产生波动的现象"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0304", "q": "地面业余电台进行业余卫星通信时，接收到的卫星信号频率的多普勒频移规律是：", "options": ["卫星飞来时频率偏高，飞离时频率偏低，越远频偏越大，过顶时频偏最小", "卫星飞来时频率偏低，飞离时频率偏高，越远频偏越大，过顶时频偏最小", "卫星飞来时频率偏高，飞离时频率偏低，越远频偏越小，过顶时频偏最大", "卫星飞来时频率偏低，飞离时频率偏高，越远频偏越小，过顶时频偏最大"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0305", "q": "业余无线电卫星一般都选择运行在低轨道或者椭圆轨道上。主要原因是：", "options": ["发射成本低", "卫星转发器的功率因此增加", "增强地球引力以利运行稳定", "增加卫星转发器的覆盖范围"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0306", "q": "业余电台在发起呼叫前应先守听一段时间，然后再询问“有人使用频率吗？”，确认没有应答方可发起呼叫。下列英语短句中不能正确表达这一询问的是：", "options": ["Call  "classes": ["B", "C"]}, {"id": "MC1-0334", "q": "进行CW通联，如果对方完美抄收了我们发出的消息，他们会在回复时用缩语“R”或Q简语“QSL”告知。但是，对方有时会用“CPI”替代“R”或“QSL”。这是因为：", "options": ["这里的“CPI”对应英语“copied”，也是“抄收”之意。这可以用来减少用词重复", "这里的“CPI对应英语“code perfectly interpreted”，表示消息完美抄收了", "这里的“CPI”对应英语“code printed immediately”，表示消息打印出来了", "那是谦辞：Cool，pretty interesting。那表示我们双方沟通顺畅"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0335", "q": "通联时，如需了解自己的信号是否遇到了他台干扰，可使用短句：", "options": ["QRM？", "QSM？", "QSN？", "QSD？"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0336", "q": "在通联中，如需告诉对方其信号遇到了他台干扰，我们可以发：", "options": ["QRM", "QRN", "QRS", "QRP"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0337", "q": "通联时，如需了解自己的信号是否遭遇了天电干扰，可使用短句：", "options": ["QRN？", "QRM？", "QRP？", "QRQ？"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0338", "q": "在通联中，如需告诉对方其信号遇到了天电干扰，我们可以发：", "options": ["QRN", "QRM", "QRP", "QRQ"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0339", "q": "CW联络时，对方有时会发来符号“滴答滴滴滴”。这像是将“AS”连发在了一起，而我们抄写时会在“AS”上面加个横线。该符号的含义是：", "options": ["请稍等", "亚洲", "英语“因为”的意思，因为紧随其后就是对方针对提问的回复了", "先进信号"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0340", "q": "通联时，如收到对方发送的短句“PSE QSL VIA BURO”，则其中的“QSL”意指：", "options": ["QSL卡片", "对消息“VIA BURO”是否收妥进行确认", "通过预定的局间交换机制给收据，进行异步ACK作业", "随意给个确认，口头的、QSL卡片或email都可以的"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0341", "q": "业余无线电爱好者在结束当前联络并互致再见时经常使用缩语：", "options": ["CU、CU AGN或GB", "GM、GA、GE、GN或GX", "TU、TKS、TNX或MNI TKS", "Thank you, and good luck"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0342", "q": "在结束CW会话之时，我们时常听到对方发来符号“滴滴滴答滴答”。这像是将“SK”连发在了一起，而我们抄写时会在“SK”上面加个横线。该符号的意思是：", "options": ["结束当前联络", "心情愉快", "感谢", "下次再见"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0343", "q": "QRP操作时如果对方反映信号不好，我们可能会追问是否需要增加功率。此时可发送：", "options": ["QRO？", "QSO？", "QRP？", "QRS？"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0344", "q": "通联时，如认为QRP操作足以保证可靠联络，则可与对方协商降低功率。短句为：", "options": ["QRP？", "May I try QRO for you？", "QRU？", "May I try QRT for you？"], "an : "业余电台一般不用调频话方式进行莫尔斯电码通联。这是因为：", "options": ["调频话信道带宽超过传输莫尔斯电码的必要带宽，不符合我国《无线电频率划分规定》“电台的技术特性”一章关于 “把带宽保持在技术状态和该项业务的性质所允许的最低值上”的要求", "调频话方式不能传输莫尔斯电码", "调频话方式传输莫尔斯电码可靠性差", "调频话方式传输莫尔斯电码时速度受限制"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0447", "q": "无论是FM还是SSB调制，向发射机的话筒输入端施加10倍于规定输入电压的音频信号，最可能的结果是：", "options": ["信号失真。大量的谐波和互调产物还可能促使发射带宽增加，通信质量下降", "通信距离有效延长了，信号听起来也更加饱满", "通信距离有效延长了，只是信号听上去失真了", "发射功率超过额定值，发射机的末级射频功率器件会因此烧毁"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0450", "q": "一个语音信号经USB发射机调制成为射频信号。从频域观点看，这种调制是：", "options": ["将语音信号的频谱平移到了载波位置上", "使频谱各分量的相对幅度发生了有规律的变化", "将语音信号的频谱倒置并移动到了载波位置上", "一种非线性变换，因而产生了无限多的边带"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0451", "q": "一个语音信号经LSB发射机调制成为射频信号。从频域观点看，这种调制是：", "options": ["将语音信号的频谱倒置并移动到了载波位置上", "使频谱各分量的相对幅度发生了有规律的变化", "将语音信号的频谱平移到了载波位置上", "一种非线性变换，因而产生了无限多的边带"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0453", "q": "下列哪一项决定了FM信号的频偏？", "options": ["调制信号的幅度", "调制信号的频率和幅度", "调制信号的频率", "调制信号与主载波之间的相位关系"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0455", "q": "对于给定的FM业余电台，决定其实际发射带宽的因素是：", "options": ["所需传输的调制信号的最高频率越高，幅度越大，已调信号的带宽越宽", "所需传输的调制信号的最高频率越高，已调信号的带宽越宽，与调制信号的幅度无关", "所需传输的调制信号的幅度越大，已调信号的带宽越宽，与调制信号的最高频率无关", "已调信号的带宽是与调制方式相关的某个标称值，对业余业务就是25kHz或12.5kHz"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0456", "q": "对于给定的SSB业余电台，决定其实际发射带宽的因素是：", "options": ["所需传输的调制信号的带宽越宽，已调信号的带宽越宽", "所需传输的调制信号的最高频率越高，已调信号的带宽越宽，与调制信号的幅度和带宽无关", "所需传输的调制信号的幅度越大，已调信号的带宽越宽，与调制信号的频率和带宽无关", "已调信号的带宽是与调制方式相关的某个标称值，对业余业务就是2.7kHz"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0457", "q": "在业余无线电业务中，莫尔斯电码的信号速度经常用WPM作为单位，其计量方法为：", "options": ["每分钟包含的无间隙“点”的个数除以50即为WPM数", "每分钟实际拍发的英文字符数即为WPM数", "每分钟实际拍发的中文字符数即为WPM数", "每分钟包含的无间隙“点”的个数除以60即为WPM数"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0458", "q": "在业余无线电业务中，莫尔斯电码的信号速度经常用WPM作为单位，其计量方法为：", "options": ["每分钟拍发连续英文单词“PARIS”的个数即为WPM数", "每分钟实际拍发的英文字符数即为WPM数", "每分钟实际拍发的中文字符数即为WPM数", "每分钟拍发连续“点”的个数除以60即为WPM数"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0459", "q": "在业余无线电业务中，计算莫尔斯电码的WPM速度时采用的信号时值标准（以一个“点”信号的时间为比较基准）为，点信号、划信号、字符内点划信号的间隔、字符之间的间隔、单词（组）之间的间隔分别为：", "options": ["1、3、1、3、7", "1、3、1、3、5", "1、5、1、5、7", "1、5、2、3、3"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0460", "q": "计算CW信号的必要发射带宽可以使用公式Bn=B×K。其中，B为波特率。如果已知拍发电码的WPM值，则B可以计算为：", "options": ["WPM/1.2", "WPM+1.2", "WPM-1.2", "WPM×1.2"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0461", "q": "计算CW信号的必要发射带宽可以使用公式Bn=B×K。其中，常数K描述电码符号翻转时CW射频信号的边带滚降特性。K的取值原则是：", "options": ["对于HF等衰落信道，K取5；对于非衰落信道，K取3即可", "对于非衰落信道，K取5；对于HF等衰落信道，K取3即可", "对于HF等衰落信道，K取50波特；对于非衰落信道，K取300波特", "对于非衰落信道，K取50波特；对于HF等衰落信道，K取300波特"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0462", "q": "调频话的必要带宽Bn取决于FM信号的峰值频偏D与最高调制频率M。估算方法为：", "options": ["Bn=2(M+D)", "Bn=2M+D", "Bn=M+2D", "Bn=2(D+M×K)"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0463", "q": "业余频段中的慢扫描电视（SSTV）和无线电传真（FAX）的调制方式都是：", "options": ["FM", "AM", "PM", "CW"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0464", "q": "业余无线电慢扫描电视所传送的是：", "options": ["逐行扫描的静止图像", "交叉扫描的静止图像", "逐行扫描的活动图像", "交叉扫描的活动图像"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0466", "q": "接收Robot、Scottie、Martin、SC2或PD等方式的SSTV信号时，我们会听到一种周期性的，非常短促的“咯、咯”声，它们是：", "options": ["行同步信号", "一种超低频寄生振荡", "标准频率和标准亮度信号", "FM和SSB两种方式在相互差拍"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0467", "q": "SSTV通信提供了Robot、Scottie、AVT、Martin等不同传输方式。具体区别是：", "options": ["像素分辨率、像素调制方法、行频、帧频等参数不同，适用于不同画质和环境条件", "占用频带宽度不同", "要求的接收机灵敏度不同", "操作难度不同"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0469", "q": "慢扫描电视（SSTV）的基带信号通常是在音频范围内生成并通过单边带或调频话方式进行传输的。关于SSTV基带，以下描述正确的是：", "options": ["调频方式：白电平为高频率2300Hz，黑电平为低频率1500Hz，同步电平为最低频率1200Hz", "调幅方式：白电平为高电平87.5%，黑电平为低电平30%，同步电平为最低电平25%", "调幅方式：白电平为低电平75%，黑电平为高电平75%，同步电平为最高电平100%", "调幅方式：白电平为低频率1200Hz，黑电平为高频率2000Hz，同步电平为最高频率2300Hz"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0470", "q": "如果收到的SSTV或ATV图像出现水平粗黑条纹、上下半帧错位的现象，则是因为：", "options": ["双方的行频、帧频一致，但是帧扫描的初始时刻不同步", "双方的扫描行频不一致", "双方设备没有准确调谐在同一频率上", "双方设备没有正确设置调制极性"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0471", "q": "如果收到的SSTV或ATV图像左右倾斜，呈平行四边形或斜粗条纹图样，则是因为：", "options": ["双方的扫描行频不一致", "双方的行频、帧频一致，但是帧扫描的初始时刻不同步", "双方设备没有准确调谐在同一频率上", "双方设备没有正确设置调制极性"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0472", "q": "为什么不能在低于1.2GHz的业余频段进行常规的ATV通信？", "options": ["ATV通信需占5MHz以上带宽，较低业余频段不足以容纳", "多数话音通信集中在较低频段，易对ATV通信产生严重干扰", "多数话音通信集中在较低频段，而ATV画面发射时间通常较长，所以要主动避让", "频率越高，ATV传输画面的质量越稳定"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0473", "q": "有时，业余无线电爱好者使用FM而非电视广播常用的经典VSB方式来传输模拟ATV信号。这样做的优点是：", "options": ["ATV信号的发射功率较小，FM解调可以更好地去除与信号相叠加的外部调幅噪声", "如果降低瞬时频偏，FM方式必要发射带宽会比VSB方式的更窄", "调频收信设备的灵敏度要比调幅的要高一个数量级（至少10dB）", "便于与工作于调频话方式的设备兼容（例如，手持电台）"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0475", "q": "发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用单边带话传输的RTTY信号的发射类别是：", "options": ["F2B", "A1A", "J3E", "G2B"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0476", "q": "发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用单边带话传输的PSK31信号的发射类别是：", "options": ["G2B", "A1A", "J3E", "F2B"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0477", "q": "发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用调频话传输的RTTY信号的发射类别是：", "options": ["F2B", "F3E", "J3E", "F3F"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0479", "q": "为了满足我国《无线电频率划分规定》“电台的技术特性”关于无线电通信“把带宽保持在技术状态和该项业务的性质所允许的最低值上”的要求，业余电台操作者应了解各种通信方式的必要带宽。决定必要带宽的因素是：", "options": ["传输的信息速率越高、系统的噪声干扰越大，必要带宽越宽", "发射设备功率越大，必要带宽越宽", "接收设备灵敏度越高，必要带宽越宽", "通信距离越近，必要带宽越宽"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0481", "q": "频移电报技术（frequency-shifttelegraphy）是指：电报信号控制载波频率在预定的范围之内变化的调频电报技术。下述业余通信使用的是移频电报技术：", "options": ["RTTY", "CW", "PSK31", "SSTV"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0482", "q": "RTTY的调制方式为：", "options": ["2FSK", "2ASK", "BPSK", "2QAM"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0483", "q": "数字通信经常涉及描述信号状态变化的“符号速率”和描述信息流量的“数据速率”这两个参数。通信方式RTTY使用f0和f1共两个频率作为符号来传输数字0和1，并且符号的发送时长通常是0.02秒。RTTY的符号速率和数据速率分别为：", "options": ["50波特，50比特/秒", "100波特，100比特/秒", "50波特，100比特/秒", "100波特，50比特/秒"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0484", "q": "数字通信经常涉及描述信号状态变化的“符号速率”和描述信息流量的“数据速率”这两个参数。通信方式BPSK31使用副载波f的两个相反的相位偏移作为符号来传输数字0和1，并且符号的发送时长约为32毫秒。BPSK31的符号速率和数据速率分别为：", "options": ["31.25波特，31.25比特/秒", "100波特，100比特/秒", "50波特，100比特/秒", "100波特，50比特/秒"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0485", "q": "数字通信经常涉及描述信号状态变化的“符号速率”和描述信息流量的“数据速率”这两个参数。通信方式MFSK16使用316Hz带宽内的16个副载波作为符号来传输16种状态，并且符号的发送时长为64毫秒。MFSK16的符号速率和数据速率分别为：", "options": ["15.625波特，62.5比特/秒", "15.625波特，250比特/秒", "15.625波特，15.625比特/秒", "62.5波特，250比特/秒"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0486", "q": "数字通信经常涉及描述信号状态变化的“符号速率”和描述信息流量的“数据速率”这两个参数。通信方式QPSK31使用载波f的互为正交的一对反相相位作为符号来传输数字00至11，并且符号的发送时长约为32毫秒。QPSK31的符号速率和数据速率分别为：", "options": ["31.25波特，62.5比特/秒", "31.25波特，31.25比特/秒", "50波特，100比特/秒", "31.25波特，125比特/秒"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0487", "q": "有些常用的业余无线电数字通信协议只支持5位或者7位数据字节的传送，因而不适合传输8位字节的二进制数据文件。下列方式中可以支持二进制数据文件传输的是：", "options": ["PACTOR", "RTTY", "AMTOR", "PSK31"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0488", "q": "业余数据通信中的差错控制技术有“前向纠错”和“自动重传请求”两种。前向纠错（ForwardError Correction，FEC）是指：", "options": ["发送方使用一定的算法获取待发送报文的冗余校验数据，将之与报文一同编码并发送；接收方按相应算法校验所收到的报文，如发现错误则利用冗余数据尝试加以纠正", "发送方在发送一定数量的报文后，如收到接收端的重传请求或者长时间收不到接收方的收妥确认即认定传输过程出错并开始重传报文，以便接收方对所收报文进行纠正", "接收方收到报文后，发回发送方，由发送方比较核对。如发现错误，将重传出错的报文，从而去除传输过程中的错误", "发送方将每组报文重复发送足够多的次数，接收方收到后加以互相比较，从而选取比较一致的一组。这可以消除传输中的随机错误"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0489", "q": "业余数据通信中的差错控制技术有“前向纠错”和“自动重传请求”两种。自动重传请求（Automatic Repeat Request，ARQ）是指：", "options": ["发送方在发送一定数量的报文后，如收到接收端的重传请求或者长时间收不到接收方的收妥确认即认定传输过程出错并开始重传报文，以便接收方对所收报文进行纠正", "发送方使用一定的算法获取待发送报文的冗余校验数据，将之与报文一同编码并发送；接收方按相应算法校验所收到的报文，如发现错误则利用冗余数据尝试加以纠正", "接收方收到报文后，发回发送方，由发送方比较核对。如发现错误，将重传出错的报文，从而去除传输过程中的错误", "发送方将每组报文重复发送足够多的次数，接收方收到后加以互相比较，从而选取比较一致的一组。这可以消除传输中的随机错误"], "ans": [0], "cla }, {"id": "MC1-0570", "q": "双工操作（duplexoperation）是指：一条电信通路的两个方向能同时进行传输的工作方式。下列通信采用双工操作方式：", "options": ["由一台连续工作的430MHz接收机和一台144MHz发信机组成的地面业余电台与业余卫星之间的通信", "两台具有QSK功能的业余CW收发信之间的通信", "一台业余中继台与一台由PTT键转换收发状态的业余对讲机之间的通信", "两台由PTT键转换收发状态的业余对讲机之间的通信"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0571", "q": "半双工操作（semi-duplex operation）是指：电路的一端用单工操作，另一端用双工操作的一种工作方式。下列通信采用半双工操作方式：", "options": ["一台业余中继台与一台由PTT键转换收发状态的业余对讲机之间的通信", "两台具有QSK功能的业余CW收发信之间的通信", "两台由PTT键转换收发状态的业余对讲机之间的通信", "两台公众移动电话终端（手机）之间的通信"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0572", "q": "收发信机中的PTT是指什么信号？", "options": ["按键发射，有信号（一般为对地接通）时发射机由等待转为发射", "发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分", "收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）", "自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0573", "q": "收发信机面板上或设置菜单中的符号SQL代表什么功能？", "options": ["静噪控制，用来调整静噪阈值的大小", "发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分", "收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）", "自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0574", "q": "收发信机设置静噪功能的目的是什么？", "options": ["在没有信号的情况下关闭音频输出，避免播放刺耳的噪声", "滤除所收信号中的噪声，使对方的话音变得清晰", "滤除发信方的环境噪声，使发出的话音更为清晰", "自动控制收信机的增益，避免信号过强时发生阻塞或失真"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0575", "q": "需要聆听非常微弱的FM信号时应如何设置收发信机的静噪？", "options": ["关闭静噪或将阈值设为0，使接收机的音频输出不受限制", "尽可能调高接收机的音量", "关闭VOX功能", "调节VOX，使之处于最灵敏的状态"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0576", "q": "用带有静噪功能的FM收发信机接收FM话音，我们有时会在发射方松开PTT的时候听到一种比较短促的“嘶”或“喀拉”的噪声拖尾。这是因为：", "options": ["此类电路根据接收机鉴频输出的高音频噪声的大小来判断信号消失与否，并据此控制音频输出。这种检测需要一定的时间才能完成，这导致短暂泄漏刺耳的噪声", "该噪声是发射台话筒的PTT键接点跳动所致，发射到接收端时还可能带有“叮”的声音", "该噪声是发射台的一种有目的所为，例如是用作结束发射的标志，有时是“嘟”的声音", "这是由接收机的自动增益电路的时间常数造成"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0577", "q": "收发信机面板上或设置菜单中的符号VOL代表什么功能？", "options": ["音量控制，用来调整接收机放出的声音大小", "发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分", "收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）", "自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比"], "ans": [0], "classes": ["A"]}, {"id": "MC1-0578", "q": "收发信机面板上或设置菜单中的符号V q": "正规生产的电子管HF线性放大器一般都在射频输出端对地并联一个电感量很大的射频扼流圈。其作用是：", "options": ["将输出端直流接地，以在机内屏极耦合电容意外击穿时短路暴露的直流高压并辅助熔断交流供电线路的保险丝", "将输出端直流接地。这既可以泄放雷击电流，又可以阻碍静电放电引起的QRN窜入接收机，从而确保正常收信", "作为放大器调谐匹配电路的一部分，这可以增加调谐电路的感抗，从而拓宽160米和80米波段的阻抗匹配范围", "旁路频率较低的信号。例如，避免强大的MF广播信号经天线进入接收机"], "ans": [0], "classes": ["C"]}, {"id": "MC1-0648", "q": "电子管线性放大器的机箱盖板内侧通常装有一个联锁开关。若取下盖板则开关立即断开。这种开关的作用是：", "options": ["断开市电输入，降低维修人员误触机内高压的可能性", "断开射频输入，防止机内高功率射频能量灼伤维修者", "断开灯丝供电，防止电子管持续发热，阻碍维修工作", "断开风机电源，防止飞转的叶轮伤及下手工作的人士"], "ans": [0], "classes": ["C"]}, {"id": "MC1-0649", "q": "发射天线的作用是：", "options": ["把发射机输出的射频信号转化为无线电波", "利用天线的增益放大发射机的输出功率", "将发射机输出的射频信号转化为音频信号", "将发射机输出的射频信号转化为红外线"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0650", "q": "接收天线的作用是：", "options": ["把空间的无线电波转化为接收机中的射频电信号", "利用天线的增益放大空间的无线电波并将之传向接收机", "将空间的无线电波转化为接收机中的音频信号", "将空间的无线电波转化为红外线"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0652", "q": "以dBi为单位的天线增益是指：", "options": ["待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB值", "待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的dB值", "待测天线最大辐射方向上的辐射功率密度与1/4波长地网天线对应值之比的dB值", "待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB值"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0653", "q": "什么是“理想点源天线”？对业余无线电又有什么意义？", "options": ["存在于理论中的一种小到一个点，可将发射机输出的全部射频能量都转化为各向同性且均匀辐射的电磁波的假想天线；用作比较实际天线辐射性能的一种全向基准天线", "一种用于专业通信的增益极高的专用天线，在业余无线电中没有应用价值", "仅用于无线电测试的一种标准接收天线，发射效果不佳，对业余无线电无用", "一种带宽近乎无限的高级天线的专利名称，业余无线电业务不需要宽带天线"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0654", "q": "以dBd为单位的天线增益是指：", "options": ["待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的dB值", "待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB值", "待测天线最大辐射方向上的辐射功率密度与1/4波长垂直天线对应值之比的dB值", "待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB值"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0655", "q": "半波振子是能够辐射电波的一种实用天线。为了获得最低输入阻抗，人们通常从中点为这种振子馈电。这就构成了具有两个1/4波长不同电极性区域的谐振偶极天线，亦称半波长偶极天线。这种天线的增益规定为0dBd。那么相比理想点源天线，其增益为：", "options": ["2.15dBi", "6dBi", "3dBi", "1.64dBi"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0656", "q": "某商品天线说明书给出的天线增益指标以dB为单位。其意义为：", "options": ["该指标未指明计算方法和所用基准，缺乏参考价值", "待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的dB值", "待测天线最大辐射方向上的辐射功率密度与1/4波长垂直天线对应值之比的dB值", "待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的dB值"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0657", "q": "我们之所以称垂直接地天线为“全向天线”，是因为：", "options": ["这种天线在水平方向上没有指向性", "这种天线在垂直方向上没有指向性", "这种天线的E面和H面方向图均为正圆", "这种天线辐射各向同性的球面波"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0658", "q": "如需垂直接地天线在大体为零仰角的水平发射方向上具有主辐射瓣并可以与同轴电缆直接耦合，则振子长度应选为：", "options": ["1/4波长", "1/2波长", "1/8波长", "3/2波长"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0661", "q": "在车内使用手持电台和俗称“橡胶天线”的柔性天线进行通信可能遇到什么问题？", "options": ["车体的屏蔽作用影响信号强度", "大量电波反射回天线，抬升SWR", "影响电台散热", "行车噪声影响通话质量"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0662", "q": "如果架设天线时发现场地附近有电线等市电供电装置，你该怎么办？", "options": ["应确保在风雨中意外掉落的天线部件不落入供电装置的安全距离内。例如，35千伏及以下电压时至少1米", "应确保供电装置带来的电源噪声不会影响电台接收弱信号的能力。通常，这个距离应至少10倍于工作波长", "必须防止通信和供电两套系统之间发生打火拉弧事故。经验上讲，按照每千伏1毫米算出的间距是足够的", "应确保天线转动到平行于供电系统的电线时，电线不会成为反射单元，即，应至少保持1/4波长以上距离"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0663", "q": "垂直接地天线（GP）由电气长度为1/4波长的垂直振子加上一个“镜像地平面”构成，因十分简洁而被大量应用于手持和车载业余通信。但是，这种天线的工作有效性往往不如理论预计的那么完美，特别是在波长较长的波段。造成这种情况的原因及改善方法是：", "options": ["缺乏有效接地镜像；GP天线必须有足够大的导电平面以形成振子镜像，否则谐振频率和阻抗都与理论值有出入。为此，应尽量用大面积金属导体与天线/馈线的接地端相连", "1/4波长垂直振子显然是太短了。改成1/2波长即可解决问题", "1/4波长垂直振子显然是太短了。在振子当中串联加感线圈即可解决问题", "天线与电缆直接相连，匹配不佳。在天线和电缆之间加接“巴伦”即可解决问题"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0664", "q": "关于天线的加载，以下描述正确的是", "options": ["为天线振子串联电感线圈，延长振子的电气长度", "为车载天线增添弹簧减震器", "为柔性不足的天线基座增加螺旋式延长器", "为八木天线的拉纤加接弹性张力器"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0665", "q": "谐振的垂直接地天线的振子长度最短也要1/4波长。如果架设天线时因条件受限而不得不将振子缩短，那么在振子之中串入电感可以补偿失去的感抗，使天线谐振在所需频率上。为了提高发射效率，应在振子的什么位置串入电感需根据架设条件择优确定。下图给出三种加感方案。假设振子（灰色部分）均等长，则A、B、C三种方案按发射效率可排列为：", "options": ["C-顶部加感，B-中部加感，A-底部加感", "A-底部加感，B-中部加感，C-顶部加感", "A-底部加感，C-顶部加感，B-中部加感", "B-中部加感，A-底部加感，C-顶部加感[F]LK0944.jpg"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0666", "q": "甲天线增益6.15dBi，乙天线增益1dBd。若两副天线按同样条件架设并用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：", "options": ["甲天线的信号功率为乙天线的两倍", "甲天线的信号功率为乙天线的1/2", "甲天线的信号功率为乙天线的5.15倍", "甲天线的信号功率为乙天线的6.15倍"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0667", "q": "甲天线增益0dBd，乙天线增益2dBi。若两副天线按同样条件架设用用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：", "options": ["甲天线的效果与半波长偶极天线相当，乙天线比甲天线略差", "甲天线效果为零，不能工作，乙天线效果比甲天线好2倍", "甲天线的效果与半波长偶极天线相当，乙天线发射的信号强度比甲天线好2dB", "甲、乙天线的效果实际相同"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0668", "q": "有两款VHF垂直全向天线作发射之用。甲天线增益为4.5dBd，而乙天线的是5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？", "options": ["来自甲天线的信号比乙天线的强0.8dB", "来自乙天线的信号比甲天线的强1.35dB", "来自甲天线的信号比乙天线的强1.35dB", "来自乙天线的信号比甲天线的强3.5dB"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0669", "q": "有两款VHF垂直全向天线作发射之用。甲天线增益为2.9dBd，而乙天线的是5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？", "options": ["来自乙天线的信号比甲天线的强0.8dB", "来自乙天线的信号比甲天线的强2.95dB", "来自甲天线的信号比乙天线的强2.95dB", "来自乙天线的信号比甲天线的强7.1dB"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0671", "q": "通联时，如果收发信机的SWR表显示读数4:1，则意味着：", "options": ["从发射机的输出端口来看，天线系统的整体匹配情况不佳", "从发射机的输出端口来看，天线系统的整体阻抗为200欧或12.5欧", "天线系统的辐射效率仅为25%", "天线系统的整体增益仅为4dB"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0673", "q": "多数发射机都在SWR超过一定值时降低输出功率。这是为了：", "options": ["保护发射机中的功率半导体器件", "防止烧断供电线路中的保险丝", "防止传输线上的驻波超过限值", "防止发射出去的无线电波带有过大的驻波"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0674", "q": "用同轴电缆连接天线时，为什么驻波比趋于1:1为好？", "options": ["降低电缆的损耗，使射频能量更有效地传输", "防止屏蔽层的外层辐射能量，导致射频干扰（RFI）", "延长天线的使用寿命", "延长发信机的使用寿命"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0675", "q": "以下哪种情况可能导致业余发信机显示的驻波比不稳定？", "options": ["发信机、馈线或天线某处接触不良", "发信机采用相位调制", "发信机过调制", "馈线温度过高"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0676", "q": "SSB通联时，即使天馈系统没有故障，有时候SWR显示也不稳定。这是因为：", "options": ["SSB话音的幅度变化本质上影响测量的稳定性。改用CW方式进行测量效果更好", "SSB话音包含幅度与相位两种信息，并非所有天线均能同时给出稳定的响应", "出现这种情况是因为发信机过调制，应调整话筒增益以解决", "出现这种情况说明发信机出了故障，应停机检修"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0677", "q": "我们都知道发射机与天线间的馈线应当与天线阻抗匹配。否则，馈线中的驻波会使沿线各处的电压和电流周期性起伏。然而，业余电台所用的发射机与电网中的发电机同属交流电源，我们却从未在连到电网的电线中观察到驻波现象。这是为什么？", "options": ["电网供电的频率很低，导线长度与波长相比微不足道，驻波现象不明显而已", "业余电台所用的馈线和电网中的电线工作原理不同，所以现象不尽相同", "适用于供电技术和业余无线电的电学理论本质不同，所以现象自然不同", "电网的供电能力远超发射机所能提供的电功率，这就迫使线路各处电压趋同"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0678", "q": "对于业余无线电通信，最适合的同轴电缆特性阻抗为：", "options": ["50欧姆", "75欧姆", "93欧姆", "300欧姆"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0679", "q": "传输线具有多种类型，但是为什么架设业余电台通常选用同轴电缆？", "options": ["因为它易于使用，与架设环境之中其他物体间的互耦也很低", "因为它的损耗比其他任何种类的馈线都低", "因为相比其他馈线，它可以传输更大的功率", "因为很明显，它比其他任何馈线都便宜"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0683", "q": "将同轴电缆装于室外时，为什么要求电缆外皮（护套）能够耐受紫外线？", "options": ["如果电缆护套被紫外线破坏，电缆就会受潮损坏", "紫外线会激励非线性导行模式，导致互调和谐波发射", "紫外线会与射频信号相互混频，导致相当复杂的宽带干扰", "紫外线会促使电缆升温，并因此增加电缆的功率损耗"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0684", "q": "相比填充有机介质的同轴电缆，空气介质同轴电缆的劣势是什么？", "options": ["空气介质同轴电缆需要特别措施来防止湿气渗透", "空气介质同轴电缆只能用于30MHz以下业余频段", "空气介质同轴电缆的每百米损耗太大", "空气介质同轴电缆不能在冰点以下工作"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0685", "q": "如果通过同轴电缆的信号频率升高，则同轴电缆的", "options": ["传输损耗增加", "反射功率升高", "特性阻抗变高", "输入驻波比变大"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0686", "q": "以下给出了一些同等外径的馈线。其中哪一种在VHF/UHF频段损耗更低？", "options": ["空气介质同轴硬电缆", "独立屏蔽分组双绞线", "50欧姆同轴软电缆", "75欧姆同轴软电缆"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0687", "q": "对于400MHz或更高频率的信号，应当优先选用的同轴电缆连接器是：", "options": ["N型连接器", "M型连接器", "RS-213型连接器", "DB-23型连接器"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0688", "q": "关于M 型同轴电缆连接器，以下说法正确的是：", "options": ["这种连接器广泛应用于HF和VHF通信系统", "这种连接器使用了先进的螺纹式锁紧技术，防水防盗", "这种连接器使用了卡式锁紧技术，便于快拔快插", "这种连接器制造成本很高，通常用于微波通信系统"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0691", "q": "甲、乙业余电台相距10千米，均使用1/2波长水平偶极天线进行UHF通联。现其中一方改用1/2波长垂直偶极天线，则改变前后的通信效果有什么不同？", "options": ["通信效果变差", "通信效果不变", "通信效果变好", "通信效果的变化不确定"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0692", "q": "甲、乙业余电台相距10千米，分别使用1/2波长水平和垂直偶极天线进行UHF通联。现双方都改用1/ C1-0702", "q": "右旋极化波是指在垂直于传播方向的任意平面上，沿传播方向观察时，电场矢量为随时间向右（顺时针）旋转的椭圆或圆极化波。如果地面上某业余电台在观测业余卫星时发现从卫星到达该台的无线电波的电场是顺时针旋转的，则该信号的极化方式为：", "options": ["左旋椭圆极化或圆极化", "右旋椭圆极化或圆极化", "垂直极化", "水平极化"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0703", "q": "在视距通联中，已知发射天线为指向接收点的左旋圆极化天线，接收天线的最佳极化方式为：", "options": ["指向发射点的左旋圆极化", "指向发射点的右旋圆极化", "垂直极化", "水平极化"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0704", "q": "某卫星下行链路采用右旋圆极化天线，从北向南飞行，天线始终指向地球的南极。如果地面上某业余电台采用圆极化天线自动跟踪该卫星，则该台所用天线的最佳极化方式应当为：", "options": ["卫星过顶前为右旋圆极化，过顶后为左旋圆极化", "卫星过顶后为右旋圆极化，过顶前为左旋圆极化", "最佳方向始终为右旋圆极化", "最佳方向始终为左旋圆极化"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0705", "q": "已知某卫星下行信号的发射天线是指向地面的偶极天线。由于卫星不断旋转，地面台站所收电波的极化方向就会不断变化。为了不至极化问题致使接收中断，接收天线可以是：", "options": ["指向卫星的右旋或左旋圆极化天线", "垂直极化天线", "水平极化天线", "极化方向平行于卫星与地面电台之间连线的天线"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0706", "q": "某业余电台使用半波垂直偶极天线通联时，对方所收信号的强度为S4。现发射功率不变，发信方改用增益为8.15dBi的八木天线（最大辐射方向和极化均不变），则对方所收信号的强度变为：【提示：收信机信号强度指示从S1至S9每档增加6dB】", "options": ["S5", "S6", "S7", "S8"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0707", "q": "某业余电台使用半波长垂直偶极天线发射时，对方所收信号的强度为S4。现发射功率不变，发信方改用增益为12dBd的八木天线（最大辐射方向和极化均不变），则对方所收信号的强度变为：【提示：收信机信号强度指示从S1至S9每档增加6dB】", "options": ["S6", "S5", "S7", "S8"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0708", "q": "两位业余爱好者使用半波长垂直偶极天线相互通联，双方所收信号的强度均为S4。现双方发射功率不变，都改用增益为8.15dBi的八木天线（最大辐射方向和极化均不变）再次联络，则双方信号的强度变为：【提示：收信机信号强度指示S1至S9每档增加6dB】", "options": ["S6", "S4", "S5", "S7"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0709", "q": "即便是在辽阔的平原或广袤的戈壁，我们所收本地VHF/UHF信号的强度也会伴随设备的移动而发生周期性的变化。主要原因是：", "options": ["来自直射和地面反射等多个路径的无线电波相互干涉，相消或相长（多径效应）", "发信和收信地点间的气流导致电波传播路径弯曲，发生频率漂移（多普勒效应）", "无论收信发信，地面各处的电导率不尽相同会导致设备移动时的接地电阻变化", "发信过程中，设备与大地间分布电容的改变导致天线失谐，发射功率随之改变"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0710", "q": "在VHF/UHF频段通联时的一个现象，如果远方电台给出的信号报告很差，则仅需移动几步或将工作频率改变数十千赫就可能显著改善通信效果。这是因为：", "options": ["多径传播。经不同路径达到天线的电波存在相位和幅度差异，相互干涉，相消或相长", "发射机与接收机之间的距离，以及工作频率的变化都会显著改变路径损耗", "大气扰动影响", "地磁活动影响"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0711", "q": "多径传播对UHF或VHF波段数据通信的影响是：", "options": ["可能使误码率上升", "如果是FM通联，则影响微不足道，不可察觉", "随着传播路径的增加，数据通信速率线性减小", "随着传播路径的增加，数据通信速率线性增加"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0713", "q": "决定超短波视距传播距离极限的主要因素是：", "options": ["发射天线和接收天线距地面的相对高度", "发射天线和接收天线距海平面的绝对高度", "发射天线和接收天线的挂高波长比，即，离地高度除以波长", "发射天线和接收天线的增益"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0714", "q": "有时，相隔数百千米的业余电台可以实现VHF/UHF超视距直接联络。可能的原因是：", "options": ["信号的传播路径中出现了大气波导现象", "有飞行器在空中反射了电波", "降雨增加了大地电导率，增强了电波传播", "每当冬季，植被的减少都有利于电波传播"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0715", "q": "有时，我们可以在6米或2米业余波段中收到上千千米外的“超视距传播”信号。这与下列哪种现象密切相关？", "options": ["突发E层的传播", "流星余迹反向散射", "D层的吸收所致", "灰线传播"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0716", "q": "是什么导致了对流层的大气波导现象？", "options": ["大气高空逆温", "太阳黑子和/或太阳耀斑", "飓风或龙卷风所致的上升气流", "雷暴时大量闪电所产生的等离子体"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0717", "q": "如果你收到了一个上千千米外的VHF信号，最可能的原因是：", "options": ["信号经电离层的突发E层反射而来", "信号由微波接力电台合力QSP过来", "信号被附近的雷雨区反射而来", "信号经宇宙射线的电离路径传导过来"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0718", "q": "有时，VHF/UHF业余波段中可能出现远达500千米的“超视距传播”信号。这与下列哪种现象密切相关？", "options": ["对流层散射", "D层折射", "F2层折射", "法拉第旋转"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0719", "q": "由半波长偶极天线和传输线构成的天线系统的理想工作状态应当是：", "options": ["天线上只有驻波，馈线上只有行波", "天线上只有行波，馈线上只有驻波", "天线和馈线上都只有驻波", "天线和馈线上都只有行波"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0720", "q": "天线振子的端点效应、信号的相移等因素影响电磁波沿振子传播的速度。修整天线时，我们应考虑振子的实际长度会因此略短于计算值。这就是所谓的“缩短系数”。其经验值为：", "options": ["0.95", "1.05", "0.707", "1.414"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0721", "q": "制作工作频率为f（单位：兆赫）的半波长偶极天线。每边振子的长度（单位：米）约为：", "options": ["71.3/f", "48.8/f", "142.6/f", "150/f"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0722", "q": "电波在介质中的传播速度低于光速，其与光速的比值称为“速度因子”，是介电常数平方根的倒数。聚乙烯介质同轴电缆我们最为常用。其速度因子约为：", "options": ["0.65", "1.54", "1.95", "1.0006"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0723", "q": "制作工作频率为f（单位：兆赫兹）的某相控天线阵列需要长度为1/4波长的同轴电缆，大致长度（单位：米）应当为：", "options": ["48.8/f", "149.8/f", "75/f", "71.3/f"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0724", "q": "如需偶极天线谐振于工作频率之时具有低输入阻抗，振子的总长度可以是：", "options": ["1/2波长的奇数倍", "1/2波长的整数倍", "1/2波长的偶数倍", "1/4波长的奇数倍"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0725", "q": "偶极天线谐振于所需工作频率的充分和必要条件是：", "options": ["两臂总电气长度为1/2工作波长的整数倍", "两臂总电气长度为1/4工作波长的整数倍", "两臂总电气长度为1/2工作波长的奇数倍", "两臂总电气长度为工作波长的整数倍"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0726", "q": "下列哪种谐振偶极天线在垂直于振子的方向上具有峰值增益：", "options": ["振子长度为1/2工作波长", "振子长度为1/8个工作波长", "振子长度为1/4工作波长", "振子长度为3/2工作波长"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0727", "q": "提高偶极天线谐振频率的方法是：", "options": ["将振子截短一些", "在振子某处串联线圈", "将振子加长一些", "为振子添加“X”形电容帽"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0728", "q": "在天线和馈线之间常会接入一个俗称“巴伦（BALUN）”的部件。“巴伦”的由来是：", "options": ["平衡与不平衡两个英文字头的组合", "发明平衡-不平衡转换器的人的名字", "著名天线阻抗匹配理论家的名字", "大牌宽带匹配网络的制造商名字"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0729", "q": "在天线和馈线之间常会接入一个俗称“巴伦（BALUN）”的部件。它的主要功能是：", "options": ["在平衡电路和不平衡电路之间传递射频能量，阻断两者之间的任何寄生耦合", "实现天线和馈线之间的自动阻抗匹配", "展宽天线的工作频带", "降低天线的驻波比"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0730", "q": "一副两臂电气长度各为1/4波长的偶极天线，断开中点，通过巴伦馈电，测得谐振频率为f，输入阻抗为Z。如果总长不变，但是将断开的馈电点向一侧偏移1/8波长，则天线特性的最明显变化是：", "options": ["阻抗Z显著变大，相比之下谐振频率f变化不大", "阻抗Z显著变小，相比之下谐振频率f变化不大", "谐振频率f显著升高，相比之下阻抗Z变化不大", "谐振频率f显著下降，相比之下阻抗Z变化不大"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0731", "q": "南北走向的水平极化偶极天线，中点馈电，通过特性阻抗为50欧的电缆连接到输入/输出阻抗为50欧的收发信机，通信对象在东西方向。选择天线长度的原则是：", "options": ["当振子两臂各为四分之一波长时，通信效果是最好的", "当振子两臂各为二分之一波长时，通信效果是最好的", "当振子两臂各为四分之三波长时，通信效果是最好的", "驻波比接近1:1时通信效果才会最好，无关振子长度"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0732", "q": "短波水平偶极类天线（含八木天线等）的发射仰角主要由下列因素决定：", "options": ["由天线的辐射和大地的反射叠加而成。天线距地面的高度与波长的比值影响仰角", "由天线振子导体所指的方向决定", "由八木天线主梁所指的方向决定", "由天线振子的长度所决定"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0733", "q": "架设短波天线时，应大致按照如下原则选择天线的发射仰角：", "options": ["远距离通信选择低发射仰角，近距离通信选择高发射仰角", "近距离通信选择低发射仰角，远距离通信选择高发射仰角", "近处开阔时选择低发射仰角，近处有建筑物时选择高发射仰角", "较低频率通信选择低发射仰角，较高频率通信选择高发射仰角"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0734", "q": "架设短波天线时，应大致按照如下原则规划天线的架设高度：", "options": ["远距离通信选择较高的高度，近距离通信选择较低的高度", "远距离通信选择较低的高度，近距离通信选择较高的高度", "近处有建筑物时选择较低的高度，近处开阔时选择较高的高度", "较低频率通信选择较高的高度，较高频率通信选择较低的高度"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0734"}, {"id": "MC1-0735", "q": "在针对特定对象的DX通信中，计算天线最佳发射仰角的基本方法是：", "options": ["根据所使用电离层的大致高度、通信对象的大致距离、电波在传播中经历电离层反射的次数，用简单几何方法计算", "根据通信对象所在的方位、地球半径、对方天线的高度、实际工作频率、太阳平均黑子数，查表计算", "根据通信对象所在的方位、通信方向上障碍物所遮挡的仰角、本台周围的大地电导率、实际工作频率，找公式计算", "根据通信双方的发射功率、天线极化、通信方向上障碍物所遮挡的仰角、太阳10.7cm 射电通量，找公式计算"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0735"}, {"id": "MC1-0736", "q": "收发信天线周边大地电导率对HF远距离通信的影响大致为：", "options": ["大地电导率越高，大地的镜像作用越理想，天线的效果越好", "大地电导率越低，大地中的感生电流越弱，天线的效果越好", "HF远距离通信依靠天波反射，与大地电导率无关", "大地电导率太高、太低都不好，最好是处于中间值"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0736"}, {"id": "MC1-0737", "q": "如果将水平偶极天线的架高降低到距地面 1/10 波长处，其馈电点阻抗有什么变化？", "options": ["下降", "上升", "电抗分量消失", "电阻分量消失"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0738", "q": "在导电良好的地面上，影响短波天线辐射仰角的主要因素是：", "options": ["天线距地面的高度与波长之比", "天线的绝对高度，与波长无关", "天线离海平面的绝对高度", "天线振子或者八木天线主梁与地面之间的夹角"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0739", "q": "自己架设HF偶极天线时，如果因空间限制而无法将振子展开到在工作频率下自然谐振所需的长度，则可将电感线圈串入振子某处或干脆将整个振子都做成线圈以制成某种“加感天线”并通过调整电感量来获取所需谐振频率。关于这种天线，以下描述正确的是：", "options": ["通过迭代修整线圈的电感量及其串入振子的位置，我们肯定可以获得与某个全尺寸天线等效的谐振频率和馈电点阻抗。但是，这种加感天线的辐射效率比全尺寸天线低", "无论是谐振频率、阻抗特性还是辐射效率，这种加感天线都不能媲美全尺寸天线", "只要设计得当，制作精心，调试得法，这种加感天线的效果与全尺寸天线一样好", "如果设计得当、制作精心、调试得法，这种加感天线的效果可以超越全尺寸天线"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0740", "q": "下图所示是我国业余无线电爱好者开展野外通信活动常用的14/21/29MHz三频段偶极天线。图中天线各段的电气长度应分别为：", "options": ["A为28MHz的1/4波长，A+B为21MHz的1/4波长，A+B+C为14MHz的1/4波长", "A为28MHz的半波长，A+B为21MHz的半波长，A+B+C为14MHz的半波长", "A为28MHz的1/4波长，B为21MHz的1/4波长，C为14MHz的1/4波长", "A为28MHz的半波长，B为21MHz的半波长，C为14MHz的半波长[F]LK0941.jpg"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0740"}, {"id": "MC1-0741", "q": "下图所示是我国业余无线电爱好者开展野外通信活动常用的14/21/29MHz三频段偶极天线。图中部件A、B、C、D的作用分别为：", "options": ["A、D为21MHz陷波器，B、C为28MHz陷波器，即，分别谐振于21MHz和28MHz的并联谐振回路", "A、D为21MHz陷波器，B、C为28MHz陷波器，即，分别谐振于21MHz和28MHz的串联谐振回路", "A、D为14MHz陷波器，B、C为21MHz陷波器，即，分别谐振于14MHz和21MHz的并联谐振回路", "A、D为14MHz陷波器，B、C为21MHz陷波器，即，分别谐振于14MHz和21MHz的串联谐振回路[F]LK0942.jpg"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0741"}, {"id": "MC1-0742", "q": "谐振偶极天线的振子长度最短也要半个波长。如果架设天线时因条件受限而不得不将振子缩短，那么在振子之中串入电感可以补偿失去的感抗，使天线谐振在所需频率下。为了提高发射效率，应在振子的什么位置串入电感需根据架设条件择优确定。下图给出三种加感方案。假设振子（灰色部分）均等长，则A、B、C三种方案按发射效率可排列为：", "options": ["C-顶部加感，B-中部加感，A-底部加感", "A-底部加感，B-中部加感，C-顶部加感", "A-底部加感，C-顶部加感，B-中部加感", "B-中部加感，A-底部加感，C-顶部加感[F]LK0943.jpg"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0742"}, {"id": "MC1-0743", "q": "对于需要频繁改换频段的业余无线电业务，爱好者们有时会将所用频段的偶极振子并联起来一同馈电，构成一种用一根电缆即可操作的多频段天线。下图给出了一副由7、14和28MHz半波长振子构成的多频段天线实例。关于其工作原理，以下分析正确的是：", "options": ["7MHz振子以3/2波长方式工作于21MHz，该天线由此工作在7、14、21和28MHz四个频段。由于不谐振的振子呈现高阻抗，所以并联后的总阻抗仍为50欧左右", "该天线工作于7、14和28MHz。由于不谐振的振子呈现高阻抗，所以并联后的总阻抗仍为50欧左右", "7MHz振子以3/2波长方式工作于21MHz，该天线由此工作在7、14、21和28MHz四个频段。由于每个振子的阻抗都在50欧上下，所以并联后的总阻抗降至17欧左右", "该天线工作于7、14和28MHz。由于每个振子的阻抗都在50欧上下，所以并联后的总阻抗降至17欧左右[F]LK0945.jpg"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0743"}, {"id": "MC1-0744", "q": "什么是八木天线？", "options": ["一种通过反射器和引向器来增强方向性的半波长偶极天线", "任何一种可以汇聚无线电波的方向性天线的统称", "八木秀次博士发明的一种全向天线", "一种具有八根水平振子的中心馈电天线，也叫Octopus"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0744"}, {"id": "MC1-0745", "q": "八木天线是在普通偶极天线（主振子）的基础上通过添加引向器和反射器而制成的一种定向天线。目视确定全尺寸八木天线发射方向的方法是：", "options": ["比主振子短者为引向器，比主振子长者为反射器，引向器朝向最大辐射方向", "比主振子长者为引向器，比主振子短者为反射器，引向器朝向最大辐射方向", "比主振子短者为引向器，比主振子长者为反射器，反射器朝向最大辐射方向", "主振子的轴向为最大辐射方向"], "ans": [0], "classes": ["B", "C"], "img": "MC1-0745"}, {"id": "MC1-0746", "q": "八木天线的“前后比”是如何定义的？", "options": ["主瓣辐射功率与反向辐射功率之比", "前向增益与理想点源天线增益之比", "导向器与反射器的数量之比", "导向器与驱动器的数量之比"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0747", "q": "行波天线依靠射频电流在长导线组成的连续匹配回路中行进而产生辐射。业余通信常用的行波天线有T2FD和贝伐列奇（Beverage）。与驻波天线相比，行波天线的特点是：", "options": ["没有自然谐振点；对长度要求不严格但通常需接近或大于一个波长", "对制作尺寸要求严格；没有自然谐振点", "在较宽频带内具有一系列自然谐振点；对长度要求严格", "可以依靠天线调谐器实现较宽频带内的匹配；对长度没有严格要求"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0748", "q": "业余无线电通信中常用的行波天线，如T2FD和贝伐列奇（Beverage），其天线终端都接有无感电阻。关于该电阻的作用，正确说法是：", "options": ["天线的电长度达到数个波长时，大部分能量都是边行进边辐射到空间，只有一小部分进入终端电阻耗散掉，以避免因反射而引起驻波", "该电阻相当于假负载。尽管这实现了宽带操作，却耗散了大部分能量", "无论天线有多长，输入功率的一半都会耗散在电阻上。这导致发射效率仅为50%", "考虑大部分行波天线都是谐振天线，则串联电阻可以有效降低天线的有载Q值。这使天线的频率响应展宽，但是发射效率也因此降低"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0749", "q": "小明在一条20米长的导线中点连接一个线圈，并将导线水平提升至稍高于20米的悬挂位置。线圈的另一端接有另一条长度为20米并垂向地面的导线。他将馈线的芯线与垂直导线相连，将馈线的屏蔽层连至地网。这种看似“T”形的天线，极化方式如何？", "options": ["垂直", "水平", "垂直与水平分量各半", "正上方波束是旋转极化的"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0750", "q": "为了降低辐射仰角，小明试着将T2FD天线的半边振子直立悬挂起来。他将折合振子的馈电端通过匹配变压器连至电缆的芯线，将带有吸收电阻的另一端与地网和电缆的屏蔽层相连。这种天线的极化方式为：", "options": ["垂直", "水平", "右旋圆极化", "左旋圆极化"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0751", "q": "关于环形天线，以下说法正确的是：", "options": ["该天线发射的电磁波，磁场分量垂直于环所在的平面", "自然谐振的环形天线，半径刚好等于1/4波长", "这种天线的辐射角很高，仅适合低频段近距离通联", "在环中串入可变电容可显著抵消感抗，拓展工作带宽"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0754", "q": "收发信机内置的或与收发信机相连的天线调谐器（俗称“天调”）有什么作用？", "options": ["将天馈系统的输入阻抗变换为发射机所需的负载阻抗", "通过实现共轭匹配，整体提升天馈系统的工作效率", "允许某个天线在用作发射天线或接收天线时都谐振", "可根据发射机的当前工作频段自动切换适合的天线"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0755", "q": "关于天线调谐器（俗称“天调”）可以改善通联效果的说法，以下描述正确的是：", "options": ["天调可以补偿失配天线系统的参数，使发射机输出规定的射频功率", "天调可以实现天线系统的整体谐振，使天线振子的辐射效率大幅提升", "天调对失配天线系统的补偿消除了系统内的驻波，传输损耗随之降低", "天调是将失配天线所反射的能量化热耗散了。通联效果其实更差了"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0756", "q": "某天线通过50欧馈线与50欧输出阻抗的收发信机相连。现计划在天线电路中串入天线调谐器和通过式驻波功率计来补偿并监测天线的失配情况。理论上的最佳连接顺序为：", "options": ["天线-天线调谐器-驻波功率计-馈线-收发信机", "天线-馈线-天线调谐器-驻波功率计-收发信机", "天线-天线调谐器-馈线-驻波功率计-收发信机", "天线-驻波功率计-天线调谐器-馈线-收发信机"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0757", "q": "塔上某天线通过50欧馈线连至50欧输出阻抗的收发信机。现需要在天线电路中串入天线调谐器ATU和通过式驻波功率计M对天线的匹配情况进行补偿和监测。有四种方案可选：1：ATU和M都在塔顶；2：ATU和M都在塔底；3：ATU在塔底，M在机房；4：ATU和M都在机房。ATU完成调谐时，若按天线系统整体效率从高到低为序，各方案可排列为：", "options": ["方案1最好，方案2、3其次，方案4最差", "方案4最好，方案2、3其次，方案1最差", "方案3最好，方案4其次，方案2再其次，方案1最差", "方案2最好，方案1其次，方案4再其次，方案3最差[F]LK0938.jpg"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0758", "q": "《中华人民共和国无线电频率划分规定》脚注5.67A说“使用135.7-137.8kHz频段内频率的业余业务台站，其最大有效辐射功率不得超过1瓦（e.i.r.p.）”。其意思为，该频段的业余电台：", "options": ["实际馈送到发射天线的功率不得超过1瓦除以天线的绝对增益比值Gi后得到的功率值", "发射机标称输出功率不得超过1瓦", "扣除馈线损耗后实际馈送到发射天线的功率不得超过1瓦", "扣除馈线和天线的总损耗后天线实际辐射的功率最大不得超过1瓦"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0759", "q": "已知某天线的增益为3.85dBd，馈入的功率为10W，其等效全向辐射功率（e.i.r.p）为：", "options": ["40W", "13.85W", "38.5W", "100W"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0760", "q": "已知某天线的增益为5.15dBi，馈入的功率为10W，其有效辐射功率（e.r.p）为：", "options": ["20W", "51.5W", "10W", "15.15W"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0763", "q": "一根特性阻抗为50欧的同轴电缆的末端接有一个50欧姆负载电阻。如果用天线阻抗分析仪测量该电缆始端在不同频率下的阻抗，则读数为：", "options": ["读数为电缆的特性阻抗50欧。该值与电缆的长度和工作频率均无关", "在电缆末端连接任何大小的电阻，在其始端都能测得相同的阻值。当前为50欧", "读数取决于电缆的电长度：1/4波长奇数倍时接近无穷大；1/4波长偶数倍时接近零", "读数取决于电缆的电长度：1/4波长偶数倍时接近无穷大；1/4波长奇数倍时接近零"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0764", "q": "一根特性阻抗为50欧的同轴电缆的末端开路。如果用天线阻抗分析仪测量该电缆始端在不同频率下的阻抗，则读数为：", "options": ["读数取决于电缆的电长度：1/4波长偶数倍时接近无穷大；1/4波长奇数倍时接近零", "读数取决于电缆的电长度：1/4波长奇数倍时接近无穷大；1/4波长偶数倍时接近零", "在电缆末端连接任何大小的电阻，在电缆始端都能测得相同的阻值。当前为无穷大", "读数为电缆的特性阻抗50欧。该值与电缆的长度和工作频率均无关"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0765", "q": "一根特性阻抗为50欧的同轴电缆的末端短路。如果用天线阻抗分析仪测量该电缆始端在不同频率下的阻抗，则读数为：", "options": ["读数取决于电缆的电长度：1/4波长奇数倍时接近无穷大；1/4波长偶数倍时接近零", "读数取决于电缆的电长度：1/4波长偶数倍时接近无穷大；1/4波长奇数倍时接近零", "在电缆末端连接任何大小的电阻，在电缆始端都能测得相同的阻值。当前为0", "读数为电缆的特性阻抗50欧。该值与电缆的长度和工作频率均无关"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0766", "q": "在用天线阻抗分析仪测量某天线失配情况下的阻抗表现时，我们会发现仪表的读数随天线和仪表间电缆跳线的长度而变。为保证测量的准确性，可以采取如下措施：", "options": ["使用电气长度正好等于测量波长的连接电缆", "换用接触面镀金的高档电缆接头", "用高档纯银音响线材代替普通铜质同轴电缆", "将电缆外皮妥善接地，并将仪表放入屏蔽室"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0768", "q": "电磁波（electromagnetic waves）的两个组成部分是：", "options": ["电场和磁场", "电压和电流", "阻抗和功率", "电离辐射和非电离辐射（ionizing radiation and non-ionizing radiation）"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0769", "q": "无线电波在真空中的传播速度有多快？", "options": ["和光速相同，大约为300,000,000米/秒", "与音速相同，从300米/秒至数十千米/秒不等", "无法确定，与介质的特性有关", "无法确定，与电波的频率有关"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0770", "q": "电磁波在真空中传播时，其各个周期的传播距离都是相等的。该距离叫做：", "options": ["波长", "波形", "波速", "波束"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0771", "q": "如果已知无线电波的频率，则其波长为：", "options": ["使用300除以频率的兆赫数（MHz）可以得到以米为单位的波长", "将频率的赫兹数（Hz）除以300可以得到以米为单位的波长", "将频率的兆赫数（MHz）除以300可以得到以米为单位的波长", "将频率的赫兹数（Hz）乘以300可以得到以米为单位的波长"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0773", "q": "自由空间中的无线电波随传播距离的增加而逐渐减弱。其减弱程度遵循什么规律？", "options": ["与距离的平方成正比，与频率的平方成正比", "与距离的平方成正比，与频率的平方成反比", "与距离成正比，与频率的平方成正比", "与距离的平方成正比，但是与频率无关"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0775", "q": "自由空间中甲乙两电台相距100km，均使用增益为0dBi的天线工作于145MHz。如果发射方的功率为1W，则接收方可获得约-115.6dBm的信号功率。现将两电台的距离增至500km，则接收方的信号功率变为：【提示：自由空间中无线电波的路径损耗L =32.4 + 20log(d) +20log(f)；其中，d为发射方与接收方之间的距离（km），f为工作频率（MHz）】", "options": ["-129.6dBm", "-121.6dBm", "-125.1dBm", "-135.6dBm"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0776", "q": "自由空间中甲乙两电台相距100km，均使用增益为0dBi的天线工作于145MHz。如果发射方的功率为1W，则接收方可获得约-115.6dBm的信号功率。现将两电台的距离增至1000km，则接收方的信号功率变为：【提示：自由空间中无线电波的路径损耗L =32.4 + 20log(d) +20log(f)；其中，d为发射方与接收方之间的距离（km），f为工作频率（MHz）】", "options": ["-135.6dBm", "-129.6dBm", "-121.6dBm", "-125.1dBm"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0777", "q": "自由空间中甲乙两电台相距100km，均使用增益为0dBi的天线工作于145MHz。如果发射方的功率为1W，则接收方可获得约-115.6dBm的信号功率。现发射方将频率变为435MHz，则接收方的信号功率变为：【提示：自由空间中无线电波的路径损耗L =32.4 + 20log(d) +20log(f)；其中，d为发射方与接收方之间的距离（km），f为工作频率（MHz）】", "options": ["-125.1dBm", "-135.6dBm", "-129.6dBm", "-121.6dBm"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0778", "q": "自由空间中甲乙两电台相距100km，均使用增益为0dBi的天线工作于145MHz。如果发射方的功率为1W，则接收方可获得约-115.6dBm的信号功率。现发射方将功率降低为0.25W，则接收方的信号功率变为：【提示：自由空间中无线电波的路径损耗L =32.4 + 20log(d) +20log(f)；其中，d为发射方与接收方之间的距离（km），f为工作频率（MHz）】", "options": ["-121.6dBm", "-125.1dBm", "-135.6dBm", "-129.6dBm"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0779", "q": "自由空间中的甲电台在145MHz联络相距100km的乙电台并获得信号报告S8。如果两电台的距离增至500km，则信号报告变为：【提示：收信机信号强度指示从S1至S9每级增加6dB】", "options": ["略低于S6", "略高于S6", "略低于S5", "略高于S4"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0780", "q": "自由空间中的甲电台在145MHz联络相距100km的乙电台并获得信号报告S8。如果两电台的距离增至1000km，则信号报告变为：【提示：收信机信号强度指示从S1至S9每级增加6dB】", "options": ["略低于S5", "略高于S5", "略高于S6", "S7"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0781", "q": "自由空间中的甲电台在145MHz联络相距100km的乙电台并获得信号报告S8。如果双方改用频率435MHz，则信号报告变为：【提示：收信机信号强度指示从S1至S9每级增加6dB】", "options": ["略高于S6", "略低于S5", "略低于S6", "S7"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0782", "q": "自由空间中的甲电台在145MHz联络相距100km的乙电台并获得信号报告S8。如果甲电台将发射功率减少到原来的1/4，则信号报告变为：【提示：收信机信号强度指示从S1至S9每级增加6dB】", "options": ["S7", "略高于S5", "略高于S6", "略低于S5"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0783", "q": "某业余电台以100瓦发射功率工作时，对方报告信号强度S8。现该台将发射功率降至25瓦，则对方给出的信号报告应为：【提示：收信机信号强度指示S1至S9每级增加6dB】", "options": ["S7", "S6", "S5", "S4"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0784", "q": "某业余电台以80瓦发射功率工作时，对方报告信号强度S8。现该台将发射功率降至5瓦进行QRP实验，则对方给出的信号报告应为：【提示：收信机信号强度指示S1至S9每级增加6dB】", "options": ["S6", "S7", "S4", "S2"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0786", "q": "在电磁场理论中，“强度与距辐射源的距离的平方成反比”的说法适用于：", "options": ["相距辐射源10倍及以上波长的“远区场”", "相距辐射源一定距离内的“远区场”", "辐射源周围空间中的任意点", "LF至UHF的频率范围"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0787", "q": "有时，我们需要在空旷场地用场强计测量比较不同型号的全向垂直天线零仰角情况下的实际辐射效果。不过，测量时应注意什么问题？", "options": ["测试地点应选在远场区，离天线10个波长以上", "场强计外壳应妥善接地", "场强计应与地面平行", "在馈线的外面穿套多个磁环以形成“连珠巴伦”"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0788", "q": "业余条件下测试天线增益的典型方法如下图所示。用场强表或接收机接收设置在远处同一地点，最大辐射方向朝向自己的半波偶极天线（上）和待测天线（下）的信号。调整送至两副天线的射频功率Po和P，使收到的场强相同。则，待测天线的增益dBd值为：", "options": ["10 log(Po/P)", "10 log(P/Po)", "P - Po", "10 log(P-Po)[F]LK0927.jpg"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0789", "q": "业余条件下测试天线增益的典型方法如下图所示。用场强表或接收机接收设置在远处同一地点，最大辐射方向朝向自己的半波偶极天线（上）和待测天线（下）的信号。调整送至两副天线的射频功率Po和P，使收到的场强相同。则，待测天线的增益dBi值为：", "options": ["10 log(Po/P) + 2.15", "10 log(P/Po) + 2.15", "20 log(P/Po) + 2.15", "10 log(P-Po) + 2.15[F]LK0928.jpg"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0790", "q": "若按传播形式分类，无线电波大体分为：", "options": ["地面波、天波、空间波、散射波", "长波、中波、短波、超短波、微波", "调幅波、调频波、调相波", "正弦波、方波、三角波"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0791", "q": "顾名思义，地面波就是沿地面传播的无线电波，其衰减特性取决于：", "options": ["电波频率、大地电导率和传播距离", "电波频率、太阳活动和地磁活动情况", "电波频率、发射功率和天线增益", "天线高度、发射功率和调制方式"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0792", "q": "大气层的哪一组成部分使得无线电波在世界范围内传播？", "options": ["电离层", "对流层", "平流层", "磁层"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0793", "q": "HF通信术语“静寂区”和“越距”是指：", "options": ["“静寂区”是指天波、地波和空间波都未能覆盖的区域。在此区域中我们说传播“越距”了", "“静寂区”是指超出视距，导致空间波传播不到的区域。在此区域中我们说传播“越距”了", "“静寂区”是指因障碍物遮挡，空间波无法覆盖的区域。在此区域中我们说传播“越距”了", "“静寂区”是指短波通信卫星下行信号无法覆盖的区域。在此区域中我们说传播“越距”了"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0794", "q": "“衰减”和“衰落”都是无线电通信领域中的常见名词。它们的含义分别为：", "options": ["衰减是指信号通过信道或电路后功率减少；衰落是指信号通过信道或电路后发生幅度随时间而变的起伏", "衰减是指信号通过信道或电路后发生幅度随时间而变的起伏；衰落是指信号通过信道或电路后功率减少", "衰减和衰落是一回事，都是指信号通过信道或电路后功率减少", "衰减和衰落是一回事，都是指信号通过信道或电路后发生幅度随时间而变的起伏"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0796", "q": "用SDR接收机的频谱显示器观察短波RTTY等2FSK调制的数据通信信号，我们应当看到两个幅度相等的谱峰。但是实际观察结果是这两个谱峰的高度在随机变化。造成这种现象的原因是：", "options": ["电离层的选择性衰落", "接收机的工作点漂移", "发射机的ALC不稳定", "接收机的AGC不稳定"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0797", "q": "假设接收和发射天线均使用半波长偶极天线，则在依靠电离层反射的远距离通联中，接收和发射天线的最佳极化方式应当安排为：", "options": ["不确定。天波反射的特点是信号强度、频率成分和极化会随机改变", "接收和发射天线均位于垂直于两台站连线的平面内，极化保持一致", "接收和发射天线均位于垂直于两台站连线的平面内，极化彼此正交", "发射天线垂直极化，接收天线的极化应当平行于两台站之间的连线"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0798", "q": "甲、乙业余电台相距2000千米，均使用1/2波长水平偶极天线进行HF通联。现其中一方改用1/2波长垂直偶极天线，则改变前后的通信效果有什么不同？", "options": ["通信效果的变化不确定，取决于天波反射过程中电波极化的随机变化", "通信效果变差", "通信效果变好", "通信效果不变"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0801", "q": "若已知最高可用频率（MUF）为20MHz，则DX通联成功率最高的业余频段为：", "options": ["18MHz", "14MHz", "21MHz", "24MHz"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0802", "q": "如果按距离地表的高度从高到低排列，对短波传播有主要影响的电离层有：", "options": ["F2、F1、E、D", "C1、C2、D1、D2", "F、E2、E1、D", "E1、E2、F1、F2"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0803", "q": "如果按离子密度从高到低排列，对短波传播有主要影响的电离层有：", "options": ["F2、F1、E、D", "C1、C2、D1、D2", "F、E2、E1、D", "E1、E2、F1、F2"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0805", "q": "讨论1.9MHz或3.5MHz等短波低频段DX通信时，业余无线电爱好者常会谈及术语“灰线”。这是指：", "options": ["地球上白昼与黑夜交汇的区域", "地球上有极光活动的区域", "连接地球上具有相同最高可用频率的地点形成的线", "地球上通讯双方所在地点的大圆连线"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0806", "q": "业余无线电爱好者经常利用“灰线”来建立1.9MH或3.5MHz等短波低频段DX联络。这是因为：", "options": ["通信双方同时位于灰线时，最有可能利用天波的多跳反射路径建立联络", "通信双方位于灰线两侧4000千米以外的对称点时，传播效果最佳", "通信双方位于灰线同一侧4000千米以外的两点时，传播效果最佳", "通信双方应避免同时处于灰线才能获得更稳定的传播"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0807", "q": "如果你尝试用“长路径”联络某个业余电台，你的定向天线应当指向：", "options": ["该台短路径方向的反方向", "垂直于灰线，但是背向灰线", "可能出现北极光的方向", "可能出现南极光的方向"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0809", "q": "尝试进行传播预测时，太阳通量的最低值可以取为50左右。其最高值可以取为：", "options": ["300", "280", "250", "200"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0810", "q": "反映地磁活动程度的常见指标是A指数和K指数。K指数的取值范围是：", "options": ["0-9", "0-8", "0-7", "0-6"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0811", "q": "太阳黑子活动的平均周期约为：", "options": ["11.2年，每个周期中的太阳活跃程度有所差别", "11.2年，每个周期中的太阳活跃程度完全相同", "38年，每个周期中的太阳活跃程度有所差别", "38年，每个周期中的太阳活跃程度完全相同"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0812", "q": "太阳黑子活动的强弱是用“太阳黑子平均数（SSN）”来描述的。其一般规律为：", "options": ["较大的SSN利于短波DX通信", "较小的SSN利于短波DX通信", "在地磁活动剧烈的年份，SSN与短波DX通信关系不大", "只在发生太阳耀斑时，SSN才影响短波DX通信"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0813", "q": "太阳耀斑可以引发电离层扰动（SID）。其对短波通信的影响是：", "options": ["低频率通信所受的影响超过高频率的", "高纬度地区传播路径所受的影响超过低纬度的", "卫星通信所受的影响超过地面台站间直射波的", "地球上黑夜区域所受的影响超过白昼区域的"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0814", "q": "业余无线电爱好者在预测HF传播时经常用到一个缩写为F107的参数。其意义是：", "options": ["太阳10.7cm波长射电辐射通量指数", "107MHz调频广播信号的典型传播距离", "电离层对10.7MHz电波的衰减指数", "最高可用频率与10.7MHz的比值"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0815", "q": "业余无线电爱好者在预测HF传播时经常使用缩写为F107的参数，其值大体都在50-300的范围内。如果该数值增大，则：", "options": ["安静太阳的辐射强度增加，电离层密度变大。这些都有利于F层反射DX信号", "10.7MHz无线电波受到电离层的衰减变大，远距离传播的条件变差", "107MHz调频广播可能超视距传播，收到50-300千米VHF信号的几率将增加", "安静太阳的辐射强度增加，电离层密度变大。这些不利于DX信号的传播"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0816", "q": "我国《无线电频率划分规定》指出，122.25-123GHz业余频段用于业余业务，但是不包括卫星业余业务。这是因为：", "options": ["60、120、183GHz左右存在大气吸收频带，电波衰减大，不适合地面至空间的卫星业余通信", "120GHz附近频段的宇宙射线特别强烈，干扰卫星通信，包括卫星间的各种业务", "业余无线电爱好者尚无力制作工作于120GHz及以上频段的设备", "120GHz这类频段的天线太大，不适合业余性质的卫星通信研究"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0817", "q": "以下频段受降雨影响最为严重的是：", "options": ["极高频EHF（毫米波）", "高频HF（短波）", "低频LF（长波）", "特高频UHF（分米波）"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0818", "q": "根据ITU的建议，植被在一定程度上吸收无线电波。大体规律是：", "options": ["频率越高，吸收越多", "频率越低，吸收越多", "吸收程度与植物种类有关，与频率无关", "吸收程度与季节有关，与频率无关"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-0819", "q": "自制业余无线电发射设备，在经无线电检测机构检验合格并取得电台执照之前，应在调测时在设备的天线端口连接（或在串联必要的仪表之后连接）：", "options": ["假负载", "VSWR严格等于1:1的驻波天线", "VSWR严格等于1:1的行波天线", "专门用于测试的标准环形天线"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0820", "q": "在无线电发射机中，调制器的作用是：", "options": ["以原始调制信号控制射频载波的幅度、频率和相位参数", "以电能转换效率最高的方式控制线性射频放大器的工作点", "调整天馈系统的参数，实现阻抗匹配", "自动控制发射信号的频谱，将其保持在核准的必要带宽内"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0822", "q": "接收机解调器的作用是：", "options": ["从接收到的已调射频信号中分离出原始调制信号", "对接收到的射频信号进行宽带线性放大", "对接收到的射频信号进行与必要带宽相匹配的选频放大", "从接收到的已调制射频信号中提取出载波分量"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0823", "q": "选用解调器的主要应考因素是：", "options": ["尽量忠实地还原原始调制信号", "尽量对已调射频信号加以放大", "尽量提升已调射频信号中的载频分量", "尽量补偿接所收射频信号的频率偏移"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0824", "q": "亚音频静噪系统（CTCSS）所用的声调大体位于音频中的什么范围？", "options": ["67-250.3Hz", "16Hz-20kHz", "16kHz-20kHz", "220Hz-2503Hz"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0825", "q": "对于比较考究的接收机，其说明书中常常列出一项“通带矩形系数”或“通带形状系数”指标，是用来描述：", "options": ["带通滤波器频率特性曲线两侧斜坡的陡峭程度", "矩形波信号通过滤波器后波形两侧的陡峭程度", "矩形波信号通过滤波器后谐波成分的损失程度", "带通晶体滤波器中石英晶体的切割方向和形状"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0826", "q": "根据说明书给出的技术指标，两台业余无线电接收机在USB方式下选择带宽为2.7kHz的滤波器时具有不同的“通带矩形系数”。接收机A的“60dB带宽对6dB带宽的矩形系数”为3.8，接收机B的为5。由此可得出结论：", "options": ["A机对邻近频道干扰的抑制能力比B机强", "A机对邻近频道干扰的抑制能力比B机差", "A机对镜像频率干扰的抑制能力比B机强", "A机对偏离工作频率±10kHz以外的干扰信号的抑制能力比B机强"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0827", "q": "接收机前置放大器的主要作用是：", "options": ["降低接收机内部噪声的影响", "提高接收机最终的音频输出功率电平", "提高接收机音频输出的保真度", "提高接收机的动态范围"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0828", "q": "进行FM话音通联时，我们能否单凭接收机中传出的对方的声音大小来准确判断对方的信号有多强？", "options": ["不能。鉴频器所解调的声音，其大小仅取决于中频信号的频偏，与中频信号的幅度无关。况且，中频信号在进入鉴频器之前早已被限幅电路切齐，已无法鉴别强弱", "不能。信号越强，自动增益控制的起控程度就越深。增益的急剧下降反而会压低音量", "能。最终的信号就是经过放大处理的原始射频信号，当然是信号越强声音越大", "能。调频信号的特点是信号越强频偏越大，解调之后的声音当然也越大"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0829", "q": "用设置在NFM方式的对讲机接收WFM信号，效果为：", "options": ["可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真", "听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失", "可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音", "可以正常听到信号，只是声音比较小"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0830", "q": "用设置在WFM方式的对讲机接收NFM信号，效果为：", "options": ["可以正常听到信号，只是声音比较小", "可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真", "听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失", "可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0831", "q": "没有信号时，调频接收机会输出一种强烈的沙沙声。关于这种噪声，以下描述正确的是：", "options": ["天线收到的QRN与机内电路的固有噪声共同构成一种随机信号。该信号的随机相位变化经鉴频形成强烈的沙沙声。只是，该信号的随机幅度变化与沙沙声没有关系", "由天线收到的QRN的随机幅度变化经放大形成，其大小与QRN的电压成正比", "由天线收到的QRN的随机幅度变化经放大形成，其大小与QRN的电压的平方成正比", "由天线收到的QRN的随机幅度变化经放大形成，其大小与QRN的电压的平方根成正比"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0832", "q": "下列哪种电路可以解调FM信号？", "options": ["鉴频器", "限幅器", "乘积检波器", "混频器"], ": ["A", "B", "C"]}, {"id": "MC1-0843", "q": "超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出NFM方式时的第一中频为47.25MHz，那么在145.00MHz收到的镜频干扰可能来自：", "options": ["239.50MHz或50.50MHz", "192.25MHz或97.75MHz", "50.50MHz或101.00MHz", "151.50MHz或.202.00MHz"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0844", "q": "超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出NFM接收所用的第一中频为47.25MHz，那么在435.00MHz收到的镜频干扰可能来自：", "options": ["340.50MHz或529.50MHz", "387.75MHz或482.25MHz", "47.25MHz或94.50MHz", "141.70MHz或.236.25MHz"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0845", "q": "超外差式收信机所收信号的频率要比本振频率低（或高）一个中频。然而，比本振频率高（或低）一个中频的另一个遥相对应的信号也可能经混频窜入中频通道，形成“镜像频率干扰”或“镜频干扰”。如果某对讲机的技术规格书给出的UHF接收机第一中频为58.525MHz，那么在435.00MHz收到的镜频干扰可能来自：", "options": ["317.95MHz或552.05MHz", "376.475MHz或493.525MHz", "58.525MHz或117.05MHz", "234.10.05MHz或.468.20MHz"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0846", "q": "业余无线电发射机的效率是指：", "options": ["输出到天线系统的信号功率与发射机所消耗的电源功率之比", "通信对象的接收天线得到的信号功率与发射机所消耗的电源功率之比", "通信对象的接收天线得到的信号功率与发射机输出到天线系统的信号功率之比", "输出到天线系统的有用信号功率与到达天线的包含杂散等无用信号的总功率之比"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0847", "q": "业余无线电发射机的效率总是明显低于1。所损耗的那部分能量：", "options": ["绝大部分转化为热量，极小一部分转化为杂散等无用信号", "绝大部分转化为杂散等无用信号并对外辐射", "绝大部分因阻抗失配而返回电源，极小一部分转化为热量对外散发", "损耗的能量在电容、电感、开关器件等零部件中消失了"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0848", "q": "若一部业余无线电台的工作电压为直流13.8伏，FM方式的射频输出功率为N瓦，电源效率约为80%，则发射时的工作电流约为：", "options": ["0.091×Ｎ（安）", "13.8×Ｎ（安）", "13.8/Ｎ×80%（安）", "0.058×Ｎ（安）"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0849", "q": "若一部业余无线电台的工作电压为交流220伏，FM方式的射频输出功率为N瓦，电源效率约为80%，则发射时的工作电流约为：", "options": ["0.0057×Ｎ（安）", "220×Ｎ（安）", "200/Ｎ×80%（安）", "0.0036×Ｎ（安）"], "ans": [0], "classes": ["A", "B", "C"]}, {"id": "MC1-0850", "q": "若一部业余无线电台以FM方式发射时的射频输出功率为N瓦，电源效率约为80%，则每发射10秒钟所消耗的电能约为：", "options": ["0.0000035×Ｎ（千瓦小时）", "0.0768 /Ｎ（千瓦小时）", "0.0022×Ｎ（千瓦小 "id": "MC1-1097", "q": "业余自制电路作品时，爱好者们常将一个大容量电容与一个或若干个小容量电容相并联，共同用作放大器的旁路电容或是供电线路中的滤波电容。这样做主要考虑的是：", "options": ["在工作频率较低时，大容量电容起主要作用。随着频率升高，大容量电容的损耗变得不可忽略，而此时小容量电容开始发挥作用。这可以拓展电路的工作带宽", "防止大容量电容因日久漏液而逐渐损失容量。事先加个小容量电容可以提升保险系数", "利用电容器并联则容量相加的原理获取更为准确的容量值，以利精准旁路，精确滤波", "利用电容器并联则耐压相加的原理，整体提高电路，特别是车载电路的过压耐受能力"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1098", "q": "设将一个电容量为1000微法的电容器跨接在电路上，不会严重影响该电路工作或不至引发安全风险的做法为：", "options": ["跨接在13.8伏直流电源的输出端上", "跨接在HF收发信机的天线插座两端", "跨接在阻抗为8欧姆的扬声器两端", "跨接在220伏交流电源的插座两端"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1101", "q": "电感的品质因数Q是电感量与损耗电阻之比。关于Q值，以下描述正确的是：", "options": ["电感的Q值过低带来功率损失并会影响电路的其他相关特性", "电感的Q值过低影响射频功率，但是不影响电路的其他特性", "电感的Q值与LC谐振回路的Q值无关。后者才是真正的Q", "电感量确定，则Q值已笃定。二者为正比关系"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1102", "q": "用适当磁性材料制作的磁芯电感，损耗小于同等电感量的空心电感。这是因为：", "options": ["加入磁芯后可用较短的导线达成所需的电感量，减少导线电阻引致的发热损耗", "磁芯比空气更容易散热，电感的发热损耗由此降低", "磁芯可将原来损耗的能量反射回导线", "加入磁芯可改善导线趋肤效应引致的局部电流密度增大问题，从而降低热损耗"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1103", "q": "设将一个电感值为100微亨的线圈跨接在电路上，不会严重影响该电路工作或不至引发安全风险的做法为：", "options": ["跨接在HF收发信机的天线插座两端", "跨接在220伏交流电源的插座两端", "跨接在13.8伏直流电源的输出端上", "跨接在阻抗为8欧姆的扬声器两端"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1106", "q": "单刀双掷（SPDT）开关是我们常用的一种开关元件。“单刀双掷”是指什么？", "options": ["将某个电路选择接入另外两个电路中的一个", "很明显，就是接通或断开一个电路", "很明显，就是接通或断开两个电路", "将两个电路选择接入其分别对应的另外两个电路中的一个"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1107", "q": "以下哪种元件可以保护电路中的其他元件免受过电流的冲击？", "options": ["熔断器", "MOS管", "电子管", "电容"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1111", "q": "如果利用开关器件来控制继电器的衔铁线圈通电与否，例如是将线圈接在三极管的集电极电路中，则可能发生的情况是：", "options": ["在三极管关断的瞬间，集电极可能承受远高于电源电压的高电压冲击", "在三极管导通的瞬间，集电极可能承受远高于电源电压的高电压冲击", "在三极管关断的瞬间，集电极可能承受远大于导通电流的大电流冲击", "在三极管导通的瞬间，集电极可能承受远大于导通电流的大电流冲击"], "ans": [0], "classes": ["B", "C"]}, {"id": "MC1-1112", "q": "如果利用开关器件来控制继电器的衔铁线圈通电与否，则线圈的两端需要并联一个小容量电容器或是一个反向偏置的二极管。其作用是：", "options": ["吸收继电器线圈在电路关断瞬间感应出的反向电动势以保护开关器件", "消除继电器触点通断时产生的火花干扰", "减少通过开关器件的工作电流", "减少继电器的磨损"
